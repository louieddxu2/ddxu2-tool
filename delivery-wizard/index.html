<div id="view-settings" class="view-section hidden">
  <h2 class="text-xl font-bold mb-4">資料與規則管理</h2>
  <div class="bg-white rounded-2xl shadow-sm border overflow-hidden mb-4">
    <button onclick="openRuleModal()" class="w-full p-4 border-b flex justify-between items-center active:bg-slate-50 transition-colors">
      <div class="flex items-center gap-3">
        <div class="bg-amber-100 text-amber-600 p-2 rounded-lg"><i data-lucide="settings-2" class="w-5 h-5"></i></div>
        <span class="font-medium text-slate-700">平台獎金規則管理</span>
      </div>
      <i data-lucide="chevron-right" class="w-5 h-5 text-slate-300"></i>
    </button>
    <button onclick="exportCSV()" class="w-full p-4 border-b flex justify-between items-center active:bg-slate-50">
      <div class="flex items-center gap-3">
        <div class="bg-blue-100 text-blue-600 p-2 rounded-lg"><i data-lucide="download" class="w-5 h-5"></i></div>
        <span class="font-medium text-slate-700">匯出 CSV 檔案</span>
      </div>
      <i data-lucide="chevron-right" class="w-5 h-5 text-slate-300"></i>
    </button>
    <button onclick="clearAllData()" class="w-full p-4 text-red-500 flex justify-between items-center active:bg-slate-50">
      <div class="flex items-center gap-3">
        <div class="bg-red-100 text-red-600 p-2 rounded-lg"><i data-lucide="trash-2" class="w-5 h-5"></i></div>
        <span class="font-medium text-slate-700">清空所有帳號與資料</span>
      </div>
      <i data-lucide="chevron-right" class="w-5 h-5 text-slate-300"></i>
    </button>
  </div>
</div>

<div id="rule-modal" class="fixed inset-0 z-[120] hidden flex-col justify-end transition-opacity duration-300 opacity-0">
  <div class="absolute inset-0 bg-slate-900/50" onclick="closeRuleModal()"></div>
  <div class="bg-slate-50 rounded-t-3xl p-5 w-full max-w-md mx-auto transform translate-y-full transition-transform duration-300 relative z-10 h-[90vh] flex flex-col" id="rule-modal-content">
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-xl font-bold">獎金規則管理</h3>
      <button onclick="closeRuleModal()" class="p-1 bg-white rounded-full shadow-sm"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    
    <div class="flex gap-2 mb-4">
      <button onclick="syncTemplate('foodpanda')" class="flex-1 bg-pink-50 text-panda border border-pink-200 py-2 rounded-xl text-xs font-bold">一鍵同步 Foodpanda</button>
      <button onclick="syncTemplate('ubereats')" class="flex-1 bg-green-50 text-uber border border-green-200 py-2 rounded-xl text-xs font-bold">一鍵同步 UberEats</button>
    </div>

    <div id="rule-list" class="flex-grow overflow-y-auto space-y-4 pb-10">
      </div>

    <button onclick="addNewRule()" class="mt-4 w-full bg-slate-800 text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-2">
      <i data-lucide="plus-circle" class="w-5 h-5"></i> 手動新增自訂規則
    </button>
  </div>
</div>

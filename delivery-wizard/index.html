<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>跑單紀錄神器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.542.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { 'panda': '#d70f64', 'uber': '#06C167' } } } }
  </script>
  <style>
    ::-webkit-scrollbar { width: 0; background: transparent; }
    body { -webkit-tap-highlight-color: transparent; }
    .tab-active { color: #d70f64; font-weight: bold; }
    .tab-inactive { color: #94a3b8; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col relative">

  <header class="bg-panda text-white p-4 shadow-md sticky top-0 z-20">
    <div class="max-w-md mx-auto flex items-center justify-between text-center">
      <div class="w-9"></div>
      <h1 class="text-lg font-bold">跑單紀錄神器</h1>
      <div class="w-9"></div>
    </div>
  </header>

  <main class="flex-grow w-full max-w-md mx-auto p-4 pb-28 overflow-y-auto">
    <div id="view-home" class="view-section block">
      <div class="flex justify-between items-center mb-4">
        <div class="bg-pink-100 text-panda px-3 py-1.5 rounded-lg text-sm font-bold" id="display-date">讀取中...</div>
        <button onclick="openAccountModal()" class="flex items-center gap-1.5 bg-white border border-pink-200 text-panda px-3 py-1.5 rounded-full shadow-sm">
          <i data-lucide="user" class="w-4 h-4"></i><span id="current-account-name" class="text-sm font-bold">...</span>
        </button>
      </div>

      <div class="grid grid-cols-2 gap-3 mb-6">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col"><div class="text-slate-500 text-xs mb-1">今日單數</div><div class="text-xl font-bold text-blue-500" id="home-orders">0 單</div></div>
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col"><div class="text-slate-500 text-xs mb-1">今日收入</div><div class="text-xl font-bold text-green-500" id="home-income">NT$0</div></div>
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col"><div class="text-slate-500 text-xs mb-1">今日時薪</div><div class="text-xl font-bold text-amber-500" id="home-wage">NT$0</div></div>
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col"><div class="text-slate-500 text-xs mb-1">今日工時</div><div class="text-xl font-bold text-purple-500" id="home-hours">0 h</div></div>
      </div>

      <div class="flex justify-between items-center mb-3">
        <h2 class="text-lg font-bold">平台進度</h2>
        <button onclick="openRuleModal()" class="text-xs font-bold text-slate-500 flex items-center gap-1 bg-white border px-2 py-1 rounded">管理規則</button>
      </div>

      <div id="fp-progress-card" class="bg-white p-4 rounded-2xl shadow-sm border mb-6 relative overflow-hidden hidden">
        <div id="progress-platform-tag" class="absolute top-0 right-0 px-3 py-1 rounded-bl-lg font-bold text-white text-xs">Foodpanda</div>
        <div class="flex justify-between items-end mb-2 mt-2">
          <span class="text-sm font-bold" id="progress-rule-name">...</span>
          <span class="text-xs font-bold text-panda" id="home-fp-total">0 單</span>
        </div>
        <div class="font-bold text-slate-700 text-sm mb-1" id="home-fp-distance">差 -- 單</div>
        <div class="w-full bg-slate-100 rounded-full h-2"><div class="h-2 rounded-full transition-all" id="home-fp-bar"></div></div>
      </div>
      <div id="no-rule-card" class="bg-slate-100 p-4 rounded-2xl text-center text-sm mb-6 border border-dashed">今日無規則</div>

      <div class="grid grid-cols-2 gap-3">
        <button onclick="openModal()" class="bg-pink-50 text-panda p-4 rounded-2xl font-bold active:scale-95">新增紀錄</button>
        <button onclick="switchTab('stats')" class="bg-blue-50 text-blue-600 p-4 rounded-2xl font-bold active:scale-95">統計圖表</button>
      </div>
    </div>

    <div id="view-records" class="view-section hidden"><h2 class="text-xl font-bold mb-4">歷史紀錄</h2><div id="records-list"></div></div>
    <div id="view-stats" class="view-section hidden"><h2 class="text-xl font-bold mb-4">統計趨勢</h2><div class="bg-white p-4 rounded-2xl border h-52 mb-4"><canvas id="incomeChart"></canvas></div><div id="platform-analysis"></div></div>
    <div id="view-settings" class="view-section hidden"><h2 class="text-xl font-bold mb-4">資料管理</h2><div class="bg-white border rounded-2xl overflow-hidden"><button onclick="exportCSV()" class="w-full p-4 border-b">匯出 CSV</button><button onclick="clearAllData()" class="w-full p-4 text-red-500">清空資料</button></div></div>
  </main>

  <div id="add-modal" class="fixed inset-0 z-[100] hidden flex-col justify-end opacity-0 transition-all"><div class="absolute inset-0 bg-black/50" onclick="closeModal()"></div><div class="bg-white rounded-t-3xl p-5 relative z-10" id="add-modal-content"><form onsubmit="handleFormSubmit(event)"><input type="date" id="form-date" class="w-full p-3 border mb-3 rounded-xl"><input type="number" id="form-orders" placeholder="單數" class="w-full p-3 border mb-3 rounded-xl"><input type="number" id="form-income" placeholder="收入" class="w-full p-3 border mb-3 rounded-xl"><input type="number" id="form-hours" step="0.1" placeholder="工時" class="w-full p-3 border mb-3 rounded-xl"><button class="w-full bg-panda text-white p-4 rounded-xl font-bold">儲存</button></form></div></div>
  <div id="rule-modal" class="fixed inset-0 z-[110] hidden flex-col justify-end opacity-0 transition-all"><div class="absolute inset-0 bg-black/50" onclick="closeRuleModal()"></div><div class="bg-white rounded-t-3xl p-5 h-[80vh] flex flex-col relative z-10" id="rule-modal-content"><div class="flex justify-between mb-4"><h3 class="font-bold">規則清單</h3><button onclick="closeRuleModal()">X</button></div><div class="flex gap-2 mb-4"><button onclick="syncRuleTemplate('foodpanda')" class="flex-1 bg-pink-50 p-2 rounded text-xs">同步熊貓</button><button onclick="syncRuleTemplate('ubereats')" class="flex-1 bg-green-50 p-2 rounded text-xs">同步UE</button></div><div id="rule-list" class="flex-grow overflow-y-auto"></div></div></div>
  <div id="edit-rule-modal" class="fixed inset-0 z-[120] hidden flex-col justify-end opacity-0 transition-all"><div class="absolute inset-0 bg-black/50" onclick="closeEditRuleModal()"></div><div class="bg-white rounded-t-3xl p-5 h-[80vh] flex flex-col relative z-10" id="edit-rule-modal-content"><h3 class="font-bold mb-4" id="edit-rule-title">編輯規則</h3><input type="hidden" id="edit-rule-id"><select id="edit-rule-platform" class="w-full p-3 border mb-3 rounded-xl"><option value="foodpanda">Foodpanda</option><option value="ubereats">UberEats</option></select><input type="text" id="edit-rule-name" placeholder="名稱" class="w-full p-3 border mb-3 rounded-xl"><div id="edit-rule-days" class="flex gap-2 mb-3"></div><div id="edit-rule-tiers" class="mb-3"></div><button onclick="saveRuleForm()" class="bg-panda text-white p-4 rounded-xl font-bold">儲存</button></div></div>
  <div id="account-modal" class="fixed inset-0 z-[130] hidden flex-col justify-end opacity-0 transition-all"><div class="absolute inset-0 bg-black/50" onclick="closeAccountModal()"></div><div class="bg-white rounded-t-3xl p-5 relative z-10"><div id="account-list" class="mb-4"></div><div class="flex gap-2"><input id="new-account-name" class="flex-grow p-3 border rounded-xl"><button onclick="handleAddAccount()" class="bg-panda text-white px-4 rounded-xl">新增</button></div></div></div>

  <nav class="bg-white border-t fixed bottom-0 w-full z-40 pb-safe">
    <div class="max-w-md mx-auto flex justify-around p-2">
      <button onclick="switchTab('home')" class="nav-btn tab-active text-xs" data-target="home">首頁</button>
      <button onclick="switchTab('records')" class="nav-btn text-xs" data-target="records">紀錄</button>
      <button onclick="switchTab('stats')" class="nav-btn text-xs" data-target="stats">統計</button>
      <button onclick="switchTab('settings')" class="nav-btn text-xs" data-target="settings">設定</button>
    </div>
  </nav>

  <script src="db.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>

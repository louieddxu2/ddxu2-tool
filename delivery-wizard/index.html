<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>跑單紀錄神器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.542.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='8' fill='%23d70f64'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#d70f64">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>
    tailwind.config = { theme: { extend: { colors: { 'panda': '#d70f64', 'uber': '#06C167' } } } }
  </script>
  <style>
    ::-webkit-scrollbar { width: 0; background: transparent; }
    body { -webkit-tap-highlight-color: transparent; }
    .tab-active { color: #d70f64; font-weight: bold; }
    .tab-inactive { color: #94a3b8; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col relative">

  <header class="bg-panda text-white p-4 shadow-md sticky top-0 z-20">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <a href="/" data-home-link class="p-2 -ml-2 hover:bg-pink-700 rounded-full transition-colors invisible pointer-events-none">
        <i data-lucide="home" class="w-5 h-5"></i>
      </a>
      <h1 class="text-lg font-bold tracking-tight">跑單紀錄神器</h1>
      <button type="button" onclick="requestNotification()" class="p-2 -mr-2 hover:bg-pink-700 rounded-full">
        <i data-lucide="bell" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <main class="flex-grow w-full max-w-md mx-auto p-4 pb-28 overflow-y-auto">
    <div id="view-home" class="view-section block">
      <div class="flex justify-between items-center mb-4">
        <div class="bg-pink-100 text-panda px-3 py-1.5 rounded-lg text-sm font-bold" id="display-date">讀取中...</div>
        <button onclick="openAccountModal()" class="flex items-center gap-1.5 bg-white border border-pink-200 text-panda px-3 py-1.5 rounded-full shadow-sm active:scale-95 transition-transform">
          <i data-lucide="user" class="w-4 h-4"></i>
          <span id="current-account-name" class="text-sm font-bold truncate max-w-[80px]">預設帳號</span>
          <i data-lucide="chevron-down" class="w-3 h-3"></i>
        </button>
      </div>

      <div class="grid grid-cols-2 gap-3 mb-6" id="home-stats-grid">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col">
          <div class="text-slate-500 text-xs flex items-center gap-1 mb-1"><i data-lucide="bike" class="w-3 h-3 text-blue-500"></i>今日單數</div>
          <div class="text-xl font-bold text-blue-500" id="home-orders">0 單</div>
        </div>
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col">
          <div class="text-slate-500 text-xs flex items-center gap-1 mb-1"><i data-lucide="dollar-sign" class="w-3 h-3 text-green-500"></i>今日收入</div>
          <div class="text-xl font-bold text-green-500" id="home-income">NT$0</div>
        </div>
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col">
          <div class="text-slate-500 text-xs flex items-center gap-1 mb-1"><i data-lucide="clock" class="w-3 h-3 text-amber-500"></i>今日時薪</div>
          <div class="text-xl font-bold text-amber-500" id="home-wage">NT$0/時</div>
        </div>
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col">
          <div class="text-slate-500 text-xs flex items-center gap-1 mb-1"><i data-lucide="timer" class="w-3 h-3 text-purple-500"></i>今日工時</div>
          <div class="text-xl font-bold text-purple-500" id="home-hours">0.0 h</div>
        </div>
      </div>

      <h2 class="text-lg font-bold text-slate-800 mb-3">平台週期進度</h2>
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 mb-6 relative overflow-hidden" id="fp-progress-card">
        <div class="absolute top-0 right-0 bg-panda text-white text-xs px-3 py-1 rounded-bl-lg font-bold">Foodpanda</div>
        <div class="flex justify-between items-end mb-2 mt-2"><span class="text-slate-500 text-sm">週日模式</span><span class="bg-pink-50 text-panda px-2 py-1 rounded text-xs font-bold" id="home-fp-total">累計 0 單</span></div>
        <div class="font-bold text-slate-700 mb-1" id="home-fp-distance">距離下一獎勵還差 15 單</div>
        <div class="w-full bg-slate-100 rounded-full h-2"><div class="bg-panda h-2 rounded-full transition-all" id="home-fp-bar" style="width: 0%"></div></div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <button onclick="openModal()" class="bg-pink-50 text-panda border border-pink-100 p-4 rounded-2xl flex flex-col items-center justify-center gap-2 active:scale-95 transition-transform">
          <div class="bg-panda text-white rounded-full p-1"><i data-lucide="plus" class="w-5 h-5"></i></div>
          <span class="font-bold text-sm">新增紀錄</span>
        </button>
        <button onclick="switchTab('stats')" class="bg-blue-50 text-blue-600 border border-blue-100 p-4 rounded-2xl flex flex-col items-center justify-center gap-2 active:scale-95 transition-transform">
          <div class="bg-blue-500 text-white rounded-full p-1"><i data-lucide="bar-chart-2" class="w-5 h-5"></i></div>
          <span class="font-bold text-sm">查看統計</span>
        </button>
      </div>
    </div>

    <div id="view-records" class="view-section hidden"><h2 class="text-xl font-bold mb-4">歷史紀錄</h2><div id="records-list" class="space-y-3"></div><div id="empty-records" class="hidden text-center py-10 text-slate-400">目前無紀錄</div></div>
    <div id="view-stats" class="view-section hidden"><h2 class="text-xl font-bold mb-4">趨勢統計</h2><div class="bg-white p-4 rounded-2xl mb-6 shadow-sm border"><div style="position: relative; height: 200px;"><canvas id="incomeChart"></canvas></div></div><div id="platform-analysis" class="space-y-3"></div></div>
    <div id="view-settings" class="view-section hidden"><h2 class="text-xl font-bold mb-4">資料管理</h2><div class="bg-white rounded-2xl shadow-sm border overflow-hidden"><button onclick="exportCSV()" class="w-full p-4 border-b flex justify-between items-center active:bg-slate-50">匯出 CSV</button><button onclick="clearAllData()" class="w-full p-4 text-red-500 flex justify-between items-center active:bg-slate-50">清空資料</button></div></div>
  </main>

  <nav class="bg-white border-t fixed bottom-0 w-full z-40 pb-safe">
    <div class="max-w-md mx-auto flex justify-around p-2">
      <button onclick="switchTab('home')" class="nav-btn tab-active flex flex-col items-center w-16" data-target="home"><i data-lucide="home" class="w-6 h-6 mb-1 pointer-events-none"></i><span class="text-[10px] pointer-events-none">首頁</span></button>
      <button onclick="switchTab('records')" class="nav-btn tab-inactive flex flex-col items-center w-16" data-target="records"><i data-lucide="list" class="w-6 h-6 mb-1 pointer-events-none"></i><span class="text-[10px] pointer-events-none">紀錄</span></button>
      <button onclick="switchTab('stats')" class="nav-btn tab-inactive flex flex-col items-center w-16" data-target="stats"><i data-lucide="bar-chart-2" class="w-6 h-6 mb-1 pointer-events-none"></i><span class="text-[10px] pointer-events-none">統計</span></button>
      <button onclick="switchTab('settings')" class="nav-btn tab-inactive flex flex-col items-center w-16" data-target="settings"><i data-lucide="wallet" class="w-6 h-6 mb-1 pointer-events-none"></i><span class="text-[10px] pointer-events-none">薪資</span></button>
    </div>
  </nav>

  <div id="add-modal" class="fixed inset-0 z-[100] hidden flex-col justify-end transition-opacity duration-300 opacity-0">
    <div class="absolute inset-0 bg-slate-900/50" onclick="closeModal()"></div>
    <div class="bg-white rounded-t-3xl p-5 w-full max-w-md mx-auto transform translate-y-full transition-transform duration-300 relative z-10" id="add-modal-content">
      <div class="flex justify-between items-center mb-5"><h3 class="text-xl font-bold">新增跑單紀錄</h3><button onclick="closeModal()" class="p-1 bg-slate-100 rounded-full"><i data-lucide="x" class="w-5 h-5"></i></button></div>
      <form id="record-form" onsubmit="handleFormSubmit(event)">
        <div class="flex gap-3 mb-5">
          <label class="flex-1 cursor-pointer"><input type="radio" name="platform" value="foodpanda" class="peer hidden" checked><div class="py-3 text-center rounded-xl border-2 peer-checked:border-panda peer-checked:bg-pink-50 peer-checked:text-panda font-bold">Foodpanda</div></label>
          <label class="flex-1 cursor-pointer"><input type="radio" name="platform" value="ubereats" class="peer hidden"><div class="py-3 text-center rounded-xl border-2 peer-checked:border-uber peer-checked:bg-green-50 peer-checked:text-uber font-bold">UberEats</div></label>
        </div>
        <div class="grid grid-cols-2 gap-4 mb-6">
          <div class="col-span-2"><label class="text-sm font-bold block mb-1">日期</label><input type="date" id="form-date" required class="w-full bg-slate-50 border rounded-xl px-4 py-3"></div>
          <div><label class="text-sm font-bold block mb-1">單數</label><input type="number" id="form-orders" min="1" required class="w-full bg-slate-50 border rounded-xl px-4 py-3"></div>
          <div><label class="text-sm font-bold block mb-1">收入</label><input type="number" id="form-income" min="0" required class="w-full bg-slate-50 border rounded-xl px-4 py-3"></div>
          <div class="col-span-2"><label class="text-sm font-bold block mb-1">工時 (h)</label><input type="number" id="form-hours" step="0.1" min="0.1" required class="w-full bg-slate-50 border rounded-xl px-4 py-3"></div>
        </div>
        <button type="submit" class="w-full bg-panda text-white py-4 rounded-xl font-bold text-lg">儲存紀錄</button>
      </form>
    </div>
  </div>

  <div id="account-modal" class="fixed inset-0 z-[110] hidden flex-col justify-end transition-opacity duration-300 opacity-0">
    <div class="absolute inset-0 bg-slate-900/50" onclick="closeAccountModal()"></div>
    <div class="bg-white rounded-t-3xl p-5 w-full max-w-md mx-auto transform translate-y-full transition-transform duration-300 relative z-10" id="account-modal-content">
      <div class="flex justify-between items-center mb-5"><h3 class="text-xl font-bold">切換外送帳號</h3><button onclick="closeAccountModal()" class="p-1 bg-slate-100 rounded-full"><i data-lucide="x" class="w-5 h-5"></i></button></div>
      <div id="account-list" class="space-y-2 mb-6 max-h-60 overflow-y-auto">
        </div>
      <div class="border-t pt-4">
        <label class="text-xs font-bold text-slate-400 uppercase mb-2 block">新增帳號</label>
        <div class="flex gap-2">
          <input type="text" id="new-account-name" placeholder="輸入姓名或標籤" class="flex-grow bg-slate-50 border rounded-xl px-4 py-3 outline-none focus:border-panda">
          <button onclick="handleAddAccount()" class="bg-panda text-white px-6 rounded-xl font-bold">新增</button>
        </div>
      </div>
    </div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>

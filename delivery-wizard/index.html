  <script>
    /* 自動註冊規則與首頁探測邏輯 */
    (function autoRegister() {
      let appPath = window.location.pathname;
      if (appPath.endsWith('index.html')) appPath = appPath.replace('index.html', '');
      if (!appPath.endsWith('/')) appPath += '/';
      if (appPath === '/') return;
      try {
        localStorage.setItem('myAppLauncherLastPath', appPath);
        localStorage.setItem('myAppLauncherLastSeenAt', String(Date.now()));
      } catch {}
      const launcherPath = appPath.replace(/[^/]+\/$/, '');
      const normalizedLauncherPath = launcherPath || '/';
      function configureHomeLinkAndProbe() {
        const homeLinks = Array.from(document.querySelectorAll('[data-home-link]'));
        const homeHref = normalizedLauncherPath.includes('?') ? `${normalizedLauncherPath}&home=1` : `${normalizedLauncherPath}?home=1`;
        homeLinks.forEach(el => el.setAttribute('href', homeHref));
        if (window.location.protocol === 'file:') return;
        const probeUrl = normalizedLauncherPath.endsWith('/') ? `${normalizedLauncherPath}index.html` : `${normalizedLauncherPath}/index.html`;
        const revealHome = () => { homeLinks.forEach(el => el.classList.remove('invisible', 'pointer-events-none')); };
        fetch(probeUrl, { method: 'HEAD' }).then(res => {
          if (res.ok) { revealHome(); return; }
          if (res.status === 405) { return fetch(probeUrl, { method: 'GET' }).then(r => { if (r.ok) revealHome(); }); }
        }).catch(() => {});
      }
      if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', configureHomeLinkAndProbe, { once: true }); } 
      else { configureHomeLinkAndProbe(); }
      const appMeta = {
        id: 'delivery-wizard', name: '跑單紀錄神器', nameZh: '跑單紀錄神器', nameEn: 'Delivery Wizard',
        path: appPath, icon: 'bike', color: 'rose'
      };
      const storageKey = 'myAppLauncherStorage';
      const launcherData = JSON.parse(localStorage.getItem(storageKey) || '[]');
      const existingIndex = launcherData.findIndex(app => app.path === appMeta.path);
      if (existingIndex === -1) launcherData.push(appMeta);
      else launcherData[existingIndex] = { ...launcherData[existingIndex], ...appMeta };
      localStorage.setItem(storageKey, JSON.stringify(launcherData));
    })();
  </script>

  <script>
    lucide.createIcons();

    const DB_NAME = 'DeliveryWizardDB';
    const STORE_NAME = 'records';
    let dbInstance = null;
    let currentData = [];
    let chartInstance = null;

    async function initDB() {
      if (dbInstance) return dbInstance;
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            const store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
            store.createIndex('date', 'date', { unique: false });
          }
        };
        request.onsuccess = (e) => { dbInstance = e.target.result; resolve(dbInstance); };
        request.onerror = (e) => reject(e.target.error);
      });
    }

    async function getAllRecords() {
      try {
        const db = await initDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const req = store.getAll();
          req.onsuccess = () => resolve(req.result.sort((a,b) => b.timestamp - a.timestamp));
          req.onerror = () => reject(req.error);
        });
      } catch (err) { console.warn(err); return []; }
    }

    async function saveRecord(record) {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const req = store.put(record);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    async function deleteRecordDB(id) {
      const db = await initDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete(id).onsuccess = () => resolve();
      });
    }

    async function clearDB() {
      const db = await initDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).clear().onsuccess = () => resolve();
      });
    }

    function getTodayString() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    }

    function formatCurrency(num) { return `NT$${num.toLocaleString()}`; }

    async function loadAndUpdateUI() {
      currentData = await getAllRecords();
      updateHome();
      updateRecordsList();
      updateStats(document.getElementById('stat-date-picker').value);
    }

    function updateHome() {
      const today = getTodayString();
      const todayData = currentData.filter(d => d.date === today);
      let tOrders = 0, tIncome = 0, tHours = 0;
      todayData.forEach(d => { tOrders += d.orders; tIncome += d.income; tHours += d.hours; });
      const tWage = tHours > 0 ? Math.round(tIncome / tHours) : 0;

      document.getElementById('home-orders').innerText = `${tOrders} 單`;
      document.getElementById('home-income').innerText = formatCurrency(tIncome);
      document.getElementById('home-hours').innerText = `${tHours.toFixed(1)} 小時`;
      document.getElementById('home-wage').innerText = `${formatCurrency(tWage)}/時`;

      const fpData = currentData.filter(d => d.platform === 'foodpanda');
      const fpTotalOrders = fpData.reduce((sum, d) => sum + d.orders, 0);
      const nextTarget = Math.ceil((fpTotalOrders + 1) / 15) * 15;
      const distance = nextTarget - fpTotalOrders;
      const progress = ((15 - distance) / 15) * 100;

      document.getElementById('home-fp-total').innerText = `累計 ${fpTotalOrders} 單`;
      document.getElementById('home-fp-distance').innerText = `距離下一獎勵還差 ${distance} 單`;
      document.getElementById('home-fp-bar').style.width = `${progress}%`;
    }

    function updateRecordsList() {
      const listEl = document.getElementById('records-list');
      const emptyEl = document.getElementById('empty-records');
      if (currentData.length === 0) {
        listEl.innerHTML = ''; emptyEl.classList.remove('hidden'); return;
      }
      emptyEl.classList.add('hidden');
      listEl.innerHTML = currentData.map(record => {
        const isFp = record.platform === 'foodpanda';
        const wage = record.hours > 0 ? Math.round(record.income / record.hours) : 0;
        return `
          <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center">
            <div class="flex items-center gap-3">
              <div class="w-2 h-10 rounded-full ${isFp ? 'bg-panda' : 'bg-uber'}"></div>
              <div>
                <div class="font-bold text-slate-700 text-sm">${record.date}</div>
                <div class="text-xs font-bold ${isFp ? 'text-panda bg-pink-50' : 'text-uber bg-green-50'} mt-0.5 px-2 py-0.5 rounded inline-block">${isFp ? 'Foodpanda' : 'UberEats'}</div>
              </div>
            </div>
            <div class="text-right">
              <div class="font-bold text-slate-800">${formatCurrency(record.income)}</div>
              <div class="text-xs text-slate-500">${record.orders}單 | ${record.hours}h | NT$${wage}/h</div>
            </div>
            <button type="button" onclick="deleteRecord('${record.id}')" class="ml-2 p-2 text-slate-300 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function updateStats(filterDate) {
      let filteredData = filterDate ? currentData.filter(d => d.date === filterDate) : currentData;
      function calcStats(platform) {
        const pData = platform ? filteredData.filter(d => d.platform === platform) : filteredData;
        const orders = pData.reduce((sum, d) => sum + d.orders, 0);
        const income = pData.reduce((sum, d) => sum + d.income, 0);
        const hours = pData.reduce((sum, d) => sum + d.hours, 0);
        return { orders, income, hours, wage: hours > 0 ? Math.round(income / hours) : 0 };
      }
      const fp = calcStats('foodpanda');
      document.getElementById('stat-fp-detail').innerText = `${fp.orders} 單 | ${formatCurrency(fp.income)} | ${fp.hours.toFixed(1)}h`;
      document.getElementById('stat-fp-wage').innerText = `${formatCurrency(fp.wage)}/h`;

      const uber = calcStats('ubereats');
      document.getElementById('stat-uber-detail').innerText = `${uber.orders} 單 | ${formatCurrency(uber.income)} | ${uber.hours.toFixed(1)}h`;
      document.getElementById('stat-uber-wage').innerText = `${formatCurrency(uber.wage)}/h`;
      drawChart();
    }

    function drawChart() {
      const canvas = document.getElementById('incomeChart');
      if(!canvas) return;
      const ctx = canvas.getContext('2d');
      if (chartInstance) chartInstance.destroy();
      const last10 = [...currentData].slice(0, 10).reverse();
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: last10.map(d => d.date.substring(5)),
          datasets: [{
            label: '收入', data: last10.map(d => d.income),
            borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)',
            borderWidth: 2, fill: true, tension: 0.3, pointBackgroundColor: '#3b82f6'
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { x: { grid: { display: false } }, y: { beginAtZero: true, border: { dash: [4, 4] } } }
        }
      });
    }

    window.handleFormSubmit = async function(e) {
      e.preventDefault();
      const isFp = document.querySelector('input[name="platform"]:checked').value === 'foodpanda';
      const record = {
        id: document.getElementById('edit-id').value || 'rec_' + Date.now(),
        timestamp: Date.now(),
        platform: isFp ? 'foodpanda' : 'ubereats',
        date: document.getElementById('form-date').value,
        orders: parseInt(document.getElementById('form-orders').value, 10),
        income: parseInt(document.getElementById('form-income').value, 10),
        hours: parseFloat(document.getElementById('form-hours').value)
      };
      await saveRecord(record);
      closeModal();
      loadAndUpdateUI();
      document.getElementById('record-form').reset();
      document.getElementById('form-date').value = getTodayString();
      document.getElementById('edit-id').value = '';
    };

    window.deleteRecord = async function(id) {
      if(confirm('確定要刪除這筆紀錄嗎？')) {
        await deleteRecordDB(id);
        loadAndUpdateUI();
      }
    };

    window.clearAllData = async function() {
      if(confirm('警告：這將會清除設備上所有的資料且無法恢復！確定要繼續嗎？')) {
        await clearDB();
        loadAndUpdateUI();
        alert('資料已清空');
      }
    };

    window.exportCSV = function() {
      if(currentData.length === 0) return alert('沒有資料可以匯出');
      let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
      csvContent += "日期,平台,單數,收入,工時(小時),時薪\n";
      currentData.forEach(r => {
        const wage = r.hours > 0 ? Math.round(r.income/r.hours) : 0;
        csvContent += `${r.date},${r.platform},${r.orders},${r.income},${r.hours},${wage}\n`;
      });
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `外送記帳_${getTodayString()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    // 正確的切換與彈窗動畫邏輯
    window.switchTab = function(tabId) {
      document.querySelectorAll('.view-section').forEach(el => {
        el.classList.add('hidden');
        el.classList.remove('block');
      });
      document.getElementById(`view-${tabId}`).classList.remove('hidden');
      document.getElementById(`view-${tabId}`).classList.add('block');

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('tab-active');
        btn.classList.add('tab-inactive');
      });
      document.querySelector(`.nav-btn[data-target="${tabId}"]`).classList.add('tab-active');

      const fab = document.getElementById('fab-add');
      if(tabId === 'records') fab.classList.remove('hidden');
      else fab.classList.add('hidden');
    };

    window.openModal = function() {
      const modal = document.getElementById('add-modal');
      const content = document.getElementById('add-modal-content');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      void modal.offsetWidth; // 觸發重繪
      modal.classList.remove('opacity-0');
      content.classList.remove('translate-y-full');
    };

    window.closeModal = function() {
      const modal = document.getElementById('add-modal');
      const content = document.getElementById('add-modal-content');
      modal.classList.add('opacity-0');
      content.classList.add('translate-y-full');
      setTimeout(() => {
        modal.classList.remove('flex');
        modal.classList.add('hidden');
      }, 300);
    };

    window.requestNotification = function() {
      if (!("Notification" in window)) { alert("此瀏覽器不支援桌面通知"); return; }
      if (Notification.permission === "granted") { alert("通知已啟用！"); } 
      else if (Notification.permission !== "denied") {
        Notification.requestPermission().then(permission => {
          if (permission === "granted") alert("通知設定成功！");
        });
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      const todayStr = getTodayString();
      const weekDays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
      document.getElementById('display-date').innerText = `今日：${todayStr.replace(/-/g, '/')} ${weekDays[new Date().getDay()]}`;
      document.getElementById('form-date').value = todayStr;
      document.getElementById('stat-date-picker').value = todayStr;
      document.getElementById('stat-date-picker').addEventListener('change', (e) => updateStats(e.target.value));
      loadAndUpdateUI();
    });
  </script>
</body>
</html>

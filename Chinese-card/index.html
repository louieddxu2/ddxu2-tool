<!doctype html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>卡牌翻譯圖庫 (終極抗干擾版)</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.542.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/idb-keyval@6/dist/umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <link rel="stylesheet" href="style.css" />
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%2310b981' d='M2 3a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V3zm2-1v10h8V2H4z'/%3E%3C/svg%3E" />
  <meta name="theme-color" content="#10b981" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>

<body
  class="bg-slate-50 text-slate-800 h-[100dvh] grid grid-rows-[auto_1fr] md:flex md:flex-row overflow-hidden relative">
  <!-- Sidebar (Desktop) / Header (Mobile) -->
  <aside class="w-full md:w-80 bg-white border-r border-slate-200 flex flex-col z-20 shadow-xl md:shadow-none shrink-0">

    <!-- Compact Mode Bar (Hidden by default) -->
    <div id="compact-bar" class="hidden bg-emerald-600 text-white p-1 flex items-center gap-1 shadow-md z-30">
      <div class="relative flex-[2] min-w-0">
        <input type="text" id="compact-inp-game" placeholder="遊戲"
          class="bg-emerald-700/50 border-none text-[10px] rounded-lg px-2 py-1.5 w-full outline-none placeholder:text-emerald-200"
          readonly />
        <div id="compact-drop-game" class="hidden"></div>
      </div>
      <div class="relative flex-[2] min-w-0">
        <input type="text" id="compact-inp-type" placeholder="類型"
          class="bg-emerald-700/50 border-none text-[10px] rounded-lg px-2 py-1.5 w-full outline-none placeholder:text-emerald-200"
          readonly />
        <div id="compact-drop-type" class="hidden"></div>
      </div>
      <input type="text" id="compact-inp-number" placeholder="搜尋..."
        class="flex-[3] min-w-0 bg-emerald-700/50 border-none text-[10px] rounded-lg px-2 py-1.5 outline-none placeholder:text-emerald-200" />

      <div class="flex items-center gap-0.5 shrink-0 ml-1">
        <a href="https://translate.google.com/?sl=auto&tl=zh-TW&op=images" target="_blank"
          class="p-1.5 hover:bg-emerald-700 rounded-lg" title="Google 翻譯">
          <i data-lucide="languages" class="w-4 h-4"></i>
        </a>
        <button onclick="document.getElementById('file-upload').click()" class="p-1.5 hover:bg-emerald-700 rounded-lg"
          title="匯入圖片">
          <i data-lucide="image-plus" class="w-4 h-4"></i>
        </button>
        <button onclick="toggleCompactMode()" class="p-1.5 hover:bg-emerald-700 rounded-lg" title="結束簡潔模式">
          <i data-lucide="maximize-2" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
    <header id="sidebar-header-normal" class="bg-emerald-600 text-white p-1.5 px-3 shadow-md shrink-0 relative">
      <div class="flex items-center justify-between w-full">
        <a href="/" data-home-link
          class="p-1.5 -ml-1.5 hover:bg-emerald-700 rounded-full transition-colors invisible pointer-events-none"
          aria-label="返回目錄">
          <i data-lucide="home" class="w-4 h-4"></i>
        </a>
        <h1 class="text-sm font-bold tracking-tight">卡牌翻譯圖庫</h1>
        <div class="flex items-center gap-0.5 -mr-1">
          <button onclick="openSyncModal()" class="relative p-1.5 hover:bg-emerald-700 rounded-full transition-colors" title="即時同步">
            <i data-lucide="users" class="w-4 h-4"></i>
            <span id="sync-active-dot" class="hidden absolute top-0 right-0 w-2 h-2 bg-emerald-400 rounded-full border border-emerald-600 animate-pulse"></span>
          </button>
          <button onclick="exportData()" class="p-1.5 hover:bg-emerald-700 rounded-full transition-colors" title="匯出資料">
            <i data-lucide="download" class="w-4 h-4"></i>
          </button>
          <button onclick="openImportModal()"
            class="p-1.5 hover:bg-emerald-700 rounded-full cursor-pointer transition-colors" title="匯入資料">
            <i data-lucide="upload" class="w-4 h-4"></i>
          </button>
          <button onclick="toggleCompactMode()" class="p-1.5 hover:bg-emerald-700 rounded-full transition-colors"
            title="進入簡潔模式">
            <i data-lucide="minimize-2" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </header>

    <div id="search-section-normal" class="p-2 flex flex-col gap-2 overflow-y-auto max-h-[40vh] md:max-h-none">
      <section class="bg-slate-50 rounded-xl p-2 border border-slate-100 flex flex-col gap-1.5">
        <div class="grid grid-cols-2 gap-1.5">
          <div class="relative w-full" id="wrap-game">
            <input type="text" id="inp-game" placeholder="遊戲名稱"
              class="bg-white border border-slate-200 text-xs rounded-lg pl-2 pr-7 py-1.5 w-full outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer truncate transition-all duration-300"
              readonly />
            <div id="icon-game" class="absolute inset-y-0 right-1.5 flex items-center pointer-events-none text-slate-400 transition-colors">
              <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
            </div>
            <div id="drop-game"
              class="absolute z-50 mt-1 w-full flex-col bg-white shadow-lg overflow-y-auto max-h-48 rounded-lg border border-slate-200 hidden divide-y divide-slate-100">
            </div>
          </div>
          <div class="relative w-full" id="wrap-type">
            <input type="text" id="inp-type" placeholder="卡牌類型"
              class="bg-white border border-slate-200 text-xs rounded-lg pl-2 pr-7 py-1.5 w-full outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer truncate"
              readonly />
            <div class="absolute inset-y-0 right-1.5 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
            </div>
            <div id="drop-type"
              class="absolute z-50 mt-1 w-full flex-col bg-white shadow-lg overflow-y-auto max-h-48 rounded-lg border border-slate-200 hidden divide-y divide-slate-100">
            </div>
          </div>
        </div>
        <input type="text" id="inp-number" placeholder="編號或名稱"
          class="bg-white border border-slate-200 text-xs rounded-lg px-2 py-1.5 w-full outline-none focus:ring-2 focus:ring-emerald-500" />

        <div class="mt-0.5 flex gap-1.5 h-10">
          <a href="https://translate.google.com/?sl=auto&tl=zh-TW&op=images" target="_blank"
            class="flex-[3] bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg flex items-center gap-2 px-2 transition-colors active:scale-95 shadow-sm">
            <i data-lucide="languages" class="w-4 h-4 shrink-0"></i>
            <div class="flex flex-col items-start leading-none gap-0.5">
              <span class="text-[10px] font-bold">Google 翻譯</span>
              <span class="text-[8px] opacity-70">截圖分享回此 App</span>
            </div>
          </a>
          <button onclick="document.getElementById('file-upload').click()"
            class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-500 rounded-lg flex items-center justify-center transition-all active:scale-90"
            title="從相簿匯入圖片">
            <i data-lucide="image-plus" class="w-4 h-4"></i>
          </button>
        </div>
      </section>

      <div id="empty-state" class="text-center py-2 text-slate-400 hidden">
        <i data-lucide="image" class="w-5 h-5 mx-auto mb-1 opacity-30"></i>
        <p class="text-[9px]">目前無搜尋結果</p>
      </div>
    </div>

    <!-- Stationary Info Bar: Now located at the bottom of the search/header section -->
    <div id="gallery-footer"
      class="h-12 shrink-0 bg-white border-t border-slate-200 shadow-sm flex items-center px-4 z-30">
      <!-- Content injected by JS -->
    </div>
  </aside>

  <!-- Gallery Main (Scroll Snapping) -->
  <main id="view-main" class="flex-grow md:h-full min-h-0 min-w-0 relative flex flex-col bg-slate-50 overflow-hidden">
    <!-- Scrolling Images -->
    <div id="gallery-container" class="flex-grow min-h-0 overflow-y-auto scroll-smooth snap-y snap-mandatory">
      <div id="gallery-grid" class="grid grid-cols-1 h-full" style="grid-auto-rows: 100%;"></div>
    </div>
  </main>

  <input type="file" id="file-upload" accept="image/*" class="hidden" />

  <div id="view-crop" class="fixed inset-0 bg-slate-900 z-50 hidden flex flex-col">
    <header class="bg-slate-900 text-white flex flex-col w-full z-10 shrink-0 border-b border-slate-800">
      <div class="px-4 py-3 flex items-center justify-between w-full">
        <button onclick="cancelCrop()" class="text-slate-400 font-medium shrink-0">
          取消
        </button>

        <div class="text-xs font-bold text-slate-300">裁切與比例</div>
        <button onclick="processCrop()" class="text-emerald-400 font-bold shrink-0">
          完成裁切
        </button>
      </div>
    </header>
    <div class="flex-grow relative overflow-hidden bg-black flex items-center justify-center" id="crop-container">
      <div id="crop-loading"
        class="absolute inset-0 bg-black/80 z-30 flex flex-col items-center justify-center text-white hidden">
        <div class="loader rounded-full border-4 border-slate-700 h-10 w-10 mb-4"></div>
        <p class="text-sm" id="crop-loading-text">處理中...</p>
      </div>
      <div class="relative" id="canvas-wrapper">
        <canvas id="canvas-source" class="block max-w-full max-h-full"></canvas>
        <svg class="crop-lines" id="crop-svg">
          <polygon id="crop-polygon" points="" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="2"
            stroke-dasharray="4" />
        </svg>
      </div>
    </div>

    <!-- Bottom Ratio Bar -->
    <footer class="bg-slate-900 border-t border-slate-800 z-10 shrink-0 pb-safe">
      <div class="px-2 py-3 w-full">
        <div class="flex items-stretch gap-2 w-full max-w-lg mx-auto h-[60px]">
          <!-- Left: Orientation toggle (1 part) -->
          <button id="btn-orientation" onclick="toggleOrientation()"
            class="flex-1 flex flex-col items-center justify-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-slate-400 rounded-xl transition-colors active:enabled:bg-slate-700"
            title="切換直/橫向">
            <i data-lucide="smartphone" id="icon-portrait" class="w-5 h-5"></i>
            <i data-lucide="smartphone" id="icon-landscape" class="w-5 h-5 hidden" style="transform: rotate(90deg)"></i>
            <span class="text-[10px] font-bold" id="text-orientation">預設 (直)</span>
          </button>

          <!-- Middle: Preset ratios scroll (3 parts) -->
          <div
            class="flex-[3] relative overflow-hidden flex rounded-xl border border-slate-800 min-w-0 bg-slate-800/50">
            <div style="
                  mask-image: linear-gradient(
                    to right,
                    transparent,
                    black 16px,
                    black calc(100% - 16px),
                    transparent
                  );
                  -webkit-mask-image: linear-gradient(
                    to right,
                    transparent,
                    black 16px,
                    black calc(100% - 16px),
                    transparent
                  );
                " class="w-full h-full">
              <div
                class="flex gap-2 h-full overflow-x-auto snap-x snap-mandatory [&::-webkit-scrollbar]:hidden [-ms-overflow-style:none] [scrollbar-width:none] items-center px-[calc(50%-2.75rem)]"
                id="ratio-buttons" style="overscroll-behavior-x: none;">
                <button type="button"
                  class="ratio-btn snap-center shrink-0 w-[5.5rem] py-1.5 rounded-xl flex flex-col items-center justify-center gap-0.5 bg-emerald-600 text-white"
                  data-ratio="63:88">
                  <span class="text-sm font-medium leading-none">標準</span>
                  <span class="text-[10px] opacity-80 leading-none">(63x88)</span>
                </button>
                <button type="button"
                  class="ratio-btn snap-center shrink-0 w-[5.5rem] py-1.5 rounded-xl flex flex-col items-center justify-center gap-0.5 bg-slate-800 text-slate-300"
                  data-ratio="59:92">
                  <span class="text-sm font-medium leading-none">歐式</span>
                  <span class="text-[10px] opacity-80 leading-none">(59x92)</span>
                </button>
                <button type="button"
                  class="ratio-btn snap-center shrink-0 w-[5.5rem] py-1.5 rounded-xl flex flex-col items-center justify-center gap-0.5 bg-slate-800 text-slate-300"
                  data-ratio="59:86">
                  <span class="text-sm font-medium leading-none">日式</span>
                  <span class="text-[10px] opacity-80 leading-none">(59x86)</span>
                </button>
                <button type="button"
                  class="ratio-btn snap-center shrink-0 w-[5.5rem] py-1.5 rounded-xl flex flex-col items-center justify-center gap-0.5 bg-slate-800 text-slate-300"
                  data-ratio="70:120">
                  <span class="text-sm font-medium leading-none">塔羅</span>
                  <span class="text-[10px] opacity-80 leading-none">(70x120)</span>
                </button>
                <button type="button"
                  class="ratio-btn snap-center shrink-0 w-[5.5rem] py-1.5 rounded-xl flex flex-col items-center justify-center gap-0.5 bg-slate-800 text-slate-300"
                  data-ratio="41:63">
                  <span class="text-sm font-medium leading-none">美式迷你</span>
                  <span class="text-[10px] opacity-80 leading-none">(41x63)</span>
                </button>
                <button type="button"
                  class="ratio-btn snap-center shrink-0 w-[5.5rem] py-1.5 rounded-xl flex flex-col items-center justify-center gap-0.5 bg-slate-800 text-slate-300"
                  data-ratio="44:68">
                  <span class="text-sm font-medium leading-none">迷你歐式</span>
                  <span class="text-[10px] opacity-80 leading-none">(44x68)</span>
                </button>
                <button type="button"
                  class="ratio-btn snap-center shrink-0 w-[5.5rem] py-1.5 rounded-xl flex flex-col items-center justify-center gap-0.5 bg-slate-800 text-slate-300"
                  data-ratio="80:120">
                  <span class="text-sm font-medium leading-none">大尺寸</span>
                  <span class="text-[10px] opacity-80 leading-none">(80x120)</span>
                </button>
                <button type="button"
                  class="ratio-btn snap-center shrink-0 w-[5.5rem] py-1.5 rounded-xl flex flex-col items-center justify-center gap-0.5 bg-slate-800 text-slate-300"
                  data-ratio="1:1">
                  <span class="text-sm font-medium leading-none">正方</span>
                  <span class="text-[10px] opacity-80 leading-none">(1:1)</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Right: Custom ratio (1 part) -->
          <div
            class="flex-1 bg-slate-800 rounded-xl flex flex-col items-center justify-center gap-1 p-1 border border-slate-700 active:bg-slate-700 transition-colors cursor-pointer"
            id="custom-ratio-box" onclick="setCustomActive()">
            <span class="text-[10px] text-slate-400 font-bold leading-none mt-0.5">自訂比例</span>
            <div class="flex items-center justify-center leading-none w-full px-1">
              <input type="number" id="custom-w" value="1" min="1"
                class="w-full min-w-0 bg-slate-900 rounded outline-none text-center h-5 text-xs font-medium text-slate-200 p-0 shadow-inner" />
              <span class="text-slate-500 text-[10px] mx-0.5">:</span>
              <input type="number" id="custom-h" value="2" min="1"
                class="w-full min-w-0 bg-slate-900 rounded outline-none text-center h-5 text-xs font-medium text-slate-200 p-0 shadow-inner" />
            </div>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <div id="modal-import"
    class="fixed inset-0 bg-slate-900/60 z-50 hidden items-center justify-center p-4 backdrop-blur-sm"
    onclick="closeImportModal()">
    <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-xl flex flex-col gap-4"
      onclick="event.stopPropagation()">
      <h3 class="text-xl font-bold mb-2">資料匯入</h3>

      <label
        class="flex items-center gap-4 p-4 bg-slate-50 hover:bg-emerald-50 rounded-2xl cursor-pointer transition-colors border border-slate-200">
        <i data-lucide="file-archive" class="w-6 h-6 text-emerald-600"></i>
        <div class="flex-1">
          <div class="font-bold">匯入備份檔 (.zip)</div>
          <div class="text-xs text-slate-500">從本系統匯出的備份包裹</div>
        </div>
        <input type="file" accept=".zip" class="hidden" onchange="
              closeImportModal();
              processZipFile(this.files[0]);
              this.value = '';
            " />
      </label>

      <label
        class="flex items-center gap-4 p-4 bg-slate-50 hover:bg-emerald-50 rounded-2xl cursor-pointer transition-colors border border-slate-200">
        <i data-lucide="folder-tree" class="w-6 h-6 text-emerald-600"></i>
        <div class="flex-1">
          <div class="font-bold">匯入圖片資料夾</div>
          <div class="text-xs text-slate-500">
            支援 /遊戲/類型/編號.png 結構
          </div>
        </div>
        <input type="file" webkitdirectory directory class="hidden" onchange="
              closeImportModal();
              processBrowserFiles(this.files);
              this.value = '';
            " />
      </label>

      <label
        class="flex items-center gap-4 p-4 bg-slate-50 hover:bg-emerald-50 rounded-2xl cursor-pointer transition-colors border border-slate-200">
        <i data-lucide="images" class="w-6 h-6 text-emerald-600"></i>
        <div class="flex-1">
          <div class="font-bold">匯入單/多張圖片</div>
          <div class="text-xs text-slate-500">直接選取圖檔批量匯入</div>
        </div>
        <input type="file" multiple accept="image/*" class="hidden" onchange="
              closeImportModal();
              processBrowserFiles(this.files);
              this.value = '';
            " />
      </label>

      <button onclick="closeImportModal()"
        class="mt-2 w-full py-3 text-slate-500 font-medium bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors">
        取消
      </button>
    </div>
  </div>

  <div id="modal-import-config"
    class="fixed inset-0 bg-slate-900/60 z-50 hidden items-center justify-center p-4 backdrop-blur-sm"
    onclick="cancelImportConfig()">
    <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-xl flex flex-col gap-4"
      onclick="event.stopPropagation()">
      <h3 class="text-xl font-bold mb-2">匯入分類設定</h3>
      <p class="text-sm text-slate-500" id="import-config-count">
        找到圖片，請決定如何分類：
      </p>

      <div class="flex flex-col gap-3">
        <label class="flex items-center gap-2 text-sm font-medium text-slate-700 cursor-pointer">
          <input type="radio" name="import_mode" value="auto" checked class="text-emerald-600 focus:ring-emerald-500"
            onchange="toggleImportManual(false)" />
          從資料夾結構自動推斷 (遊戲/類型)
        </label>

        <label class="flex items-center gap-2 text-sm font-medium text-slate-700 cursor-pointer">
          <input type="radio" name="import_mode" value="manual" class="text-emerald-600 focus:ring-emerald-500"
            onchange="toggleImportManual(true)" />
          全部統一指定：
        </label>

        <div class="pl-6 flex flex-col gap-2 opacity-50 pointer-events-none transition-opacity"
          id="import-manual-inputs">
          <div class="relative w-full" id="wrap-import-game">
            <input type="text" id="import-game" placeholder="遊戲名稱"
              class="bg-slate-50 border p-2 rounded-lg outline-none focus:border-emerald-500 text-sm w-full cursor-pointer truncate"
              readonly />
            <div id="drop-import-game"
              class="absolute z-50 mt-1 w-full flex-col bg-white shadow-lg overflow-y-auto max-h-48 rounded-lg border border-slate-200 hidden divide-y divide-slate-100">
            </div>
          </div>
          <div class="relative w-full" id="wrap-import-type">
            <input type="text" id="import-type" placeholder="卡牌類型"
              class="bg-slate-50 border p-2 rounded-lg outline-none focus:border-emerald-500 text-sm w-full cursor-pointer truncate"
              readonly />
            <div id="drop-import-type"
              class="absolute z-50 mt-1 w-full flex-col bg-white shadow-lg overflow-y-auto max-h-48 rounded-lg border border-slate-200 hidden divide-y divide-slate-100">
            </div>
          </div>
        </div>
      </div>

      <div class="flex gap-2 mt-2">
        <button onclick="cancelImportConfig()"
          class="flex-1 py-3 text-slate-500 font-medium bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors">
          取消
        </button>
        <button onclick="confirmImportConfig()"
          class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold transition-colors">
          開始匯入
        </button>
      </div>
    </div>
  </div>

  <div id="modal-edit-overlay" class="fixed inset-0 z-[55] hidden bg-transparent" onclick="closeEditModal()"></div>
  <div id="modal-edit"
    class="fixed z-[60] hidden bg-white shadow-2xl border-slate-200 overflow-y-auto left-0 top-0 w-full md:w-80 h-auto md:h-full border-b md:border-b-0 md:border-r flex-col"
    onclick="event.stopPropagation()">
    <div class="p-4 flex flex-col h-full gap-3">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold text-emerald-700">編輯卡牌</h3>
        <button onclick="closeEditModal()"
          class="p-1.5 hover:bg-slate-100 rounded-full text-slate-400 transition-colors">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="flex flex-col gap-3">
        <div class="grid grid-cols-2 gap-2">
          <div class="relative w-full" id="wrap-edit-game">
            <input type="text" id="edit-game" placeholder="遊戲名稱"
              class="bg-slate-50 border border-slate-200 text-xs rounded-lg pl-3 pr-8 py-2 w-full outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer truncate"
              readonly />
            <div class="absolute inset-y-0 right-2 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="chevron-down" class="w-3 h-3"></i>
            </div>
            <div id="drop-edit-game" class="hidden"></div>
          </div>
          <div class="relative w-full" id="wrap-edit-type">
            <input type="text" id="edit-type" placeholder="卡牌類型"
              class="bg-slate-50 border border-slate-200 text-xs rounded-lg pl-3 pr-8 py-2 w-full outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer truncate"
              readonly />
            <div class="absolute inset-y-0 right-2 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="chevron-down" class="w-3 h-3"></i>
            </div>
            <div id="drop-edit-type" class="hidden"></div>
          </div>
        </div>

        <input type="text" id="edit-number" placeholder="編號或名稱"
          class="bg-white border border-slate-200 text-xs rounded-lg px-3 py-2 w-full outline-none focus:ring-2 focus:ring-emerald-500" />

        <textarea id="edit-memo" placeholder="備註 (選填)..."
          class="bg-white border border-slate-200 text-xs rounded-lg px-3 py-2 w-full h-8 min-h-[32px] outline-none focus:ring-2 focus:ring-emerald-500 resize-none transition-all duration-200"
          oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"
          onfocus="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
      </div>

      <div class="flex gap-2 mt-2 pt-3 border-t border-slate-100">
        <button onclick="closeEditModal()"
          class="flex-1 py-2 text-slate-500 text-xs font-bold hover:bg-slate-50 rounded-lg transition-colors">
          取消
        </button>
        <button onclick="saveEdit()"
          class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold shadow-sm transition-all active:scale-95">
          儲存
        </button>
      </div>
    </div>
  </div>

  <div id="modal-preview"
    class="fixed inset-0 bg-black/95 z-[100] hidden items-center justify-center p-4 backdrop-blur-md cursor-zoom-out"
    onclick="closeFullPreview()">
    <div class="relative w-full h-full flex items-center justify-center" onclick="event.stopPropagation()">
      <img id="preview-img" src="" alt="Preview" class="max-w-full max-h-full object-contain shadow-2xl rounded-sm" />
      <button class="absolute top-4 right-4 p-2 bg-white/10 hover:bg-white/20 text-white rounded-full transition-colors"
        onclick="closeFullPreview()">
        <i data-lucide="x" class="w-6 h-6"></i>
      </button>
    </div>
  </div>

  <!-- Sync Modal -->
  <div id="modal-sync" class="hidden fixed inset-0 z-[200000] items-end sm:items-center justify-center p-4 pb-safe pointer-events-none">
    <div class="fixed inset-0 bg-transparent pointer-events-auto" onclick="closeSyncModal()"></div>
    <div class="bg-white rounded-[2rem] shadow-[0_20px_60px_-15px_rgba(0,0,0,0.2)] w-full max-w-sm relative z-10 overflow-hidden animate-in slide-in-from-bottom-8 sm:zoom-in-95 duration-300 pointer-events-auto border border-slate-100 mb-4 sm:mb-0">
      <div class="p-6">
        <div class="flex items-center justify-between mb-6">
          <h3 class="text-xl font-black text-slate-800">即時同步房間</h3>
          <button onclick="closeSyncModal()" class="p-2 hover:bg-slate-100 rounded-full">
            <i data-lucide="x" class="w-5 h-5 text-slate-400"></i>
          </button>
        </div>

        <div id="sync-initial" class="space-y-4">
          <button onclick="startHost()" class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-bold flex items-center justify-center gap-3 transition-all active:scale-95 shadow-lg shadow-emerald-200">
            <i data-lucide="plus-circle" class="w-6 h-6"></i>
            建立同步房間 (Host)
          </button>
          <div class="relative">
            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-100"></div></div>
            <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-slate-400">或者</span></div>
          </div>
          <div class="flex gap-2">
            <input type="text" id="sync-join-id" placeholder="輸入房號..." class="flex-grow bg-slate-50 border-2 border-slate-100 rounded-xl px-4 py-3 outline-none focus:border-emerald-500 transition-colors">
            <button onclick="joinRoomManually()" class="bg-slate-800 text-white px-6 rounded-xl font-bold hover:bg-slate-900 active:scale-95">加入</button>
          </div>
        </div>

        <!-- Host View (Always shows QR) -->
        <div id="sync-hosting" class="hidden flex flex-col items-center space-y-5">
          <div class="p-3 bg-white border-2 border-slate-100 rounded-[2rem] shadow-sm">
            <div id="sync-qrcode" class="w-48 h-48 rounded-xl overflow-hidden"></div>
          </div>
          <div class="text-center w-full">
            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">房間 ID</p>
            <div class="flex items-center justify-center gap-2 bg-slate-50 py-2 rounded-xl border border-slate-100">
              <span id="sync-my-id" class="text-lg font-mono font-black text-emerald-600 tracking-widest"></span>
            </div>
            <!-- Connection Status for Host -->
            <div id="sync-host-status" class="mt-4 px-4 py-2 bg-emerald-50 text-emerald-700 rounded-lg text-sm font-bold flex items-center justify-center gap-2 hidden">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="sync-host-count">已連線 (1人)</span>
            </div>
          </div>
          <button onclick="stopHost()" class="w-full py-3 bg-red-50 text-red-600 font-bold hover:bg-red-100 rounded-xl transition-colors active:scale-95">關閉並銷毀房間</button>
        </div>

        <!-- Client View (Toast-like success) -->
        <div id="sync-connected" class="hidden flex flex-col items-center py-8 space-y-4 text-center">
          <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center animate-bounce shadow-lg shadow-emerald-100">
            <i data-lucide="check" class="w-10 h-10"></i>
          </div>
          <div>
            <h4 class="text-xl font-black text-slate-800">連線成功！</h4>
            <p id="sync-status-text" class="text-sm font-medium text-slate-500 mt-2">即將自動返回...</p>
          </div>
          <div id="sync-progress-bar" class="hidden w-full bg-slate-100 rounded-full h-1.5 overflow-hidden mt-4">
            <div id="sync-progress-inner" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
          </div>
        </div>
        
        <div id="sync-log" class="w-full mt-6 text-[10px] font-mono text-slate-400 max-h-24 overflow-y-auto space-y-1 bg-slate-50 p-3 rounded-xl border border-slate-100 hidden">
          <!-- Sync logs will appear here -->
        </div>
      </div>
    </div>
  </div>

  <canvas id="canvas-processing" class="hidden"></canvas>

  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/db.js?v=16"></script>
  <script src="js/sync.js?v=16"></script>
  <script src="js/utils.js?v=16"></script>
  <script src="js/ui.js?v=16"></script>
  <script src="js/gallery.js?v=16"></script>
  <script src="js/io.js?v=16"></script>
  <script src="js/cropper.js?v=16"></script>
</body>

</html>

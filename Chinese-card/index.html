<!DOCTYPE html><html lang="zh-TW"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>卡牌翻譯圖庫 (智慧偵測版)</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.542.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/idb-keyval@6/dist/umd.js"></script>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%2310b981' d='M2 3a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V3zm2-1v10h8V2H4z'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#10b981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    ::-webkit-scrollbar { width: 0; background: transparent; }
    body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
    .crop-handle {
      width: 28px; height: 28px; background: rgba(16, 185, 129, 0.9);
      border: 3px solid white; border-radius: 50%; position: absolute;
      transform: translate(-50%, -50%); cursor: grab; touch-action: none; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .crop-handle:active { cursor: grabbing; transform: translate(-50%, -50%) scale(1.3); }
    svg.crop-lines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .loader { border-top-color: #10b981; -webkit-animation: spinner 1s linear infinite; animation: spinner 1s linear infinite; }
    @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style></head><body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col relative">

  <script>
    (function autoRegister() {
      let appPath = window.location.pathname;
      if (appPath.endsWith('index.html')) appPath = appPath.replace('index.html', '');
      if (!appPath.endsWith('/')) appPath += '/';
      if (appPath === '/') return;
      try {
        localStorage.setItem('myAppLauncherLastPath', appPath);
        localStorage.setItem('myAppLauncherLastSeenAt', String(Date.now()));
      } catch {}
      const launcherPath = appPath.replace(/[^/]+\/$/, '');
      const normalizedLauncherPath = launcherPath || '/';
      function configureHomeLinkAndProbe() {
        const homeLinks = Array.from(document.querySelectorAll('[data-home-link]'));
        const homeHref = normalizedLauncherPath.includes('?') ? `${normalizedLauncherPath}&home=1` : `${normalizedLauncherPath}?home=1`;
        homeLinks.forEach(el => el.setAttribute('href', homeHref));
        if (window.location.protocol === 'file:') return;
        const probeUrl = normalizedLauncherPath.endsWith('/') ? `${normalizedLauncherPath}index.html` : `${normalizedLauncherPath}/index.html`;
        fetch(probeUrl, { method: 'HEAD' }).then(res => {
          if (res.ok) homeLinks.forEach(el => el.classList.remove('invisible', 'pointer-events-none'));
        }).catch(() => {});
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', configureHomeLinkAndProbe, { once: true });
      else configureHomeLinkAndProbe();

      const appMeta = { id: 'bg-card-cropper-smart', name: '卡牌翻譯圖庫', nameZh: '卡牌翻譯圖庫', nameEn: 'Card Cropper', path: appPath, icon: 'scan-text', color: 'emerald' };
      const storageKey = 'myAppLauncherStorage';
      const launcherData = JSON.parse(localStorage.getItem(storageKey) || '[]');
      const existingIndex = launcherData.findIndex(app => app.path === appMeta.path);
      if (existingIndex === -1) launcherData.push(appMeta);
      else launcherData[existingIndex] = { ...launcherData[existingIndex], ...appMeta };
      localStorage.setItem(storageKey, JSON.stringify(launcherData));
    })();
  </script>

  <header class="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-20">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <a href="/" data-home-link class="p-2 -ml-2 hover:bg-emerald-700 rounded-full transition-colors invisible pointer-events-none" aria-label="返回目錄">
        <i data-lucide="home" class="w-5 h-5"></i>
      </a>
      <h1 class="text-lg font-bold tracking-tight">卡牌翻譯圖庫</h1>
      <button onclick="exportData()" class="p-2 -mr-2 hover:bg-emerald-700 rounded-full transition-colors">
        <i data-lucide="download" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <main id="view-main" class="flex-grow w-full max-w-md mx-auto p-4 flex flex-col gap-4 pb-24">
    <section class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm flex flex-col gap-3">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">檢索與建檔</h2>
      <div class="grid grid-cols-2 gap-2">
        <input type="text" id="inp-game" list="list-games" placeholder="遊戲名稱" class="bg-slate-50 border border-slate-200 text-sm rounded-lg px-3 py-2 w-full outline-none focus:ring-2 focus:ring-emerald-500">
        <datalist id="list-games"></datalist>
        <input type="text" id="inp-type" list="list-types" placeholder="卡牌類型" class="bg-slate-50 border border-slate-200 text-sm rounded-lg px-3 py-2 w-full outline-none focus:ring-2 focus:ring-emerald-500">
        <datalist id="list-types"></datalist>
      </div>
      <input type="text" id="inp-number" placeholder="編號或名稱" class="bg-slate-50 border border-slate-200 text-sm rounded-lg px-3 py-2 w-full outline-none focus:ring-2 focus:ring-emerald-500">
      
      <div class="mt-1 flex gap-2">
        <button onclick="document.getElementById('file-upload').click()" class="flex-1 bg-emerald-600 text-white py-2.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 active:scale-95 transition-transform">
          <i data-lucide="camera" class="w-4 h-4"></i> 新增圖片
        </button>
        <a href="https://translate.google.com/?sl=auto&tl=zh-TW&op=images" target="_blank" class="px-4 bg-slate-100 text-slate-600 rounded-xl flex items-center justify-center">
          <i data-lucide="languages" class="w-4 h-4"></i>
        </a>
      </div>
    </section>

    <section id="gallery-grid" class="flex flex-col gap-4"></section>
    <div id="empty-state" class="text-center py-10 text-slate-400 hidden">
      <i data-lucide="image" class="w-12 h-12 mx-auto mb-2 opacity-50"></i>
      <p class="text-sm">尚未建立卡牌</p>
    </div>
  </main>

  <input type="file" id="file-upload" accept="image/*" class="hidden">

  <div id="view-crop" class="fixed inset-0 bg-slate-900 z-50 hidden flex flex-col">
    <header class="bg-slate-900 text-white p-4 flex items-center justify-between">
      <button onclick="cancelCrop()" class="text-slate-400">取消</button>
      <select id="sel-ratio" class="bg-slate-800 text-white text-sm rounded-lg px-2 py-1 outline-none border border-slate-700">
        <option value="63:88">標準 (63x88)</option>
        <option value="44:68">迷你 (44x68)</option>
        <option value="70:120">塔羅 (70x120)</option>
        <option value="1:1">正方形 (1:1)</option>
      </select>
      <button onclick="processCrop()" class="text-emerald-400 font-bold">完成裁切</button>
    </header>
    <div class="flex-grow relative overflow-hidden bg-black flex items-center justify-center" id="crop-container">
      <div id="crop-loading" class="absolute inset-0 bg-black/80 z-30 flex flex-col items-center justify-center text-white hidden">
        <div class="loader rounded-full border-4 border-slate-700 h-10 w-10 mb-4"></div>
        <p class="text-sm" id="crop-loading-text">處理中...</p>
      </div>
      <div class="relative" id="canvas-wrapper">
        <canvas id="canvas-source" class="block max-w-full max-h-full"></canvas>
        <svg class="crop-lines" id="crop-svg"><polygon id="crop-polygon" points="" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="2" stroke-dasharray="4" /></svg>
      </div>
    </div>
  </div>

  <div id="modal-edit" class="fixed inset-0 bg-slate-900/60 z-50 hidden items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-3xl w-full max-w-xs p-6 shadow-xl">
      <h3 class="text-lg font-bold mb-4">編輯卡牌資訊</h3>
      <div class="flex flex-col gap-3 mb-6">
        <input type="text" id="edit-game" placeholder="遊戲" class="bg-slate-50 border p-3 rounded-xl outline-none focus:border-emerald-500">
        <input type="text" id="edit-type" placeholder="類型" class="bg-slate-50 border p-3 rounded-xl outline-none focus:border-emerald-500">
        <input type="text" id="edit-number" placeholder="編號/名稱" class="bg-slate-50 border p-3 rounded-xl outline-none focus:border-emerald-500">
      </div>
      <div class="flex gap-2">
        <button onclick="closeEditModal()" class="flex-1 py-3 text-slate-500 font-medium">取消</button>
        <button onclick="saveEdit()" class="flex-1 py-3 bg-emerald-600 text-white rounded-xl font-bold">儲存</button>
      </div>
    </div>
  </div>

  <canvas id="canvas-processing" class="hidden"></canvas>

  <script>
    lucide.createIcons();
    let dbCards = [];
    let points = []; 
    let originalImgWidth, originalImgHeight, displayRatio;
    let cvReady = false;
    let editingId = null;

    const loadCV = () => {
      const s = document.createElement('script');
      s.src = 'https://docs.opencv.org/4.8.0/opencv.js';
      s.async = true; s.onload = () => { cvReady = true; };
      document.head.appendChild(s);
    };
    loadCV();

    const els = ['inp-game', 'inp-type', 'sel-ratio'];
    els.forEach(id => {
      const el = document.getElementById(id);
      el.value = localStorage.getItem('bg_last_' + id) || el.value;
      el.addEventListener('change', () => localStorage.setItem('bg_last_' + id, el.value));
    });

    const renderGallery = () => {
      const gQ = document.getElementById('inp-game').value.toLowerCase();
      const tQ = document.getElementById('inp-type').value.toLowerCase();
      const nQ = document.getElementById('inp-number').value.toLowerCase();

      const filtered = dbCards.filter(c => 
        c.game.toLowerCase().includes(gQ) && c.type.toLowerCase().includes(tQ) && c.number.toLowerCase().includes(nQ)
      ).sort((a,b) => b.timestamp - a.timestamp);

      const grid = document.getElementById('gallery-grid');
      grid.innerHTML = '';
      document.getElementById('empty-state').classList.toggle('hidden', filtered.length > 0);

      filtered.forEach(c => {
        const url = URL.createObjectURL(c.blob);
        const div = document.createElement('div');
        div.className = 'bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm relative';
        div.innerHTML = `
          <img src="${url}" class="w-full h-auto block" onload="URL.revokeObjectURL('${url}')">
          <div class="absolute top-3 right-3 flex gap-2">
            <button onclick="openEditModal('${c.id}')" class="p-2 bg-white/90 rounded-full shadow-lg text-slate-600"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
            <button onclick="deleteCard('${c.id}')" class="p-2 bg-white/90 rounded-full shadow-lg text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          </div>
          <div class="p-4 bg-gradient-to-t from-black/80 via-black/40 to-transparent absolute bottom-0 inset-x-0 text-white">
            <div class="text-xs opacity-70 mb-1">${c.game} · ${c.type}</div>
            <div class="font-bold text-lg">${c.number || '未命名'}</div>
          </div>
        `;
        grid.appendChild(div);
      });
      lucide.createIcons();
      updateDatalists();
    };

    const updateDatalists = () => {
      const gs = [...new Set(dbCards.map(c => c.game))].filter(Boolean);
      document.getElementById('list-games').innerHTML = gs.map(g => `<option value="${g}">`).join('');
      const ts = [...new Set(dbCards.filter(c => c.game === document.getElementById('inp-game').value).map(c => c.type))].filter(Boolean);
      document.getElementById('list-types').innerHTML = ts.map(t => `<option value="${t}">`).join('');
    };

    window.openEditModal = (id) => {
      const c = dbCards.find(x => x.id === id);
      if(!c) return;
      editingId = id;
      document.getElementById('edit-game').value = c.game;
      document.getElementById('edit-type').value = c.type;
      document.getElementById('edit-number').value = c.number;
      document.getElementById('modal-edit').classList.replace('hidden', 'flex');
    };
    window.closeEditModal = () => document.getElementById('modal-edit').classList.replace('flex', 'hidden');
    window.saveEdit = async () => {
      const idx = dbCards.findIndex(c => c.id === editingId);
      if(idx > -1) {
        dbCards[idx].game = document.getElementById('edit-game').value;
        dbCards[idx].type = document.getElementById('edit-type').value;
        dbCards[idx].number = document.getElementById('edit-number').value;
        await idbKeyval.set('bgCards', dbCards);
        renderGallery();
      }
      closeEditModal();
    };

    // 核心優化：智慧邊緣偵測
    const autoDetect = (w, h) => {
      let foundPts = null;
      if (cvReady) {
        try {
          const src = cv.imread('canvas-source');
          const gray = new cv.Mat();
          cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
          
          // 模糊處理以減少雜訊
          cv.GaussianBlur(gray, gray, new cv.Size(5, 5), 0);
          
          // 邊緣檢測
          cv.Canny(gray, gray, 50, 150);
          
          // 膨脹處理：把斷裂的邊緣連起來 (對抗同色背景)
          const M_dilate = cv.Mat.ones(3, 3, cv.CV_8U);
          cv.dilate(gray, gray, M_dilate, new cv.Point(-1, -1), 1);
          
          const contours = new cv.MatVector();
          const hier = new cv.Mat();
          cv.findContours(gray, contours, hier, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

          // 取得目標長寬比
          const ratioStr = document.getElementById('sel-ratio').value.split(':');
          const targetRatio = parseInt(ratioStr[0]) / parseInt(ratioStr[1]);
          let bestScore = -1;

          for (let i = 0; i < contours.size(); i++) {
            const cnt = contours.get(i);
            const area = cv.contourArea(cnt);
            if (area < (w * h * 0.08)) continue; // 忽略太小的區塊

            // 將輪廓轉換為點陣列
            let ptsArr = [];
            for(let j=0; j<cnt.rows; j++) {
              ptsArr.push({x: cnt.data32S[j*2], y: cnt.data32S[j*2+1]});
            }

            // 四極點演算法：尋找對角線極端值，自動無視圓角！
            let tl = ptsArr.reduce((a, b) => (a.x+a.y) < (b.x+b.y) ? a : b); // 左上
            let br = ptsArr.reduce((a, b) => (a.x+a.y) > (b.x+b.y) ? a : b); // 右下
            let tr = ptsArr.reduce((a, b) => (a.x-a.y) > (b.x-b.y) ? a : b); // 右上
            let bl = ptsArr.reduce((a, b) => (a.x-a.y) < (b.x-b.y) ? a : b); // 左下

            const currentPts = [tl, tr, br, bl];

            // 計算當下形狀的視覺長寬比
            const avgW = (Math.hypot(tr.x-tl.x, tr.y-tl.y) + Math.hypot(br.x-bl.x, br.y-bl.y)) / 2;
            const avgH = (Math.hypot(bl.x-tl.x, bl.y-tl.y) + Math.hypot(br.x-tr.x, br.y-tr.y)) / 2;
            const currentRatio = avgW / avgH;

            // 比例評分 (允許 90 度橫擺的可能)
            const ratioDiff = Math.abs(currentRatio - targetRatio);
            const invRatioDiff = Math.abs((1/currentRatio) - targetRatio);
            const bestRatioMatch = Math.max(0, 1 - Math.min(ratioDiff, invRatioDiff));

            // 總分 = 面積 * 比例吻合度
            const score = area * bestRatioMatch;

            if (score > bestScore) {
              bestScore = score;
              foundPts = currentPts;
            }
          }
          src.delete(); gray.delete(); M_dilate.delete(); contours.delete(); hier.delete();
        } catch(e) { console.error("CV Error:", e); }
      }
      
      // 若失敗，給定預設完美矩形
      if (!foundPts) {
        const px = w * 0.1, py = h * 0.1;
        foundPts = [{x:px, y:py}, {x:w-px, y:py}, {x:w-px, y:h-py}, {x:px, y:h-py}];
      }
      points = foundPts;
      setupHandles();
    };

    const setupHandles = () => {
      document.querySelectorAll('.crop-handle').forEach(h => h.remove());
      points.forEach((pt, i) => {
        const h = document.createElement('div');
        h.className = 'crop-handle';
        h.style.left = pt.x * displayRatio + 'px';
        h.style.top = pt.y * displayRatio + 'px';
        const move = (e) => {
          const r = document.getElementById('canvas-wrapper').getBoundingClientRect();
          const touch = e.touches ? e.touches[0] : e;
          points[i].x = Math.max(0, Math.min(originalImgWidth, (touch.clientX - r.left) / displayRatio));
          points[i].y = Math.max(0, Math.min(originalImgHeight, (touch.clientY - r.top) / displayRatio));
          h.style.left = points[i].x * displayRatio + 'px';
          h.style.top = points[i].y * displayRatio + 'px';
          drawLines();
        };
        h.addEventListener('mousedown', () => { window.addEventListener('mousemove', move); });
        h.addEventListener('touchstart', (e) => { e.preventDefault(); window.addEventListener('touchmove', move); });
        window.addEventListener('mouseup', () => window.removeEventListener('mousemove', move));
        window.addEventListener('touchend', () => window.removeEventListener('touchmove', move));
        document.getElementById('canvas-wrapper').appendChild(h);
      });
      drawLines();
    };

    const drawLines = () => {
      const s = points.map(p => `${p.x * displayRatio},${p.y * displayRatio}`).join(' ');
      document.getElementById('crop-polygon').setAttribute('points', s);
    };

    const openCropView = (src) => {
      document.getElementById('view-crop').classList.remove('hidden');
      document.getElementById('crop-loading').classList.remove('hidden');
      document.getElementById('crop-loading-text').innerText = "定位中...";
      
      const img = new Image();
      img.onload = () => {
        const w = img.width > 1200 ? 1200 : img.width;
        const h = Math.round(img.height * (w / img.width));
        const canvas = document.getElementById('canvas-source');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        originalImgWidth = w; originalImgHeight = h;
        displayRatio = Math.min((window.innerWidth-32)/w, (window.innerHeight-160)/h);
        canvas.style.width = w * displayRatio + 'px';
        canvas.style.height = h * displayRatio + 'px';
        
        // 確保 OpenCV 載入完畢後再執行，避免首次開啟時太快點擊匯入
        const attemptDetect = () => {
          if(cvReady) {
            autoDetect(w, h);
            document.getElementById('crop-loading').classList.add('hidden');
          } else {
            setTimeout(attemptDetect, 200);
          }
        };
        attemptDetect();
      };
      img.src = src;
    };

    window.cancelCrop = () => document.getElementById('view-crop').classList.add('hidden');
    
    window.processCrop = async () => {
      document.getElementById('crop-loading').classList.remove('hidden');
      document.getElementById('crop-loading-text').innerText = "儲存中...";
      
      const ratio = document.getElementById('sel-ratio').value.split(':');
      const outW = 800; // 極致輕量
      const outH = Math.round(outW * (parseInt(ratio[1])/parseInt(ratio[0])));
      const outCvs = document.getElementById('canvas-processing');
      outCvs.width = outW; outCvs.height = outH;

      if(cvReady) {
        try {
          const src = cv.imread('canvas-source');
          const dst = new cv.Mat();
          const sT = cv.matFromArray(4, 1, cv.CV_32FC2, [points[0].x, points[0].y, points[1].x, points[1].y, points[2].x, points[2].y, points[3].x, points[3].y]);
          const dT = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, outW, 0, outW, outH, 0, outH]);
          const M = cv.getPerspectiveTransform(sT, dT);
          cv.warpPerspective(src, dst, M, new cv.Size(outW, outH));
          cv.imshow(outCvs, dst);
          src.delete(); dst.delete(); sT.delete(); dT.delete(); M.delete();
        } catch(e) {
          // Fallback
          outCvs.getContext('2d').drawImage(document.getElementById('canvas-source'), 0, 0, outW, outH);
        }
      }
      
      outCvs.toBlob(async (b) => {
        const c = { id: Date.now().toString(), game: document.getElementById('inp-game').value, type: document.getElementById('inp-type').value, number: document.getElementById('inp-number').value, blob: b, timestamp: Date.now() };
        dbCards.push(c);
        await idbKeyval.set('bgCards', dbCards);
        document.getElementById('inp-number').value = '';
        renderGallery();
        document.getElementById('view-crop').classList.add('hidden');
      }, 'image/webp', 0.7); 
    };

    document.getElementById('file-upload').onchange = (e) => {
      const f = e.target.files[0]; if(!f) return;
      const r = new FileReader(); r.onload = (ev) => openCropView(ev.target.result); r.readAsDataURL(f);
      e.target.value = '';
    };

    window.addEventListener('paste', e => {
      const item = e.clipboardData.items[0];
      if (item && item.type.indexOf('image') === 0) {
        const r = new FileReader(); r.onload = (ev) => openCropView(ev.target.result); r.readAsDataURL(item.getAsFile());
      }
    });

    window.deleteCard = async (id) => {
      if(!confirm('確定刪除？')) return;
      dbCards = dbCards.filter(c => c.id !== id);
      await idbKeyval.set('bgCards', dbCards);
      renderGallery();
    };

    window.exportData = async () => {
      if(dbCards.length === 0) return alert('無資料可匯出');
      const data = await Promise.all(dbCards.map(async c => {
        const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(c.blob); });
        return { ...c, base64: b64, blob: null };
      }));
      const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `cards_${Date.now()}.json`; a.click();
    };

    idbKeyval.get('bgCards').then(d => { dbCards = d || []; renderGallery(); });
    document.getElementById('inp-game').oninput = renderGallery;
    document.getElementById('inp-type').oninput = renderGallery;
    document.getElementById('inp-number').oninput = renderGallery;
    document.getElementById('sel-ratio').onchange = () => { if(!document.getElementById('view-crop').classList.contains('hidden')) autoDetect(originalImgWidth, originalImgHeight); };

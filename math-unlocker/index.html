<!DOCTYPE html><html lang="zh-TW"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>數字解鎖：祭品版</title>
  <script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@0.542.0"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; background: #f8fafc; }
    .card-enter { animation: pop 0.3s ease forwards; }
    @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .op-btn { border: 2px solid #e2e8f0; transition: 0.2s; }
    .op-btn.active { background: #3b82f6; color: white; border-color: #2563eb; }
    .op-btn.valid { background: #dbeafe; color: #3b82f6; border-color: #bfdbfe; }
    .op-btn.disabled { opacity: 0.2; pointer-events: none; }
    .card-sel { border-color: #3b82f6 !important; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.3); transform: translateY(-2px); }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-lg font-bold">數字解鎖</h1>
    <button onclick="resetGame()"><i data-lucide="rotate-ccw" class="w-5 h-5"></i></button>
  </header>
  <main class="max-w-md mx-auto w-full p-4 flex flex-col gap-4">
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
      <div class="flex justify-between text-[10px] font-black text-slate-400 uppercase mb-2">
        <span>Sequence Track</span><span id="ui-combo-reward" class="text-blue-600">Combo: 0</span>
      </div>
      <div id="ui-op-track" class="flex gap-2 justify-center h-12"></div>
    </section>
    <div class="flex justify-between text-[10px] font-bold text-slate-500 uppercase px-1">
      <span>牌庫: <span id="ui-deck-count" class="text-blue-600">0</span></span>
      <span>進度: <span id="ui-progress" class="text-emerald-600">0/20</span></span>
    </div>
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex gap-4 items-center">
      <div class="w-16 text-center">
        <div id="ui-market-preview" class="aspect-square bg-slate-50 rounded-xl border-2 border-dashed border-slate-200 flex items-center justify-center font-bold text-slate-300"></div>
        <div class="text-[9px] mt-1 text-slate-400 font-bold uppercase">Next</div>
      </div>
      <div id="ui-market-active" class="flex-1 grid grid-cols-3 gap-2"></div>
    </section>
    <section id="ui-calc-area" class="bg-blue-50 rounded-2xl p-4 border border-blue-100 relative">
      <div class="flex items-center gap-2">
        <div id="slot-0" class="w-12 h-14 rounded-xl border-2 border-dashed border-blue-200 bg-white flex items-center justify-center font-bold text-xl text-blue-600"></div>
        <div class="w-12 h-12 relative">
          <div id="op-selector" class="grid grid-cols-2 gap-0.5 w-full h-full">
            <button id="btn-op-+" onclick="selectOp('+')" class="op-btn disabled rounded text-[10px] font-black">+</button>
            <button id="btn-op--" onclick="selectOp('-')" class="op-btn disabled rounded text-[10px] font-black">-</button>
            <button id="btn-op-×" onclick="selectOp('×')" class="op-btn disabled rounded text-[10px] font-black">×</button>
            <button id="btn-op-÷" onclick="selectOp('÷')" class="op-btn disabled rounded text-[10px] font-black">÷</button>
          </div>
          <div id="slot-sac" onclick="deselectSac()" class="hidden absolute inset-0 bg-slate-800 text-white rounded-lg flex items-center justify-center font-black text-xl border-2 border-slate-700"></div>
        </div>
        <div id="slot-1" class="w-12 h-14 rounded-xl border-2 border-dashed border-blue-200 bg-white flex items-center justify-center font-bold text-xl text-blue-600"></div>
        <div class="text-blue-300 font-bold">=</div>
        <div class="flex-1 flex flex-col gap-1">
          <div id="ui-res" class="h-10 bg-white rounded-lg flex items-center justify-center font-black text-slate-200 border-2 border-blue-50">「 」</div>
          <div class="flex gap-1">
            <button id="btn-deck" onclick="resolve('deck')" disabled class="flex-1 bg-slate-200 text-white text-[9px] py-1.5 rounded font-bold uppercase">Deck</button>
            <button id="btn-zap" onclick="resolve('reserve')" disabled class="flex-1 bg-slate-200 text-white text-[9px] py-1.5 rounded font-bold uppercase">Zap</button>
          </div>
        </div>
      </div>
      <div id="ui-msg" class="text-[9px] text-center mt-3 font-bold text-blue-400 uppercase tracking-tighter">Choose 2 Numbers</div>
    </section>
    <div class="px-1 text-[10px] font-black text-slate-400 uppercase flex justify-between"><span>Hand <span id="ui-h-count">0/7</span></span></div>
    <div id="ui-hand" class="flex gap-2 overflow-x-auto pb-2 snap-x min-h-[4.5rem]"></div>
    <div class="px-1 text-[10px] font-black text-amber-500 uppercase mt-2">Reserve</div>
    <div id="ui-reserve" class="flex gap-2 overflow-x-auto pb-2 min-h-[4.5rem] bg-amber-50/50 rounded-xl p-2 border border-amber-100"></div>
  </main>
<script>
  const STORAGE_KEY = 'math_sacrifice_v8';
  let state = { deck:[], hand:[], discard:[], reserve:[], market:[], mActive:[], mPreview:null, slots:[null, null], sac:null, op:null, validOps:[], history:[], count:0, nextId:1 };
  const getUid = () => state.nextId++;
  const shuffle = (a) => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

  function initGame() {
    state.nextId=1; state.hand=[1,2,3,4,5,6,7].map(v=>({id:getUid(), val:v}));
    state.deck=[]; state.discard=[]; state.reserve=[]; state.slots=[null,null]; state.sac=null; state.op=null; state.history=[]; state.count=0;
    let p=[shuffle(Array.from({length:10},(_,i)=>i+6)).slice(0,5), shuffle(Array.from({length:15},(_,i)=>i+16)).slice(0,5), shuffle(Array.from({length:20},(_,i)=>i+31)).slice(0,5), shuffle(Array.from({length:49},(_,i)=>i+51)).slice(0,5)];
    state.market=[...p[0],...p[1],...p[2],...p[3]];
    state.mActive=[state.market.shift(), state.market.shift(), state.market.shift()];
    state.mPreview=state.market.shift();
    save(); render();
  }

  function selectCard(id, src) {
    let arr = src === 'hand' ? state.hand : state.reserve;
    let idx = arr.findIndex(c => c.id === id);
    if(idx===-1) return;
    let card = arr[idx];
    if(state.slots[0] && state.slots[1] && state.op && !state.sac) {
      state.sac = { ...card, src }; arr.splice(idx,1);
    } else {
      let sIdx = state.slots.findIndex(s=>s===null);
      if(sIdx!==-1) { state.slots[sIdx] = { ...card, src }; arr.splice(idx,1); check(); }
    }
    render();
  }

  function check() {
    state.validOps=[]; state.op=null;
    if(!state.slots[0] || !state.slots[1]) return;
    let v1=state.slots[0].val, v2=state.slots[1].val;
    let tests=[{o:'+',v:v1+v2},{o:'-',v:Math.abs(v1-v2)},{o:'×',v:v1*v2}];
    if(v1!==0&&v2!==0){ if(v1%v2===0)tests.push({o:'÷',v:v1/v2}); else if(v2%v1===0)tests.push({o:'÷',v:v2/v1}); }
    tests.forEach(t=>{ if(state.mActive.includes(t.v)) state.validOps.push(t.o); });
    if(state.validOps.length>0) state.op=state.validOps[0];
    else setTimeout(()=>deselect(1)||deselect(0), 500);
  }

  function resolve(choice) {
    if(!state.sac || !state.op) return;
    let res = state.op==='+'?state.slots[0].val+state.slots[1].val: state.op==='-'?Math.abs(state.slots[0].val-state.slots[1].val): state.op==='×'?state.slots[0].val*state.slots[1].val: Math.max(state.slots[0].val,state.slots[1].val)/Math.min(state.slots[0].val,state.slots[1].val);
    state.slots.forEach(s=>state.discard.push({id:s.id,val:s.val})); state.slots=[null,null];
    let dup = -1; for(let i=state.history.length-1;i>=0;i--) if(state.history[i].op===state.op){ dup=i; break; }
    if(dup!==-1) state.history.splice(0, dup+1).forEach(i=>state.discard.push(i.card));
    state.history.push({op:state.op, card:{id:state.sac.id,val:state.sac.val}}); state.sac=null;
    state.mActive.splice(state.mActive.indexOf(res),1);
    if(state.mPreview){ state.mActive.push(state.mPreview); state.mPreview=state.market.shift()||null; }
    state.count++; let nc={id:getUid(),val:res}; choice==='deck'?state.discard.push(nc):state.reserve.push(nc);
    draw(state.history.length); state.op=null; state.validOps=[]; save(); render();
  }

  function draw(n) {
    for(let i=0;i<Math.min(n, 7-state.hand.length);i++) {
      if(state.deck.length===0){ if(state.discard.length===0)break; state.deck=shuffle([...state.discard]); state.discard=[]; }
      state.hand.push(state.deck.shift());
    }
  }
</script>
<script>
  function selectOp(o) { if(state.validOps.includes(o)){ state.op=o; render(); } }
  function deselect(i) { let c=state.slots[i]; if(!c) return; deselectSac(); (c.src==='hand'?state.hand:state.reserve).push({id:c.id,val:c.val}); state.slots[i]=null; state.op=null; render(); }
  function deselectSac() { if(!state.sac) return; (state.sac.src==='hand'?state.hand:state.reserve).push({id:state.sac.id,val:state.sac.val}); state.sac=null; render(); }
  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  function resetGame() { localStorage.removeItem(STORAGE_KEY); location.reload(); }
  
  function render() {
    document.getElementById('ui-deck-count').textContent = state.deck.length + state.discard.length;
    document.getElementById('ui-progress').textContent = `${state.count}/20`;
    document.getElementById('ui-h-count').textContent = `${state.hand.length}/7`;
    document.getElementById('ui-market-active').innerHTML = state.mActive.map(v=>`<div class="aspect-[3/4] bg-slate-800 text-white rounded-xl flex items-center justify-center font-black text-2xl border-2 border-slate-700 shadow">${v}</div>`).join('');
    document.getElementById('ui-market-preview').textContent = state.mPreview || '';
    
    let tH=''; for(let i=0;i<4;i++){
      if(i<state.history.length) tH+=`<div class="w-10 h-full bg-slate-800 text-white rounded border-2 border-slate-700 flex items-center justify-center font-black text-xl card-enter">${state.history[i].op}</div>`;
      else tH+=`<div class="w-10 h-full bg-slate-50 border-2 border-slate-200 border-dashed rounded"></div>`;
    }
    document.getElementById('ui-op-track').innerHTML=tH;
    document.getElementById('ui-combo-reward').textContent=`Combo: ${state.history.length}`;

    const isWaitSac = state.slots[0] && state.slots[1] && state.op && !state.sac;
    const cardUI = (c,s) => {
      let isS = (state.slots[0]?.id===c.id && state.slots[0]?.src===s) || (state.slots[1]?.id===c.id && state.slots[1]?.src===s);
      let cls = s==='hand' ? 'bg-white text-blue-700 border-blue-200' : 'bg-amber-50 text-amber-700 border-amber-200';
      let inner = c.val;
      if(isWaitSac) { cls += ' border-blue-400 shadow-md relative overflow-hidden'; inner += `<div class="absolute inset-0 flex items-center justify-center text-4xl font-black text-blue-500/20">${state.op}</div>`; }
      return `<button onclick="selectCard(${c.id},'${s}')" class="card-enter shrink-0 w-16 aspect-[3/4] rounded-xl flex items-center justify-center font-bold text-2xl border-2 ${cls} active:scale-95 transition-all">${inner}</button>`;
    };
    document.getElementById('ui-hand').innerHTML = state.hand.map(c=>cardUI(c,'hand')).join('');
    document.getElementById('ui-reserve').innerHTML = state.reserve.map(c=>cardUI(c,'reserve')).join('');

    [0,1].forEach(i=>{
      const s = state.slots[i], el = document.getElementById(`slot-${i}`);
      el.innerHTML = s ? s.val : '<i data-lucide="plus" class="w-4 h-4 text-blue-100"></i>';
      el.className = `w-12 h-14 rounded-xl flex items-center justify-center font-bold text-xl border-2 transition-all ${s?(s.src==='hand'?'bg-blue-600 border-blue-700 text-white shadow-md':'bg-amber-500 border-amber-600 text-white shadow-md'):'bg-white border-blue-100 border-dashed text-blue-100'}`;
    });

    const sSac=document.getElementById('slot-sac'), oSel=document.getElementById('op-selector'), bD=document.getElementById('btn-deck'), bR=document.getElementById('btn-zap'), res=document.getElementById('ui-res'), msg=document.getElementById('ui-msg');
    if(state.sac){
      oSel.classList.add('hidden'); sSac.classList.remove('hidden'); sSac.textContent=state.op;
      res.textContent = "✓"; res.className = "h-10 bg-emerald-50 text-emerald-700 rounded-lg flex items-center justify-center font-black border-2 border-emerald-400 shadow-sm card-enter";
      bD.disabled=bR.disabled=false; bD.className="flex-1 bg-emerald-600 text-white text-[9px] py-1.5 rounded font-bold uppercase shadow"; bR.className="flex-1 bg-amber-500 text-white text-[9px] py-1.5 rounded font-bold uppercase shadow";
      msg.textContent="Choose Destination";
    } else {
      oSel.classList.remove('hidden'); sSac.classList.add('hidden');
      ['+','-','×','÷'].forEach(o=>{ document.getElementById(`btn-op-${o}`).className=`op-btn rounded text-[10px] font-black ${state.validOps.includes(o)?(state.op===o?'active':'valid'):'disabled'}`; });
      res.textContent="「 」"; res.className="h-10 bg-white rounded-lg flex items-center justify-center font-black text-slate-100 border-2 border-blue-50";
      bD.disabled=bR.disabled=true; bD.className=bR.className="flex-1 bg-slate-200 text-white text-[9px] py-1.5 rounded font-bold uppercase";
      msg.textContent = isWaitSac ? `Sacrifice card for ${state.op}` : "Select 2 Numbers";
    }
    lucide.createIcons();
  }

  document.addEventListener('DOMContentLoaded', () => {
    let saved = localStorage.getItem(STORAGE_KEY);
    if(saved) try { state = Object.assign(state, JSON.parse(saved)); } catch(e) { initGame(); }
    else initGame();
    render();
  });
</script></body></html>

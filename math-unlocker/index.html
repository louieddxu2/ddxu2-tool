<!DOCTYPE html><html lang="zh-TW"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>數字解鎖：巧克力版</title>
  <script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@0.542.0"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; overflow: hidden; background: #f1f5f9; height: 100vh; }
    .square { aspect-ratio: 1 / 1; }
    /* 巧克力塊的基本樣式 */
    .choc-card { border: 1px solid rgba(0,0,0,0.05); transition: none; }
    .choc-target { background: #1e293b; color: white; border: 2px solid #334155; box-shadow: 0 4px 0 #0f172a; }
    /* 運算狀態顏色 */
    .op-btn { background: #f8fafc; border: 1px solid #e2e8f0; font-weight: 900; }
    .op-btn.valid { background: #dbeafe; color: #3b82f6; border-color: #bfdbfe; }
    .op-btn.selected { background: #3b82f6; color: white; border-color: #2563eb; }
    /* 結算塔顏色 */
    .btn-deck.active { background: #3b82f6; color: white; box-shadow: 0 4px 0 #1d4ed8; }
    .btn-zap.active { background: #f59e0b; color: white; box-shadow: 0 4px 0 #b45309; }
    .disabled { opacity: 0.15; pointer-events: none; }
  </style>
</head>
<body class="flex flex-col text-slate-800">
  <header class="h-[15vh] p-3 flex flex-col justify-between">
    <div class="flex justify-between items-center px-1">
      <div class="flex gap-3 text-[10px] font-black text-slate-400 uppercase tracking-tighter">
        <span>Deck: <span id="ui-deck-count" class="text-blue-600">0</span></span>
        <span>Progress: <span id="ui-progress" class="text-emerald-600">0/20</span></span>
      </div>
      <div id="ui-combo-reward" class="text-xs font-black text-blue-500 italic">COMBO: 0</div>
    </div>
    <div id="ui-op-track" class="flex gap-1.5 justify-center">
      <div class="w-8 h-8 rounded border-2 border-dashed border-slate-200"></div>
      <div class="w-8 h-8 rounded border-2 border-dashed border-slate-200"></div>
      <div class="w-8 h-8 rounded border-2 border-dashed border-slate-200"></div>
      <div class="w-8 h-8 rounded border-2 border-dashed border-slate-200"></div>
    </div>
  </header>

  <section class="h-[15vh] px-4 flex items-center justify-center gap-2">
    <div id="ui-market-active" class="flex-1 flex gap-2 justify-center max-w-[280px]"></div>
    <div class="w-8 flex flex-col items-center opacity-40">
      <div id="ui-market-preview" class="square w-full border-2 border-dashed border-slate-300 rounded flex items-center justify-center font-bold text-slate-400 text-xs"></div>
    </div>
  </section>
  <section id="ui-calc-area" class="h-[35vh] flex items-center justify-center px-4">
    <div class="flex items-center gap-2 w-full max-w-sm">
      <div class="flex-1 flex items-center gap-1.5 justify-end">
        <div id="slot-0" class="square w-16 bg-white border-2 border-dashed border-slate-200 rounded-xl flex items-center justify-center font-black text-2xl text-blue-600 shadow-inner" onclick="deselect(0)"></div>
        
        <div class="w-14 h-14 relative flex items-center justify-center">
          <div id="op-selector" class="grid grid-cols-2 gap-1 w-full h-full">
            <button id="btn-op-+" onclick="selectOp('+')" class="op-btn disabled rounded text-xs">+</button>
            <button id="btn-op--" onclick="selectOp('-')" class="op-btn disabled rounded text-xs">-</button>
            <button id="btn-op-×" onclick="selectOp('×')" class="op-btn disabled rounded text-xs">×</button>
            <button id="btn-op-÷" onclick="selectOp('÷')" class="op-btn disabled rounded text-xs">÷</button>
          </div>
          <div id="slot-sac" onclick="deselectSac()" class="hidden absolute inset-0 bg-slate-800 text-white rounded-lg flex items-center justify-center font-black text-2xl border-2 border-slate-600 shadow-md"></div>
        </div>

        <div id="slot-1" class="square w-16 bg-white border-2 border-dashed border-slate-200 rounded-xl flex items-center justify-center font-black text-2xl text-blue-600 shadow-inner" onclick="deselect(1)"></div>
      </div>

      <div class="text-slate-300 font-bold text-xl">=</div>

      <div class="w-16 flex flex-col gap-1">
        <button id="btn-deck" onclick="resolve('deck')" class="btn-deck disabled square w-full rounded-lg flex items-center justify-center"><i data-lucide="arrow-big-up-dash"></i></button>
        <div id="ui-res" class="square w-full bg-white border-2 border-blue-50 rounded-lg flex items-center justify-center font-black text-2xl text-slate-100 shadow-inner"></div>
        <button id="btn-zap" onclick="resolve('reserve')" class="btn-zap disabled square w-full rounded-lg flex items-center justify-center"><i data-lucide="zap"></i></button>
      </div>
    </div>
  </section>

  <footer class="h-[35vh] bg-slate-200/50 p-4 flex flex-col gap-2 justify-center">
    <div id="ui-hand-row-1" class="flex justify-center gap-1"></div>
    <div id="ui-hand-row-2" class="flex justify-center gap-1"></div>
    <div id="ui-reserve" class="flex justify-center gap-1 mt-1 border-t border-slate-300 pt-2 h-10"></div>
  </footer class="h-[35vh]">

  <div id="modal-gameover" class="fixed inset-0 bg-slate-900/90 z-50 hidden items-center justify-center p-8 opacity-0 transition-opacity">
    <div class="bg-white rounded-3xl w-full max-w-xs p-8 text-center">
      <h2 class="text-3xl font-black mb-4">GAME OVER</h2>
      <div class="text-5xl font-black text-blue-600 mb-6" id="go-progress">0/20</div>
      <button onclick="resetGame()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black text-xl shadow-lg">RETRY</button>
    </div>
  </div>
<script>
  const STORAGE_KEY = 'math_choco_v9';
  let state = { deck:[], hand:[], discard:[], reserve:[], market:[], mActive:[], mPreview:null, slots:[null,null], sac:null, op:null, validOps:[], history:[], count:0, nextId:1 };
  const getUid = () => state.nextId++;
  const shuffle = (a) => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

  function initGame() {
    state.nextId=1; state.hand=[1,2,3,4,5,6,7].map(v=>({id:getUid(), val:v}));
    state.deck=[]; state.discard=[]; state.reserve=[]; state.slots=[null,null]; state.sac=null; state.op=null; state.history=[]; state.count=0;
    let p=[shuffle(Array.from({length:10},(_,i)=>i+6)).slice(0,5), shuffle(Array.from({length:15},(_,i)=>i+16)).slice(0,5), shuffle(Array.from({length:20},(_,i)=>i+31)).slice(0,5), shuffle(Array.from({length:49},(_,i)=>i+51)).slice(0,5)];
    state.market=[...p[0],...p[1],...p[2],...p[3]];
    state.mActive=[state.market.shift(), state.market.shift(), state.market.shift()];
    state.mPreview=state.market.shift();
    save(); render();
  }

  function selectCard(id, src) {
    let arr = src==='hand'?state.hand:state.reserve;
    let idx = arr.findIndex(c=>c.id===id); if(idx===-1) return;
    let card = arr[idx];
    if(state.slots[0] && state.slots[1] && state.op && !state.sac) {
      state.sac={...card, src}; arr.splice(idx,1);
    } else {
      let sIdx = state.slots.findIndex(s=>s===null);
      if(sIdx!==-1){ state.slots[sIdx]={...card, src}; arr.splice(idx,1); check(); }
    }
    render();
  }

  function check() {
    state.validOps=[]; state.op=null;
    if(!state.slots[0] || !state.slots[1]) return;
    let v1=state.slots[0].val, v2=state.slots[1].val;
    let tests=[{o:'+',v:v1+v2},{o:'-',v:Math.abs(v1-v2)},{o:'×',v:v1*v2}];
    if(v1!==0&&v2!==0){ if(v1%v2===0)tests.push({o:'÷',v:v1/v2}); else if(v2%v1===0)tests.push({o:'÷',v:v2/v1}); }
    tests.forEach(t=>{ if(state.mActive.includes(t.v)) state.validOps.push(t.o); });
    if(state.validOps.length>0) state.op=state.validOps[0];
    else setTimeout(()=>deselect(1)||deselect(0), 400);
  }

  function selectOp(o) { if(state.validOps.includes(o)){ state.op=o; render(); } }

  function resolve(choice) {
    if(!state.sac || !state.op) return;
    let v1=state.slots[0].val, v2=state.slots[1].val;
    let res = state.op==='+'?v1+v2 : state.op==='-'?Math.abs(v1-v2) : state.op==='×'?v1*v2 : Math.max(v1,v2)/Math.min(v1,v2);
    state.slots.forEach(s=>state.discard.push({id:s.id,val:s.val})); state.slots=[null,null];
    let dup = -1; for(let i=state.history.length-1;i>=0;i--) if(state.history[i].op===state.op){ dup=i; break; }
    if(dup!==-1) state.history.splice(0, dup+1).forEach(i=>state.discard.push(i.card));
    state.history.push({op:state.op, card:{id:state.sac.id,val:state.sac.val}}); state.sac=null;
    state.mActive.splice(state.mActive.indexOf(res),1);
    if(state.mPreview){ state.mActive.push(state.mPreview); state.mPreview=state.market.shift()||null; }
    state.count++; let nc={id:getUid(),val:res}; choice==='deck'?state.discard.push(nc):state.reserve.push(nc);
    draw(state.history.length); state.op=null; state.validOps=[]; save(); render(); checkGameOver();
  }

  function draw(n) {
    for(let i=0;i<Math.min(n, 7-state.hand.length);i++) {
      if(state.deck.length===0){ if(state.discard.length===0)break; state.deck=shuffle([...state.discard]); state.discard=[]; }
      state.hand.push(state.deck.shift());
    }
  }

  function deselect(i) { let c=state.slots[i]; if(!c) return; deselectSac(); (c.src==='hand'?state.hand:state.reserve).push({id:c.id,val:c.val}); state.slots[i]=null; state.op=null; state.validOps=[]; render(); }
  function deselectSac() { if(!state.sac) return; (state.sac.src==='hand'?state.hand:state.reserve).push({id:state.sac.id,val:state.sac.val}); state.sac=null; render(); }
  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  function resetGame() { localStorage.removeItem(STORAGE_KEY); location.reload(); }

  function render() {
    document.getElementById('ui-deck-count').textContent = state.deck.length + state.discard.length;
    document.getElementById('ui-progress').textContent = `${state.count}/20`;
    document.getElementById('ui-market-active').innerHTML = state.mActive.map(v=>`<div class="square choc-card choc-target w-16 rounded-xl flex items-center justify-center font-black text-2xl">${v}</div>`).join('');
    document.getElementById('ui-market-preview').textContent = state.mPreview || '';
    
    // 渲染連擊軌跡 (圓型按鈕感)
    let tH=''; for(let i=0;i<4;i++){
      if(i<state.history.length) tH+=`<div class="w-8 h-8 bg-slate-800 text-white rounded-full flex items-center justify-center font-black text-sm">${state.history[i].op}</div>`;
      else tH+=`<div class="w-8 h-8 border-2 border-dashed border-slate-200 rounded-full"></div>`;
    }
    document.getElementById('ui-op-track').innerHTML=tH;
    document.getElementById('ui-combo-reward').textContent=`COMBO: ${state.history.length}`;

    // 渲染 4+3 巧克力手牌
    const isWaitSac = state.slots[0] && state.slots[1] && state.op && !state.sac;
    const cardUI = (c,s) => {
      let cls = s==='hand' ? 'bg-white text-blue-700 shadow-sm' : 'bg-amber-400 text-white shadow-sm';
      let inner = c.val;
      if(isWaitSac) { cls = 'bg-blue-600 text-white'; inner = `<span class="text-3xl">${state.op}</span>`; }
      return `<button onclick="selectCard(${c.id},'${s}')" class="choc-card square w-20 rounded-xl flex items-center justify-center font-black text-2xl ${cls} active:scale-90 transition-transform">${inner}</button>`;
    };
    document.getElementById('ui-hand-row-1').innerHTML = state.hand.slice(0,4).map(c=>cardUI(c,'hand')).join('');
    document.getElementById('ui-hand-row-2').innerHTML = state.hand.slice(4).map(c=>cardUI(c,'hand')).join('');
    document.getElementById('ui-reserve').innerHTML = state.reserve.map(c=>cardUI(c,'reserve')).join('');

    // 算式槽位
    [0,1].forEach(i=>{
      const s = state.slots[i], el = document.getElementById(`slot-${i}`);
      el.innerHTML = s ? s.val : '';
      el.className = `square w-16 rounded-xl flex items-center justify-center font-black text-2xl transition-all ${s?(s.src==='hand'?'bg-blue-600 text-white shadow-md':'bg-amber-500 text-white shadow-md'):'bg-white border-2 border-slate-200 border-dashed text-slate-200'}`;
    });

    const sSac=document.getElementById('slot-sac'), oSel=document.getElementById('op-selector'), bD=document.getElementById('btn-deck'), bR=document.getElementById('btn-zap'), res=document.getElementById('ui-res'), msg=document.getElementById('ui-msg');
    if(state.sac){
      oSel.classList.add('hidden'); sSac.classList.remove('hidden'); sSac.textContent=state.op;
      res.textContent = pendingUnlockInfo.val; res.className = "square w-full bg-emerald-500 text-white rounded-lg flex items-center justify-center font-black text-2xl shadow-lg";
      bD.classList.add('active'); bR.classList.add('active'); bD.classList.remove('disabled'); bR.classList.remove('disabled');
      msg.textContent="Choose Destination";
    } else {
      oSel.classList.remove('hidden'); sSac.classList.add('hidden');
      ['+','-','×','÷'].forEach(o=>{ document.getElementById(`btn-op-${o}`).className=`op-btn rounded font-black ${state.validOps.includes(o)?(state.op===o?'selected':'valid'):'disabled'}`; });
      res.textContent=""; res.className="square w-full bg-white border-2 border-slate-100 rounded-lg shadow-inner";
      bD.classList.add('disabled'); bR.classList.add('disabled'); bD.classList.remove('active'); bR.classList.remove('active');
      msg.textContent = isWaitSac ? "Sacrifice for Op" : "Select 2 Numbers";
    }
    lucide.createIcons();
  }

  function checkGameOver() {
    let av = [...state.hand, ...state.reserve];
    if (av.length < 3 && state.unlockedCount < 20) {
      state.isGameOver = true; render();
      document.getElementById('go-progress').textContent = `${state.count}/20`;
      const m = document.getElementById('modal-gameover'); m.classList.remove('hidden'); m.classList.add('flex');
      setTimeout(() => m.classList.add('opacity-100'), 10);
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    let saved = localStorage.getItem(STORAGE_KEY);
    if(saved) try { state = Object.assign(state, JSON.parse(saved)); } catch(e) { initGame(); } else initGame();
    render(); lucide.createIcons();
  });
</script></body></html>

<!DOCTYPE html><html lang="zh-TW"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>數字解鎖：連擊版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.542.0"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='8' fill='%233b82f6'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    ::-webkit-scrollbar { width: 0; background: transparent; }
    body { -webkit-tap-highlight-color: transparent; }
    .card-enter { animation: card-pop 0.2s ease-out forwards; }
    @keyframes card-pop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .card-selected-hand { border-color: #3b82f6 !important; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.4); transform: translateY(-2px); }
    .card-selected-reserve { border-color: #f59e0b !important; box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.4); transform: translateY(-2px); }
    .op-slot { transition: all 0.3s ease; }
    .op-active { background-color: #3b82f6; color: white; border-color: #2563eb; transform: scale(1.05); box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3); }
    .op-dimmed { background-color: #f1f5f9; color: #cbd5e1; border-color: #e2e8f0; opacity: 0.6; }
    .calc-success-glow { animation: success-glow 1.5s infinite; border-color: #10b981 !important; }
    @keyframes success-glow { 0%, 100% { box-shadow: 0 0 5px rgba(16, 185, 129, 0.2); } 50% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); } }
    .disabled-overlay { pointer-events: none; opacity: 0.5; filter: grayscale(80%); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
  <script>
    (function autoRegister() {
      let appPath = window.location.pathname;
      if (appPath.endsWith('index.html')) appPath = appPath.replace('index.html', '');
      if (!appPath.endsWith('/')) appPath += '/';
      try {
        localStorage.setItem('myAppLauncherLastPath', appPath);
        localStorage.setItem('myAppLauncherLastSeenAt', String(Date.now()));
      } catch {}
      const launcherPath = appPath.replace(/[^/]+\/$/, '') || '/';
      function cfg() {
        const homeLinks = Array.from(document.querySelectorAll('[data-home-link]'));
        const homeHref = launcherPath.includes('?') ? `${launcherPath}&home=1` : `${launcherPath}?home=1`;
        homeLinks.forEach(el => el.setAttribute('href', homeHref));
        fetch(launcherPath.endsWith('/') ? `${launcherPath}index.html` : `${launcherPath}/index.html`, { method: 'HEAD' })
          .then(res => { if (res.ok) homeLinks.forEach(el => el.classList.remove('invisible', 'pointer-events-none')); });
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', cfg, { once: true });
      else cfg();
      const storageKey = 'myAppLauncherStorage';
      const launcherData = JSON.parse(localStorage.getItem(storageKey) || '[]');
      const appMeta = { id: 'math-unlocker', name: '數字解鎖', path: appPath, icon: 'zap', color: 'blue' };
      const idx = launcherData.findIndex(app => app.path === appPath);
      if (idx === -1) launcherData.push(appMeta); else launcherData[idx] = appMeta;
      localStorage.setItem(storageKey, JSON.stringify(launcherData));
    })();
  </script>

  <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-20">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <a href="/" data-home-link class="p-2 -ml-2 hover:bg-blue-700 rounded-full transition-colors invisible pointer-events-none"><i data-lucide="home" class="w-5 h-5"></i></a>
      <h1 class="text-lg font-bold">數字解鎖</h1>
      <button onclick="resetGame()" class="p-2 -mr-2 hover:bg-blue-700 rounded-full transition-colors"><i data-lucide="rotate-ccw" class="w-5 h-5"></i></button>
    </div>
  </header>

  <main id="main-content" class="flex-grow w-full max-w-md mx-auto p-4 flex flex-col gap-4">
    <section class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Sequence Track</h2>
        <div id="ui-combo-reward" class="text-xs font-bold text-blue-600">Next: +1</div>
      </div>
      <div class="flex gap-3 justify-center" id="ui-op-track">
        <div class="op-slot w-11 h-11 rounded-xl border-2 flex items-center justify-center font-black text-xl bg-slate-50 border-slate-100 text-transparent">-</div>
        <div class="op-slot w-11 h-11 rounded-xl border-2 flex items-center justify-center font-black text-xl bg-slate-50 border-slate-100 text-transparent">-</div>
        <div class="op-slot w-11 h-11 rounded-xl border-2 flex items-center justify-center font-black text-xl bg-slate-50 border-slate-100 text-transparent">-</div>
        <div class="op-slot w-11 h-11 rounded-xl border-2 flex items-center justify-center font-black text-xl bg-slate-50 border-slate-100 text-transparent">-</div>
      </div>
    </section>

    <div class="flex justify-between text-[10px] text-slate-500 font-bold px-1 uppercase tracking-wider">
      <div><i data-lucide="layers" class="inline w-3 h-3"></i> 牌庫: <span id="ui-deck-count" class="text-blue-600">0</span></div>
      <div><i data-lucide="target" class="inline w-3 h-3"></i> 進度: <span id="ui-progress" class="text-emerald-600">0/20</span></div>
    </div>

    <section class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
      <div class="flex gap-2 items-center">
        <div class="w-[22%] text-center">
          <div id="ui-market-preview" class="aspect-square bg-slate-50 rounded-xl border-2 border-dashed border-slate-200 flex items-center justify-center font-bold text-lg text-slate-300"></div>
          <span class="text-[9px] text-slate-400 mt-1 font-bold">NEXT</span>
        </div>
        <div class="w-[1px] h-10 bg-slate-100 mx-1"></div>
        <div class="flex-1 grid grid-cols-3 gap-2" id="ui-market-active"></div>
      </div>
    </section>

    <section class="bg-blue-50 rounded-2xl p-4 border border-blue-100 shadow-inner" id="ui-calc-area">
      <div class="flex items-center gap-2">
        <div class="flex items-center gap-1.5 flex-grow" id="calc-expression-area">
          <div id="slot-0" class="w-12 h-12 rounded-lg border-2 border-blue-100 border-dashed bg-white flex items-center justify-center font-bold text-lg"></div>
          <div id="calc-op" class="text-blue-300 font-black text-xl w-4 text-center">?</div>
          <div id="slot-1" class="w-12 h-12 rounded-lg border-2 border-blue-100 border-dashed bg-white flex items-center justify-center font-bold text-lg"></div>
          <div class="text-blue-300 font-bold text-lg mx-0.5">=</div>
          <div id="calc-result" class="flex-grow h-12 rounded-lg bg-white border-2 border-blue-100 flex items-center justify-center font-black text-2xl text-slate-200">「 」</div>
        </div>
        <div class="flex flex-col gap-1 w-[35%]">
          <button id="btn-resolve-deck" onclick="resolveUnlock('deck')" disabled class="w-full bg-slate-200 text-white text-[10px] py-2.5 rounded-lg font-bold uppercase">Deck</button>
          <button id="btn-resolve-reserve" onclick="resolveUnlock('reserve')" disabled class="w-full bg-slate-200 text-white text-[10px] py-2.5 rounded-lg font-bold uppercase">Zap</button>
        </div>
      </div>
      <div id="calc-msg" class="text-[10px] text-blue-400 font-bold text-center mt-3 uppercase tracking-tighter">Select 2 cards</div>
    </section>

    <div id="ui-hand" class="grid grid-cols-5 gap-2 px-1 min-h-[4rem]"></div>
    <div id="ui-reserve" class="grid grid-cols-5 gap-2 px-1 min-h-[4rem]"></div>
  </main>

  <div id="modal-gameover" class="fixed inset-0 bg-slate-900/80 z-50 hidden items-center justify-center p-6 opacity-0 transition-opacity">
    <div class="bg-white rounded-3xl w-full max-w-xs p-6 text-center shadow-2xl">
      <div class="w-16 h-16 rounded-full bg-rose-100 text-rose-500 mx-auto flex items-center justify-center mb-4"><i data-lucide="frown" class="w-8 h-8"></i></div>
      <h2 class="text-2xl font-black text-slate-800 mb-1 uppercase tracking-tight">Game Over</h2>
      <div class="bg-slate-50 p-4 rounded-2xl mb-6 border border-slate-100">
        <div class="text-4xl font-black text-blue-600" id="go-progress">0/20</div>
      </div>
      <button onclick="resetGame()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg mb-3">RETRY</button>
      <button onclick="closeGameOverModal()" class="w-full text-slate-400 text-sm font-bold">Inspect Board</button>
    </div>
  </div>
  <script>
    // --- 遊戲邏輯 ---
    const STORAGE_KEY = 'mathUnlocker_v4_stable'; // 強制使用新儲存空間避開舊壞資料
    
    // 預定義 state 結構，避免 getUid 引用錯誤
    let state = {
      deck: [], hand: [], discard: [], reserve: [],
      marketDeck: [], marketActive: [], marketPreview: null,
      selectedCardIds: [], unlockedCount: 0, nextId: 1, isGameOver: false,
      history: []
    };

    let pendingUnlockInfo = null;
    const HAND_LIMIT = 10;
    const TOTAL_TARGETS = 20;

    const getUid = () => state.nextId++;
    
    const shuffle = (arr) => {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    };

    function getStreak(newOp, currentHistory) {
      const full = [...currentHistory, newOp];
      let unique = [];
      for (let i = full.length - 1; i >= 0; i--) {
        if (unique.includes(full[i])) break;
        unique.unshift(full[i]);
      }
      return unique;
    }

    function initGame() {
      // 步驟 1: 完全初始化狀態
      state.nextId = 1;
      state.deck = [1, 2, 3, 4, 5].map(v => ({ id: getUid(), val: v }));
      state.hand = [];
      state.discard = [];
      state.reserve = [];
      state.selectedCardIds = [];
      state.unlockedCount = 0;
      state.isGameOver = false;
      state.history = [];
      pendingUnlockInfo = null;

      // 步驟 2: 初始化市場
      let p1 = shuffle(Array.from({length: 15}, (_, i) => i + 6)).slice(0, 5);
      let p2 = shuffle(Array.from({length: 30}, (_, i) => i + 21)).slice(0, 10);
      let p3 = shuffle(Array.from({length: 50}, (_, i) => i + 51)).slice(0, 5);
      state.marketDeck = [...p1, ...p2, ...p3];
      state.marketActive = [state.marketDeck.shift(), state.marketDeck.shift(), state.marketDeck.shift()];
      state.marketPreview = state.marketDeck.shift() || null;
      
      // 步驟 3: 抽起手牌
      drawCards(5);
      
      saveState(); 
      render();
    }

    function drawCards(count) {
      let space = HAND_LIMIT - state.hand.length;
      let actual = Math.min(count, space);
      for(let i=0; i<actual; i++) {
        if (state.deck.length === 0) {
          if (state.discard.length === 0) break;
          state.deck = shuffle([...state.discard]);
          state.discard = [];
        }
        if (state.deck.length > 0) state.hand.push(state.deck.shift());
      }
    }

    function selectCard(id, source) {
      if (state.isGameOver) return;
      let idx = state.selectedCardIds.findIndex(s => s.id === id);
      if (idx !== -1) {
        state.selectedCardIds.splice(idx, 1);
      } else {
        if (state.selectedCardIds.length >= 2) state.selectedCardIds.shift();
        state.selectedCardIds.push({id, source});
      }
      checkMath(); render();
    }

    function checkMath() {
      pendingUnlockInfo = null;
      if (state.selectedCardIds.length < 2) return;
      
      const c1 = (state.selectedCardIds[0].source === 'hand' ? state.hand : state.reserve).find(c => c.id === state.selectedCardIds[0].id);
      const c2 = (state.selectedCardIds[1].source === 'hand' ? state.hand : state.reserve).find(c => c.id === state.selectedCardIds[1].id);
      
      if (!c1 || !c2) { state.selectedCardIds = []; return; }
      
      let v1 = c1.val, v2 = c2.val;
      let results = [{op:'+', val:v1+v2}, {op:'-', val:Math.abs(v1-v2)}, {op:'×', val:v1*v2}];
      if(v1!==0 && v2!==0){ 
        if(v1 % v2 === 0) results.push({op:'÷', val:v1/v2}); 
        else if(v2 % v1 === 0) results.push({op:'÷', val:v2/v1}); 
      }
      
      for (let r of results) {
        if (state.marketActive.includes(r.val)) {
          pendingUnlockInfo = { matchedValue: r.val, op: r.op, consumedIds: [...state.selectedCardIds] };
          return;
        }
      }
    }

    function resolveUnlock(choice) {
      if (!pendingUnlockInfo) return;
      const info = pendingUnlockInfo;
      const streak = getStreak(info.op, state.history);
      const drawCount = streak.length;

      state.history.push(info.op);
      if (state.history.length > 4) state.history.shift();

      info.consumedIds.forEach(s => {
        let arr = s.source === 'hand' ? state.hand : state.reserve;
        let idx = arr.findIndex(c => c.id === s.id);
        if (idx !== -1) {
          let c = arr.splice(idx, 1)[0];
          if (s.source === 'hand') state.discard.push(c);
        }
      });

      const mIdx = state.marketActive.indexOf(info.matchedValue);
      state.marketActive.splice(mIdx, 1);
      if (state.marketPreview !== null) {
        state.marketActive.push(state.marketPreview);
        state.marketPreview = state.marketDeck.shift() || null;
      }

      state.unlockedCount++;
      let newCard = { id: getUid(), val: info.matchedValue };
      choice === 'deck' ? state.discard.push(newCard) : state.reserve.push(newCard);
      
      drawCards(drawCount);
      state.selectedCardIds = []; pendingUnlockInfo = null;
      saveState(); render(); checkGameOver();
    }

    function checkGameOver() {
      let av = [...state.hand, ...state.reserve];
      let move = false;
      if (av.length >= 2) {
        for (let i = 0; i < av.length; i++) {
          for (let j = i + 1; j < av.length; j++) {
            let v1 = av[i].val, v2 = av[j].val;
            let rs = [v1+v2, Math.abs(v1-v2), v1*v2];
            if(v1!==0 && v2!==0){ if(v1%v2===0) rs.push(v1/v2); if(v2%v1===0) rs.push(v2/v1); }
            if (rs.some(r => state.marketActive.includes(r))) { move = true; break; }
          }
          if (move) break;
        }
      } else if (state.deck.length > 0 || state.discard.length > 0) move = true;

      if (!move && state.unlockedCount < TOTAL_TARGETS) {
        state.isGameOver = true; saveState(); render();
        document.getElementById('go-progress').textContent = `${state.unlockedCount}/${TOTAL_TARGETS}`;
        const m = document.getElementById('modal-gameover'); m.classList.remove('hidden'); m.classList.add('flex');
        setTimeout(() => m.classList.add('opacity-100'), 10);
      }
    }

    function resetGame() {
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadState() {
      let saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          let loaded = JSON.parse(saved);
          state = Object.assign(state, loaded);
          checkMath();
          return true;
        } catch(e) { return false; }
      }
      return false;
    }

    function render() {
      document.getElementById('ui-deck-count').textContent = state.deck.length + state.discard.length;
      document.getElementById('ui-progress').textContent = `${state.unlockedCount}/${TOTAL_TARGETS}`;
      document.getElementById('ui-hand-count').textContent = `${state.hand.length}/${HAND_LIMIT}`;
      document.getElementById('ui-market-active').innerHTML = state.marketActive.map(v => `<div class="aspect-square bg-slate-800 text-white rounded-xl flex items-center justify-center font-black text-2xl border-2 border-slate-700 shadow-sm">${v}</div>`).join('');
      document.getElementById('ui-market-preview').textContent = state.marketPreview || '';

      const streak = state.history.length > 0 ? getStreak(state.history[state.history.length-1], state.history.slice(0, -1)) : [];
      const startIndex = state.history.length - streak.length;
      const trackSlots = document.querySelectorAll('.op-slot');
      trackSlots.forEach((slot, i) => {
        const op = state.history[i];
        slot.textContent = op || "-";
        slot.className = "op-slot w-11 h-11 rounded-xl border-2 flex items-center justify-center font-black text-xl";
        if (op) {
          if (i >= startIndex) slot.classList.add('op-active');
          else slot.classList.add('op-dimmed');
        } else {
          slot.classList.add('bg-slate-50', 'border-slate-100', 'text-transparent');
        }
      });

      document.getElementById('ui-hand').innerHTML = state.hand.map(c => {
        const isS = state.selectedCardIds.some(s => s.id === c.id && s.source === 'hand');
        return `<button onclick="selectCard(${c.id}, 'hand')" class="card-enter w-full aspect-square rounded-xl flex items-center justify-center font-bold text-xl border-2 shadow-sm transition-all bg-white text-blue-700 border-blue-100 ${isS ? 'card-selected-hand' : ''}">${c.val}</button>`;
      }).join('');
      document.getElementById('ui-reserve').innerHTML = state.reserve.map(c => {
        const isS = state.selectedCardIds.some(s => s.id === c.id && s.source === 'reserve');
        return `<button onclick="selectCard(${c.id}, 'reserve')" class="card-enter w-full aspect-square rounded-xl flex items-center justify-center font-bold text-xl border-2 shadow-sm transition-all bg-amber-50 text-amber-700 border-amber-100 ${isS ? 'card-selected-reserve' : ''}">${c.val}</button>`;
      }).join('');

      let c1 = state.selectedCardIds[0] ? (state.selectedCardIds[0].source === 'hand' ? state.hand : state.reserve).find(c => c.id === state.selectedCardIds[0].id) : null;
      let c2 = state.selectedCardIds[1] ? (state.selectedCardIds[1].source === 'hand' ? state.hand : state.reserve).find(c => c.id === state.selectedCardIds[1].id) : null;
      
      [c1, c2].forEach((c, idx) => {
        const el = document.getElementById(`slot-${idx}`);
        if (!c) { el.innerHTML = ""; el.className = "w-12 h-12 rounded-lg border-2 border-blue-50 border-dashed bg-white"; }
        else { 
          el.innerHTML = c.val; 
          el.className = `w-12 h-12 rounded-lg flex items-center justify-center font-bold text-xl shadow-sm text-white ${state.selectedCardIds[idx].source==='hand'?'bg-blue-600':'bg-amber-500'}`; 
        }
      });

      const op = document.getElementById('calc-op'), res = document.getElementById('calc-result'), msg = document.getElementById('calc-msg'), expr = document.getElementById('calc-expression-area'), bD = document.getElementById('btn-resolve-deck'), bR = document.getElementById('btn-resolve-reserve'), reward = document.getElementById('ui-combo-reward');
      op.textContent = "?"; res.textContent = "「 」"; res.className = "flex-grow h-12 rounded-lg bg-white border-2 border-blue-100 flex items-center justify-center font-black text-2xl text-slate-200";
      expr.classList.remove('calc-success-glow'); bD.disabled = bR.disabled = true; bD.className = bR.className = "w-full bg-slate-200 text-white text-[10px] py-2.5 rounded-lg font-bold uppercase";
      
      if (pendingUnlockInfo) {
        const potentialStreak = getStreak(pendingUnlockInfo.op, state.history);
        op.textContent = pendingUnlockInfo.op; res.textContent = pendingUnlockInfo.matchedValue; res.className = "flex-grow h-12 rounded-lg bg-emerald-50 border-2 border-emerald-400 flex items-center justify-center font-black text-2xl text-emerald-700 shadow-sm";
        expr.classList.add('calc-success-glow'); bD.disabled = bR.disabled = false; bD.className = "w-full bg-emerald-600 text-white text-[10px] py-2.5 rounded-lg font-bold uppercase shadow-md"; bR.className = "w-full bg-amber-500 text-white text-[10px] py-2.5 rounded-lg font-bold uppercase shadow-md";
        msg.innerHTML = `<span class="text-blue-600 font-black">STREAK: ${potentialStreak.length}</span>`;
        reward.textContent = `Next: +${potentialStreak.length}`;
      } else {
        reward.textContent = `Next: ?`;
        msg.textContent = state.selectedCardIds.length === 2 ? "No Match" : "Select 2 cards";
      }
      if (state.isGameOver) { document.getElementById('main-content').classList.add('disabled-overlay'); }
      lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      if (!loadState()) initGame();
      else render();
    });
  </script>
</body></html>

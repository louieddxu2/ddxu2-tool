<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>數字解鎖 (Math Unlocker)</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.542.0"></script>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='8' fill='%233b82f6'/%3E%3Ctext x='8' y='11' font-size='10' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E%2B%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    body { -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, sans-serif; }
    
    .card-enter {
      animation: card-pop 0.2s ease-out forwards;
    }
    @keyframes card-pop {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 修正後的選中樣式：使用標準 CSS */
    .card-selected-hand {
      border-color: #3b82f6 !important;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.4), 0 10px 15px -3px rgba(59, 130, 246, 0.2);
      transform: translateY(-4px) scale(1.05);
      z-index: 10;
    }
    .card-selected-reserve {
      border-color: #f59e0b !important;
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.4), 0 10px 15px -3px rgba(245, 158, 11, 0.2);
      transform: translateY(-4px) scale(1.05);
      z-index: 10;
    }

    .calc-success-glow {
      animation: success-glow 1.5s infinite;
      border-color: #10b981 !important;
    }
    @keyframes success-glow {
      0%, 100% { box-shadow: 0 0 5px rgba(16, 185, 129, 0.2); }
      50% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); }
    }
    
    .disabled-overlay { pointer-events: none; opacity: 0.5; filter: grayscale(80%); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col relative">

  <script>
    (function autoRegister() {
      let appPath = window.location.pathname;
      if (appPath.endsWith('index.html')) appPath = appPath.replace('index.html', '');
      if (!appPath.endsWith('/')) appPath += '/';
      if (appPath === '/') return;
      try {
        localStorage.setItem('myAppLauncherLastPath', appPath);
        localStorage.setItem('myAppLauncherLastSeenAt', String(Date.now()));
      } catch {}
      const launcherPath = appPath.replace(/[^/]+\/$/, '');
      const normalizedLauncherPath = launcherPath || '/';
      function configureHomeLinkAndProbe() {
        const homeLinks = Array.from(document.querySelectorAll('[data-home-link]'));
        const homeHref = normalizedLauncherPath.includes('?') ? `${normalizedLauncherPath}&home=1` : `${normalizedLauncherPath}?home=1`;
        homeLinks.forEach(el => el.setAttribute('href', homeHref));
        if (window.location.protocol === 'file:') return;
        const probeUrl = normalizedLauncherPath.endsWith('/') ? `${normalizedLauncherPath}index.html` : `${normalizedLauncherPath}/index.html`;
        const revealHome = () => { homeLinks.forEach(el => el.classList.remove('invisible', 'pointer-events-none')); };
        fetch(probeUrl, { method: 'HEAD' }).then(res => {
          if (res.ok) { revealHome(); return; }
          if (res.status === 405) { return fetch(probeUrl, { method: 'GET' }).then(r => { if (r.ok) revealHome(); }); }
        }).catch(() => {});
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', configureHomeLinkAndProbe, { once: true });
      else configureHomeLinkAndProbe();
      const appMeta = { id: 'math-unlocker', name: '數字解鎖', nameZh: '數字解鎖', nameEn: 'Math Unlocker', path: appPath, icon: 'calculator', color: 'blue' };
      const storageKey = 'myAppLauncherStorage';
      const launcherData = JSON.parse(localStorage.getItem(storageKey) || '[]');
      const existingIndex = launcherData.findIndex(app => app.path === appMeta.path);
      if (existingIndex === -1) launcherData.push(appMeta);
      else launcherData[existingIndex] = { ...launcherData[existingIndex], ...appMeta };
      localStorage.setItem(storageKey, JSON.stringify(launcherData));
    })();
  </script>

  <header class="bg-blue-600 text-white p-3 shadow-md sticky top-0 z-20">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <a href="/" data-home-link class="p-2 -ml-2 hover:bg-blue-700 rounded-full transition-colors invisible pointer-events-none">
        <i data-lucide="home" class="w-5 h-5"></i>
      </a>
      <h1 class="text-lg font-bold tracking-tight">數字解鎖</h1>
      <button onclick="resetGame()" class="p-2 -mr-2 hover:bg-blue-700 rounded-full transition-colors">
        <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <main class="flex-grow w-full max-w-md mx-auto p-3 flex flex-col gap-3 pb-6">
    <div class="flex justify-between text-[10px] text-slate-500 font-bold px-1 uppercase tracking-wider">
      <div class="flex items-center gap-1"><i data-lucide="layers" class="w-3.5 h-3.5 text-blue-500"></i> 牌庫: <span id="ui-deck-count" class="text-blue-600">5</span></div>
      <div class="flex items-center gap-1"><i data-lucide="trash-2" class="w-3.5 h-3.5 text-slate-400"></i> 棄牌: <span id="ui-discard-count" class="text-slate-600">0</span></div>
      <div class="flex items-center gap-1"><i data-lucide="target" class="w-3.5 h-3.5 text-emerald-500"></i> 進度: <span id="ui-progress" class="text-emerald-600">0/94</span></div>
    </div>

    <section class="bg-white rounded-2xl p-3 border border-slate-200 shadow-sm">
      <h2 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1"><i data-lucide="unlock" class="w-3 h-3"></i> 待解鎖目標</h2>
      <div class="flex gap-2 justify-between items-center">
        <div class="w-[20%] flex flex-col items-center">
          <div id="ui-market-preview" class="w-full aspect-square bg-slate-50 rounded-lg border-2 border-dashed border-slate-200 flex items-center justify-center font-bold text-lg text-slate-300">?</div>
          <span class="text-[9px] text-slate-400 mt-1 font-bold uppercase">Next</span>
        </div>
        <div class="w-[1px] h-8 bg-slate-100 mx-1"></div>
        <div class="flex-1 grid grid-cols-3 gap-2" id="ui-market-active"></div>
      </div>
    </section>

    <section class="bg-blue-50 rounded-2xl p-3 border border-blue-100 shadow-inner relative" id="ui-calc-area">
      <div class="flex items-center gap-2 mt-4">
        <div class="flex items-center gap-1.5 flex-grow" id="calc-expression-area">
          <div id="slot-0" class="w-12 aspect-square rounded-lg flex items-center justify-center font-bold text-lg bg-white border-2 border-blue-100 border-dashed text-blue-200">1</div>
          <div id="calc-op" class="text-blue-300 font-black text-lg w-4 text-center">?</div>
          <div id="slot-1" class="w-12 aspect-square rounded-lg flex items-center justify-center font-bold text-lg bg-white border-2 border-blue-100 border-dashed text-blue-200">2</div>
          <div class="text-blue-300 font-bold text-lg mx-0.5">=</div>
          <div id="calc-result" class="flex-grow h-12 rounded-lg bg-white border-2 border-blue-100 flex items-center justify-center font-black text-2xl text-slate-200 px-2 min-w-[40px]">「 」</div>
        </div>
        <div class="flex flex-col gap-1 w-[32%] shrink-0 pl-2 border-l border-blue-100">
          <button id="btn-resolve-deck" onclick="resolveUnlock('deck')" disabled class="w-full bg-slate-300 text-white text-[10px] py-2.5 rounded-lg font-bold transition-all uppercase">Deck</button>
          <button id="btn-resolve-reserve" onclick="resolveUnlock('reserve')" disabled class="w-full bg-slate-300 text-white text-[10px] py-2.5 rounded-lg font-bold transition-all uppercase">Zap</button>
        </div>
      </div>
      <div id="calc-msg" class="text-[10px] text-blue-400 font-bold text-center mt-2 h-3 uppercase tracking-tighter">Select 2 cards</div>
    </section>

    <section id="section-hand">
      <div class="flex justify-between items-end mb-1.5 px-1">
        <h2 class="text-[11px] font-bold text-slate-500 uppercase flex items-center gap-1"><i data-lucide="hand" class="w-3 h-3"></i> Hand</h2>
        <span class="text-[10px] text-slate-400 font-bold" id="ui-hand-count">0/10</span>
      </div>
      <div id="ui-hand" class="grid grid-cols-5 gap-2 px-1 min-h-[4rem]"></div>
    </section>

    <section id="section-reserve">
      <h2 class="text-[11px] font-bold text-amber-600 uppercase mb-1.5 px-1 flex items-center gap-1"><i data-lucide="zap" class="w-3 h-3"></i> Reserve</h2>
      <div id="ui-reserve" class="grid grid-cols-5 gap-2 px-1 min-h-[4rem]"></div>
    </section>
  </main>

  <div id="modal-gameover" class="fixed inset-0 bg-slate-900/80 z-50 hidden items-center justify-center p-6 opacity-0 transition-opacity">
    <div class="bg-white rounded-3xl w-full max-w-xs p-6 text-center shadow-2xl">
      <div class="w-16 h-16 rounded-full bg-rose-100 text-rose-500 mx-auto flex items-center justify-center mb-4"><i data-lucide="frown" class="w-8 h-8"></i></div>
      <h2 class="text-2xl font-black text-slate-800 mb-1">STUCK!</h2>
      <p class="text-slate-500 text-sm mb-6">No more moves possible.</p>
      <div class="bg-slate-50 p-4 rounded-2xl mb-6 border border-slate-100">
        <div class="text-[10px] text-slate-400 uppercase font-bold mb-1">Progress</div>
        <div class="text-4xl font-black text-blue-600" id="go-progress">0/94</div>
      </div>
      <button onclick="resetGame()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-200 mb-3">RETRY</button>
      <button onclick="closeGameOverModal()" class="w-full text-slate-400 text-sm font-bold">Inspect Board</button>
    </div>
  </div>
  <script>
    const STORAGE_KEY = 'mathUnlockerState';
    let state = {
      deck: [], hand: [], discard: [], reserve: [],
      marketDeck: [], marketActive: [], marketPreview: null,
      selectedCardIds: [], unlockedCount: 0, nextId: 1, isGameOver: false
    };
    let pendingUnlockInfo = null;
    const HAND_LIMIT = 10;

    const getUid = () => state.nextId++;
    const shuffle = (arr) => {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    };

    function initGame() {
      state.deck = [1, 2, 3, 4, 5].map(v => ({ id: getUid(), val: v }));
      state.hand = []; state.discard = []; state.reserve = [];
      state.selectedCardIds = []; state.unlockedCount = 0; state.isGameOver = false;
      pendingUnlockInfo = null;
      let t1 = Array.from({length: 10}, (_, i) => i + 6);
      let t2 = Array.from({length: 35}, (_, i) => i + 16);
      let t3 = Array.from({length: 49}, (_, i) => i + 51);
      shuffle(t1); shuffle(t2); shuffle(t3);
      state.marketDeck = [...t1, ...t2, ...t3];
      state.marketActive = [state.marketDeck.shift(), state.marketDeck.shift(), state.marketDeck.shift()];
      state.marketPreview = state.marketDeck.shift() || null;
      drawCards(5);
      saveState(); render();
    }

    function drawCards(count) {
      let actualDraw = Math.min(count, HAND_LIMIT - state.hand.length);
      for(let i=0; i<actualDraw; i++) {
        if (state.deck.length === 0) {
          if (state.discard.length === 0) break;
          state.deck = shuffle([...state.discard]); state.discard = [];
        }
        state.hand.push(state.deck.shift());
      }
    }

    function getCardObj(id, source) {
      let arr = source === 'hand' ? state.hand : state.reserve;
      return arr.find(c => c.id === id);
    }

    function selectCard(cardId, source) {
      if (state.isGameOver) return;
      let existIdx = state.selectedCardIds.findIndex(s => s.id === cardId);
      if (existIdx !== -1) state.selectedCardIds.splice(existIdx, 1);
      else {
        if (state.selectedCardIds.length >= 2) state.selectedCardIds.shift();
        state.selectedCardIds.push({id: cardId, source});
      }
      checkMath();
      render();
    }

    function checkMath() {
      pendingUnlockInfo = null;
      if (state.selectedCardIds.length < 2) return;
      let c1 = getCardObj(state.selectedCardIds[0].id, state.selectedCardIds[0].source);
      let c2 = getCardObj(state.selectedCardIds[1].id, state.selectedCardIds[1].source);
      if (!c1 || !c2) { state.selectedCardIds = []; return; }
      let v1 = c1.val, v2 = c2.val;
      let results = [
        { op: '+', val: v1 + v2 },
        { op: '-', val: Math.abs(v1 - v2) },
        { op: '×', val: v1 * v2 }
      ];
      if (v1 !== 0 && v2 !== 0) {
        if (v1 % v2 === 0) results.push({ op: '÷', val: v1 / v2 });
        else if (v2 % v1 === 0) results.push({ op: '÷', val: v2 / v1 });
      }
      for (let r of results) {
        let mIdx = state.marketActive.indexOf(r.val);
        if (mIdx !== -1) {
          pendingUnlockInfo = { matchedValue: r.val, marketIdx: mIdx, op: r.op, consumedCardIds: [...state.selectedCardIds] };
          return;
        }
      }
    }

    function resolveUnlock(choice) {
      if (!pendingUnlockInfo) return;
      const info = pendingUnlockInfo;
      const val = info.matchedValue;
      const drawCount = Math.abs(Math.floor(val/10) - (val%10));
      info.consumedCardIds.forEach(s => {
        let arr = s.source === 'hand' ? state.hand : state.reserve;
        let idx = arr.findIndex(c => c.id === s.id);
        if (idx !== -1) {
          let card = arr.splice(idx, 1)[0];
          if (s.source === 'hand') state.discard.push(card);
        }
      });
      state.marketActive.splice(info.marketIdx, 1);
      if (state.marketPreview) {
        state.marketActive.push(state.marketPreview);
        state.marketPreview = state.marketDeck.shift() || null;
      }
      state.unlockedCount++;
      let newCard = { id: getUid(), val: val };
      if (choice === 'deck') state.discard.push(newCard);
      else state.reserve.push(newCard);
      drawCards(drawCount);
      state.selectedCardIds = []; pendingUnlockInfo = null;
      saveState(); render(); checkGameOver();
    }

    function checkGameOver() {
      let av = [...state.hand, ...state.reserve];
      let hasMove = false;
      if (av.length < 2) { if (state.deck.length > 0 || state.discard.length > 0) hasMove = true; }
      else {
        for (let i = 0; i < av.length; i++) {
          for (let j = i + 1; j < av.length; j++) {
            let res = [av[i].val+av[j].val, Math.abs(av[i].val-av[j].val), av[i].val*av[j].val];
            if(av[i].val!==0 && av[j].val!==0){ if(av[i].val%av[j].val===0)res.push(av[i].val/av[j].val); else if(av[j].val%av[i].val===0)res.push(av[j].val/av[i].val); }
            if (res.some(r => state.marketActive.includes(r))) { hasMove = true; break; }
          }
          if (hasMove) break;
        }
      }
      if (!hasMove) {
        state.isGameOver = true; saveState(); render();
        document.getElementById('go-progress').textContent = `${state.unlockedCount}/94`;
        const m = document.getElementById('modal-gameover'); m.classList.remove('hidden'); m.classList.add('flex');
        setTimeout(() => m.classList.add('opacity-100'), 10);
      }
    }

    function closeGameOverModal() { document.getElementById('modal-gameover').classList.add('hidden'); }
    function resetGame() { localStorage.removeItem(STORAGE_KEY); location.reload(); }
    function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    function loadState() {
      let saved = localStorage.getItem(STORAGE_KEY);
      if (saved) { try { state = JSON.parse(saved); checkMath(); render(); return true; } catch(e) {} }
      return false;
    }

    function renderCard(card, source) {
      const isS = state.selectedCardIds.some(s => s.id === card.id);
      let sClass = isS ? (source === 'hand' ? 'card-selected-hand' : 'card-selected-reserve') : '';
      let cClass = source === 'hand' ? 'bg-white text-blue-700 border-blue-100' : 'bg-amber-50 text-amber-700 border-amber-100';
      return `<button type="button" onclick="selectCard(${card.id}, '${source}')" class="card-enter w-full aspect-square rounded-xl flex items-center justify-center font-bold text-xl border-2 shadow-sm transition-all active:scale-95 ${cClass} ${sClass}">${card.val}</button>`;
    }

    function renderSlot(card, idx) {
      let el = document.getElementById(`slot-${idx}`);
      if (!card) { el.innerHTML = idx+1; el.className = "w-12 aspect-square rounded-lg flex items-center justify-center font-bold text-sm bg-white border-2 border-blue-50 border-dashed text-blue-100"; }
      else { el.innerHTML = card.val; el.className = `w-12 aspect-square rounded-lg flex items-center justify-center font-bold text-xl shadow-sm text-white ${card.source==='hand'?'bg-blue-600':'bg-amber-500'}`; }
    }

    function render() {
      document.getElementById('ui-deck-count').textContent = state.deck.length;
      document.getElementById('ui-discard-count').textContent = state.discard.length;
      document.getElementById('ui-progress').textContent = `${state.unlockedCount}/94`;
      document.getElementById('ui-hand-count').textContent = `${state.hand.length}/${HAND_LIMIT}`;
      document.getElementById('ui-market-active').innerHTML = state.marketActive.map(v => `<div class="aspect-square w-full bg-slate-800 text-white rounded-xl flex items-center justify-center font-black text-2xl border-2 border-slate-700 shadow-sm">${v}</div>`).join('');
      document.getElementById('ui-market-preview').textContent = state.marketPreview || '';
      document.getElementById('ui-hand').innerHTML = state.hand.map(c => renderCard(c, 'hand')).join('') || '<div class="col-span-5 text-slate-300 text-[10px] text-center py-4">EMPTY</div>';
      document.getElementById('ui-reserve').innerHTML = state.reserve.map(c => renderCard(c, 'reserve')).join('') || '<div class="col-span-5 text-amber-200 text-[10px] text-center py-4">EMPTY</div>';
      let c1 = state.selectedCardIds[0] ? {...getCardObj(state.selectedCardIds[0].id, state.selectedCardIds[0].source), source: state.selectedCardIds[0].source} : null;
      let c2 = state.selectedCardIds[1] ? {...getCardObj(state.selectedCardIds[1].id, state.selectedCardIds[1].source), source: state.selectedCardIds[1].source} : null;
      renderSlot(c1, 0); renderSlot(c2, 1);
      const op = document.getElementById('calc-op'), res = document.getElementById('calc-result'), msg = document.getElementById('calc-msg'), expr = document.getElementById('calc-expression-area'), bD = document.getElementById('btn-resolve-deck'), bR = document.getElementById('btn-resolve-reserve');
      op.textContent = "?"; res.textContent = "「 」"; res.className = "flex-grow h-12 rounded-lg bg-white border-2 border-blue-50 flex items-center justify-center font-black text-2xl text-slate-100";
      expr.classList.remove('calc-success-glow'); bD.disabled = bR.disabled = true; bD.className = bR.className = "w-full bg-slate-200 text-white text-[10px] py-2.5 rounded-lg font-bold uppercase";
      if (pendingUnlockInfo) {
        op.textContent = pendingUnlockInfo.op; res.textContent = pendingUnlockInfo.matchedValue; res.className = "flex-grow h-12 rounded-lg bg-emerald-50 border-2 border-emerald-400 flex items-center justify-center font-black text-2xl text-emerald-700 shadow-sm";
        expr.classList.add('calc-success-glow'); bD.disabled = bR.disabled = false; bD.className = "w-full bg-emerald-600 text-white text-[10px] py-2.5 rounded-lg font-bold uppercase shadow-md"; bR.className = "w-full bg-amber-500 text-white text-[10px] py-2.5 rounded-lg font-bold uppercase shadow-md";
        msg.textContent = "SUCCESS! CHOOSE TARGET";
      } else if (state.selectedCardIds.length === 2) { res.textContent = "X"; res.className = "flex-grow h-12 rounded-lg bg-rose-50 border-2 border-rose-100 flex items-center justify-center font-black text-2xl text-rose-300"; msg.textContent = "NO MATCH"; }
      if (state.isGameOver) { document.getElementById('section-hand').classList.add('disabled-overlay'); document.getElementById('section-reserve').classList.add('disabled-overlay'); document.getElementById('ui-calc-area').classList.add('disabled-overlay'); }
      lucide.createIcons();
    }
    document.addEventListener('DOMContentLoaded', () => { if (!loadState()) initGame(); });
  </script>
</body>
</html>

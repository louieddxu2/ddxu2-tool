<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>數字解鎖 (Math Unlocker)</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.542.0"></script>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='8' fill='%233b82f6'/%3E%3Ctext x='8' y='11' font-size='10' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E%2B%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    body { -webkit-tap-highlight-color: transparent; font-family: sans-serif; }
    
    /* 卡牌進入動畫 */
    .card-enter {
      animation: card-pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes card-pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 遊戲結束時的鎖定樣式 */
    .disabled-overlay {
      pointer-events: none;
      opacity: 0.5;
      filter: grayscale(80%);
    }

    /* 卡牌被選中時的高亮光暈 */
    .card-selected-hand {
      composes: ring-4 ring-blue-500 ring-offset-2 shadow-lg shadow-blue-200;
      transform: translateY(-4px) scale(1.03);
    }
    .card-selected-reserve {
      composes: ring-4 ring-amber-500 ring-offset-2 shadow-lg shadow-amber-200;
      transform: translateY(-4px) scale(1.03);
    }

    /* 算式成功時的光暈 */
    .calc-success-glow {
      animation: success-glow 1.5s infinite;
    }
    @keyframes success-glow {
      0%, 100% { box-shadow: 0 0 5px rgba(16, 185, 129, 0.2); border-color: #10b981; }
      50% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.6); border-color: #34d399; }
    }
    
    /* 隱藏滾動條但保持功能 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col relative no-scrollbar">

  <script>
    /* 自動註冊規則 */
    (function autoRegister() {
      let appPath = window.location.pathname;
      if (appPath.endsWith('index.html')) appPath = appPath.replace('index.html', '');
      if (!appPath.endsWith('/')) appPath += '/';
      if (appPath === '/') return;

      try {
        localStorage.setItem('myAppLauncherLastPath', appPath);
        localStorage.setItem('myAppLauncherLastSeenAt', String(Date.now()));
      } catch {}

      const launcherPath = appPath.replace(/[^/]+\/$/, '');
      const normalizedLauncherPath = launcherPath || '/';

      function configureHomeLinkAndProbe() {
        const homeLinks = Array.from(document.querySelectorAll('[data-home-link]'));
        const homeHref = normalizedLauncherPath.includes('?') ? `${normalizedLauncherPath}&home=1` : `${normalizedLauncherPath}?home=1`;
        homeLinks.forEach(el => el.setAttribute('href', homeHref));

        if (window.location.protocol === 'file:') return;

        const probeUrl = normalizedLauncherPath.endsWith('/') ? `${normalizedLauncherPath}index.html` : `${normalizedLauncherPath}/index.html`;
        const revealHome = () => { homeLinks.forEach(el => el.classList.remove('invisible', 'pointer-events-none')); };

        fetch(probeUrl, { method: 'HEAD' })
          .then(res => {
            if (res.ok) { revealHome(); return; }
            if (res.status === 405) { return fetch(probeUrl, { method: 'GET' }).then(r => { if (r.ok) revealHome(); }); }
          })
          .catch(() => {});
      }

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', configureHomeLinkAndProbe, { once: true });
      else configureHomeLinkAndProbe();

      const appMeta = { id: 'math-unlocker', name: '數字解鎖', nameZh: '數字解鎖', nameEn: 'Math Unlocker', path: appPath, icon: 'calculator', color: 'blue' };
      const storageKey = 'myAppLauncherStorage';
      const launcherData = JSON.parse(localStorage.getItem(storageKey) || '[]');
      const existingIndex = launcherData.findIndex(app => app.path === appMeta.path);
      if (existingIndex === -1) launcherData.push(appMeta);
      else launcherData[existingIndex] = { ...launcherData[existingIndex], ...appMeta };
      localStorage.setItem(storageKey, JSON.stringify(launcherData));
    })();
  </script>

  <header class="bg-blue-600 text-white p-3 shadow-md sticky top-0 z-20">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <a href="/" data-home-link class="p-2 -ml-2 hover:bg-blue-700 rounded-full transition-colors invisible pointer-events-none" aria-label="返回目錄">
        <i data-lucide="home" class="w-5 h-5"></i>
      </a>
      <h1 class="text-lg font-bold tracking-tight">數字解鎖</h1>
      <button onclick="resetGame()" class="p-2 -mr-2 hover:bg-blue-700 rounded-full transition-colors" aria-label="重新開始">
        <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <main class="flex-grow w-full max-w-md mx-auto p-3 flex flex-col gap-3 pb-6">
    
    <div class="flex justify-between text-xs text-slate-500 font-medium px-1">
      <div class="flex items-center gap-1"><i data-lucide="layers" class="w-4 h-4"></i> 牌庫: <span id="ui-deck-count" class="text-blue-600 font-bold">5</span></div>
      <div class="flex items-center gap-1"><i data-lucide="trash-2" class="w-4 h-4"></i> 棄牌: <span id="ui-discard-count" class="text-slate-600 font-bold">0</span></div>
      <div class="flex items-center gap-1"><i data-lucide="target" class="w-4 h-4"></i> 進度: <span id="ui-progress" class="text-emerald-600 font-bold">0/94</span></div>
    </div>

    <section class="bg-white rounded-2xl p-3 border border-slate-200 shadow-sm relative overflow-hidden">
      <h2 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1"><i data-lucide="unlock" class="w-3 h-3"></i> 待解鎖目標</h2>
      <div class="flex gap-2 justify-between items-center">
        <div class="w-[22%] flex flex-col items-center opacity-70">
          <span class="text-[10px] text-slate-400 mb-1 font-bold">牌庫頂</span>
          <div id="ui-market-preview" class="w-full aspect-square bg-slate-100 rounded-lg border-2 border-dashed border-slate-300 flex items-center justify-center font-bold text-lg text-slate-500 shadow-inner">
            ?
          </div>
        </div>
        <div class="w-[1px] h-10 bg-slate-200 mx-1"></div>
        <div class="flex-1 grid grid-cols-3 gap-2" id="ui-market-active">
          </div>
      </div>
    </section>

    <section class="bg-blue-50 rounded-2xl p-3 border border-blue-100 shadow-inner relative" id="ui-calc-area">
      <h2 class="absolute top-2 left-3 text-[10px] font-bold text-blue-300 uppercase tracking-wider">運算與決策區</h2>
      
      <div class="flex items-center gap-2 mt-4 mb-1">
        
        <div class="flex items-center gap-2 flex-grow" id="calc-expression-area">
          <div id="slot-0" class="w-[18%] aspect-square rounded-lg flex items-center justify-center font-bold text-lg transition-all bg-white border-2 border-blue-100 border-dashed text-blue-200">
            1
          </div>
          
          <div id="calc-op" class="text-blue-300 font-black text-xl w-5 text-center">?</div>
          
          <div id="slot-1" class="w-[18%] aspect-square rounded-lg flex items-center justify-center font-bold text-lg transition-all bg-white border-2 border-blue-100 border-dashed text-blue-200">
            2
          </div>

          <div class="text-blue-300 font-bold text-lg mx-0.5">=</div>
          <div id="calc-result" class="flex-grow h-12 rounded-lg bg-white border-2 border-blue-100 flex items-center justify-center font-black text-2xl text-slate-300 px-2 min-w-[50px]">
            「 」
          </div>
        </div>

        <div class="flex flex-col gap-1.5 w-[35%] shrink-0 pl-2 border-l border-blue-100">
          <button id="btn-resolve-deck" onclick="resolveUnlock('deck')" disabled class="w-full bg-slate-300 text-white text-xs py-2 rounded-lg font-bold flex items-center justify-center gap-1 transition-all">
            <i data-lucide="layers" class="w-3.5 h-3.5"></i>
            加入牌庫
          </button>
          <button id="btn-resolve-reserve" onclick="resolveUnlock('reserve')" disabled class="w-full bg-slate-300 text-white text-xs py-2 rounded-lg font-bold flex items-center justify-center gap-1 transition-all">
            <i data-lucide="zap" class="w-3.5 h-3.5"></i>
            放在備用
          </button>
        </div>
      </div>
      
      <div id="calc-msg" class="text-[10px] text-blue-400 font-medium text-center mt-2 h-3 overflow-hidden">請從下方選擇兩張卡牌</div>

    </section>

    <section id="section-hand">
      <div class="flex justify-between items-end mb-2 px-1">
        <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1"><i data-lucide="hand" class="w-3 h-3"></i> 我的手牌</h2>
        <span class="text-[10px] text-slate-400 font-bold" id="ui-hand-count">0/10</span>
      </div>
      <div id="ui-hand" class="grid grid-cols-5 gap-2 px-1 min-h-[4rem]">
        </div>
    </section>

    <section id="section-reserve">
      <h2 class="text-xs font-bold text-amber-600 uppercase tracking-wider mb-2 px-1 flex items-center gap-1"><i data-lucide="zap" class="w-3 h-3"></i> 備用區 (單次使用)</h2>
      <div id="ui-reserve" class="grid grid-cols-5 gap-2 px-1 min-h-[4rem]">
        </div>
    </section>
  </main>

  <div id="modal-gameover" class="fixed inset-0 bg-slate-900/80 z-50 hidden items-center justify-center p-4 opacity-0 transition-opacity">
    <div class="bg-white rounded-2xl w-full max-w-sm p-6 text-center shadow-2xl">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-rose-100 text-rose-500 mb-4">
        <i data-lucide="frown" class="w-8 h-8"></i>
      </div>
      <h2 class="text-2xl font-bold text-slate-800 mb-2">無法繼續解鎖</h2>
      <p class="text-slate-500 text-sm mb-6 overflow-y-auto max-h-24 no-scrollbar">目前手牌與備用區的組合，已無法運算出任何場上目標，且無抽牌機會了。</p>
      
      <div class="bg-slate-50 p-4 rounded-xl mb-6 border border-slate-100">
        <div class="text-xs text-slate-400 uppercase mb-1">最終進度</div>
        <div class="text-3xl font-bold text-blue-600" id="go-progress">0/94</div>
      </div>

      <div class="flex flex-col gap-2">
        <button onclick="resetGame()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition-colors shadow-md">
          重新挑戰
        </button>
        <button onclick="closeGameOverModal()" class="w-full bg-slate-100 text-slate-600 py-3 rounded-xl font-bold hover:bg-slate-200 transition-colors">
          關閉以檢視盤面
        </button>
      </div>
    </div>
  </div>
  <script>
    // --- 遊戲邏輯 ---
    const STORAGE_KEY = 'mathUnlockerState';
    
    let state = {
      deck: [],
      hand: [],
      discard: [],
      reserve: [],
      marketDeck: [],
      marketActive: [],
      marketPreview: null,
      selectedCardIds: [], // 僅儲存 ID: {id, source}
      unlockedCount: 0,
      nextId: 1,
      isGameOver: false
    };

    // 暫存運算成功的資訊
    let pendingUnlockInfo = null; 
    const HAND_LIMIT = 10;

    const getUid = () => state.nextId++;
    const shuffle = (arr) => {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    };

    function initGame() {
      state.deck = [1, 2, 3, 4, 5].map(v => ({ id: getUid(), val: v }));
      state.hand = [];
      state.discard = [];
      state.reserve = [];
      state.selectedCardIds = [];
      state.unlockedCount = 0;
      state.isGameOver = false;
      pendingUnlockInfo = null;

      let t1 = Array.from({length: 10}, (_, i) => i + 6);   
      let t2 = Array.from({length: 35}, (_, i) => i + 16);  
      let t3 = Array.from({length: 49}, (_, i) => i + 51);  
      shuffle(t1); shuffle(t2); shuffle(t3);
      state.marketDeck = [...t1, ...t2, ...t3];

      state.marketActive = [
        state.marketDeck.shift(),
        state.marketDeck.shift(),
        state.marketDeck.shift()
      ];
      state.marketPreview = state.marketDeck.shift() || null;

      drawCards(5);
      saveState();
      render();
    }

    function drawCards(count) {
      let space = HAND_LIMIT - state.hand.length;
      let actualDraw = Math.min(count, space); 
      
      for(let i=0; i<actualDraw; i++) {
        if (state.deck.length === 0) {
          if (state.discard.length === 0) break;
          state.deck = shuffle([...state.discard]);
          state.discard = [];
        }
        state.hand.push(state.deck.shift());
      }
    }

    // 取得卡牌物件
    function getCardObj(id, source) {
      let arr = source === 'hand' ? state.hand : state.reserve;
      return arr.find(c => c.id === id);
    }

    function selectCard(cardId, source) {
      if (state.isGameOver) return;
      
      // 檢查是否已選取
      let existIdx = state.selectedCardIds.findIndex(s => s.id === cardId);
      
      if (existIdx !== -1) {
        // 取消選取
        state.selectedCardIds.splice(existIdx, 1);
      } else {
        // 新選取 (最多兩張)
        if (state.selectedCardIds.length >= 2) {
          state.selectedCardIds.shift(); // 移除第一張
        }
        state.selectedCardIds.push({id: cardId, source});
      }
      
      // 每次選取變更都重新計算
      checkMath();
      render();
    }

    function getPossibleResults(a, b) {
      let res = [];
      // 保持 op 順序：+, -, *, /
      res.push({ op: '+', val: a + b });
      res.push({ op: '-', val: Math.abs(a - b) });
      res.push({ op: '×', val: a * b });
      if (a !== 0 && b !== 0) {
        if (a % b === 0) res.push({ op: '÷', val: a / b });
        else if (b % a === 0) res.push({ op: '÷', val: b / a });
      }
      return res;
    }

    function checkMath() {
      pendingUnlockInfo = null; // 重置

      if (state.selectedCardIds.length < 2) return;
      
      let c1 = getCardObj(state.selectedCardIds[0].id, state.selectedCardIds[0].source);
      let c2 = getCardObj(state.selectedCardIds[1].id, state.selectedCardIds[1].source);
      
      if (!c1 || !c2) { state.selectedCardIds = []; return; } // 資料異常修正

      let v1 = c1.val;
      let v2 = c2.val;
      let results = getPossibleResults(v1, v2);

      // 嚴格按照優先級判定
      for (let r of results) {
        let mIdx = state.marketActive.indexOf(r.val);
        if (mIdx !== -1) {
          // 算出目標！暫存資訊
          pendingUnlockInfo = {
            matchedValue: r.val,
            marketIdx: mIdx,
            op: r.op,
            // 記錄要消耗的原始卡牌 ID
            consumedCardIds: [...state.selectedCardIds] 
          };
          return; // 找到第一個符合的就停止
        }
      }
    }

    // 真正執行解鎖 (點擊決策按鈕時)
    function resolveUnlock(choice) {
      if (!pendingUnlockInfo || state.isGameOver) return;
      
      const info = pendingUnlockInfo;
      const val = info.matchedValue;
      const drawCount = Math.abs(Math.floor(val/10) - (val%10));

      // 1. 消耗卡牌 (從原始陣列移除)
      info.consumedCardIds.forEach(s => {
        let arr = s.source === 'hand' ? state.hand : state.reserve;
        let idx = arr.findIndex(c => c.id === s.id);
        if (idx !== -1) {
          let card = arr.splice(idx, 1)[0];
          // 手牌消耗進入棄牌堆，備用消耗則消失
          if (s.source === 'hand') state.discard.push(card);
        }
      });

      // 2. 市場推進
      state.marketActive.splice(info.marketIdx, 1);
      if (state.marketPreview) {
        state.marketActive.push(state.marketPreview);
        state.marketPreview = state.marketDeck.shift() || null;
      }

      state.unlockedCount++;

      // 3. 生成新牌並依決策置放
      let newCard = { id: getUid(), val: val };
      if (choice === 'deck') state.discard.push(newCard);
      else state.reserve.push(newCard); 

      // 4. 抽牌
      drawCards(drawCount);

      // 5. 清理狀態
      state.selectedCardIds = [];
      pendingUnlockInfo = null;
      
      saveState();
      render();
      checkGameOver();
    }

    function checkGameOver() {
      // 遊戲結束判定邏輯不變
      let available = [...state.hand, ...state.reserve];
      let hasValidMove = false;

      if (available.length < 2) {
          // 剩下一張牌，除非牌庫還能抽，否則死路
          if (state.deck.length === 0 && state.discard.length === 0) hasValidMove = false;
          else hasValidMove = true; // 理論上這遊戲不會有這種狀況，解鎖才會抽牌
      } else {
        // 檢查任意兩張組合
        for (let i = 0; i < available.length; i++) {
          for (let j = i + 1; j < available.length; j++) {
            let results = getPossibleResults(available[i].val, available[j].val);
            for (let r of results) {
                if (state.marketActive.includes(r.val)) {
                  hasValidMove = true;
                  break;
                }
            }
            if (hasValidMove) break;
          }
          if (hasValidMove) break;
        }
      }

      if (!hasValidMove) {
        state.isGameOver = true;
        saveState();
        render();
        document.getElementById('go-progress').textContent = `${state.unlockedCount}/94`;
        const modal = document.getElementById('modal-gameover');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        setTimeout(() => modal.classList.remove('opacity-0'), 10);
      }
    }

    function closeGameOverModal() {
      const modal = document.getElementById('modal-gameover');
      modal.classList.add('opacity-0');
      setTimeout(() => { modal.classList.remove('flex'); modal.classList.add('hidden'); }, 300);
    }

    function resetGame() {
      localStorage.removeItem(STORAGE_KEY);
      document.getElementById('modal-gameover').classList.add('hidden', 'opacity-0');
      initGame();
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadState() {
      let saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          state = JSON.parse(saved);
          // 載入時重新跑一次計算，還原 pendingUnlockInfo
          checkMath(); 
          render();
          return true;
        } catch(e) {}
      }
      return false;
    }

    // --- 繪圖邏輯 ---
    function renderCard(card, source) {
      const isSelected = state.selectedCardIds.some(s => s.id === card.id);
      
      let baseClass = "card-enter w-full aspect-square rounded-xl flex items-center justify-center font-bold text-xl border-2 shadow-sm transition-all active:scale-95";
      let colorClass = source === 'hand' 
        ? 'bg-white border-blue-100 text-blue-700 hover:border-blue-300' 
        : 'bg-amber-50 border-amber-100 text-amber-700 hover:border-amber-300';
      let selectedClass = source === 'hand' ? 'card-selected-hand' : 'card-selected-reserve';

      return `
        <button onclick="selectCard(${card.id}, '${source}')" class="${baseClass} ${colorClass} ${isSelected ? selectedClass : ''}">
          ${card.val}
        </button>
      `;
    }

    // 渲染運算槽位 (影武者)
    function renderSlot(cardObj, idx) {
      let el = document.getElementById(`slot-${idx}`);
      if (!cardObj) {
        el.innerHTML = idx + 1;
        el.className = "w-[18%] aspect-square rounded-lg flex items-center justify-center font-bold text-lg transition-all bg-white border-2 border-blue-100 border-dashed text-blue-100";
      } else {
        let bg = cardObj.source === 'hand' ? 'bg-blue-600 text-white border-blue-700' : 'bg-amber-500 text-white border-amber-600';
        el.innerHTML = cardObj.val;
        el.className = `w-[18%] aspect-square rounded-lg flex items-center justify-center font-bold text-xl transition-all shadow-md ${bg}`;
      }
    }

    function render() {
      // 1. 基礎資訊
      document.getElementById('ui-deck-count').textContent = state.deck.length;
      document.getElementById('ui-discard-count').textContent = state.discard.length;
      document.getElementById('ui-progress').textContent = `${state.unlockedCount}/94`;
      document.getElementById('ui-hand-count').textContent = `${state.hand.length}/${HAND_LIMIT}`;

      // 2. 市場
      const marketHTML = state.marketActive.map(val => `
        <div class="aspect-square w-full bg-slate-800 text-white rounded-xl flex items-center justify-center font-black text-2xl shadow-[0_3px_0_0_rgba(15,23,42,1)] border-2 border-slate-700 card-enter">
          ${val}
        </div>
      `).join('');
      document.getElementById('ui-market-active').innerHTML = marketHTML || '<div class="col-span-3 text-center text-slate-400 py-4 text-sm font-bold">全數解鎖！</div>';
      
      let previewEl = document.getElementById('ui-market-preview');
      if (state.marketPreview) { previewEl.innerHTML = state.marketPreview; previewEl.classList.remove('opacity-0'); }
      else { previewEl.innerHTML = ''; previewEl.classList.add('opacity-0'); }

      // 3. 手牌與備用 (更新選中狀態)
      document.getElementById('ui-hand').innerHTML = state.hand.map(c => renderCard(c, 'hand')).join('') || '<div class="col-span-5 text-slate-300 text-xs flex items-center justify-center font-medium py-2">無</div>';
      document.getElementById('ui-reserve').innerHTML = state.reserve.map(c => renderCard(c, 'reserve')).join('') || '<div class="col-span-5 text-amber-200/80 text-xs flex items-center justify-center font-medium py-2">無</div>';

      // 4. 更新運算區 UI
      let c1 = state.selectedCardIds[0] ? getCardObj(state.selectedCardIds[0].id, state.selectedCardIds[0].source) : null;
      let c2 = state.selectedCardIds[1] ? getCardObj(state.selectedCardIds[1].id, state.selectedCardIds[1].source) : null;
      // c1/c2 加入 source 資訊供 renderSlot 使用
      if(c1) c1.source = state.selectedCardIds[0].source;
      if(c2) c2.source = state.selectedCardIds[1].source;

      renderSlot(c1, 0);
      renderSlot(c2, 1);

      const opEl = document.getElementById('calc-op');
      const resultEl = document.getElementById('calc-result');
      const msgEl = document.getElementById('calc-msg');
      const exprArea = document.getElementById('calc-expression-area');
      const btnDeck = document.getElementById('btn-resolve-deck');
      const btnReserve = document.getElementById('btn-resolve-reserve');

      // 預設重置運算區樣式
      opEl.textContent = "?";
      opEl.className = "text-blue-300 font-black text-xl w-5 text-center";
      resultEl.textContent = "「 」";
      resultEl.className = "flex-grow h-12 rounded-lg bg-white border-2 border-blue-100 flex items-center justify-center font-black text-2xl text-slate-300 px-2 min-w-[50px]";
      exprArea.classList.remove('calc-success-glow');
      
      // 禁用決策按鈕
      btnDeck.disabled = true; btnDeck.className = btnDeck.className.replace('bg-emerald-600', 'bg-slate-300');
      btnReserve.disabled = true; btnReserve.className = btnReserve.className.replace('bg-amber-500', 'bg-slate-300');

      if (state.selectedCardIds.length === 0) {
        msgEl.textContent = "請從下方選擇兩張卡牌";
      } else if (state.selectedCardIds.length === 1) {
        msgEl.textContent = "請再選擇一張卡牌進行運算";
      } else {
        // 選了兩張，檢查 pendingUnlockInfo
        if (pendingUnlockInfo) {
          const info = pendingUnlockInfo;
          const drawCount = Math.abs(Math.floor(info.matchedValue/10) - (info.matchedValue%10));
          
          // 更新算式 UI
          opEl.textContent = info.op;
          opEl.classList.remove('text-blue-300'); opEl.classList.add('text-emerald-600');
          
          resultEl.textContent = info.matchedValue;
          resultEl.classList.remove('text-slate-300', 'border-blue-100'); resultEl.classList.add('text-emerald-700', 'border-emerald-300', 'bg-emerald-50');
          
          exprArea.classList.add('calc-success-glow');
          
          msgEl.innerHTML = `<span class="text-emerald-600 font-bold">成功算出目標！</span> 可抽 ${drawCount} 張牌，請選擇去向`;

          // 啟用決策按鈕 (亮起)
          btnDeck.disabled = false; btnDeck.className = btnDeck.className.replace('bg-slate-300', 'bg-emerald-600 hover:bg-emerald-700');
          btnReserve.disabled = false; btnReserve.className = btnReserve.className.replace('bg-slate-300', 'bg-amber-500 hover:bg-amber-600');

        } else {
          // 選了兩張但沒配對成功
          opEl.textContent = "?";
          resultEl.textContent = "X";
          resultEl.classList.add('text-rose-400', 'border-rose-200', 'bg-rose-50');
          msgEl.textContent = "無法解鎖目前的目標數字";
        }
      }

      // 5. Game Over 鎖定盤面
      const mainEl = document.querySelector('main');
      if (state.isGameOver) {
        document.getElementById('section-hand').classList.add('disabled-overlay');
        document.getElementById('section-reserve').classList.add('disabled-overlay');
        document.getElementById('ui-calc-area').classList.add('disabled-overlay');
      } else {
        document.getElementById('section-hand').classList.remove('disabled-overlay');
        document.getElementById('section-reserve').classList.remove('disabled-overlay');
        document.getElementById('ui-calc-area').classList.remove('disabled-overlay');
      }

      lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      if (!loadState()) {
        initGame();
      } else if (state.isGameOver) {
        // 如果載入時已經是 Game Over 狀態，重新顯示 Modal 提示
        document.getElementById('go-progress').textContent = `${state.unlockedCount}/94`;
        const modal = document.getElementById('modal-gameover');
        modal.classList.remove('hidden');
        modal.classList.add('flex', 'opacity-100');
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>黑白算術對決</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.300.0"></script>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='8' fill='%231e293b'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#1e293b">
  <style>
    ::-webkit-scrollbar {
      width: 0;
      background: transparent;
    }

    body {
      -webkit-tap-highlight-color: transparent;
    }

    .ai-thinking {
      animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .5;
      }
    }

    .card-pop {
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% {
        transform: scale(0.8);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .play-area {
      position: relative;
      overflow: hidden;
      transition: border-color 220ms ease, background-color 220ms ease, box-shadow 220ms ease;
    }

    .play-area.is-working {
      border-color: rgb(96 165 250);
      background: linear-gradient(180deg, rgb(239 246 255), rgb(255 255 255));
      box-shadow: 0 12px 30px rgb(59 130 246 / 0.12);
    }

    .play-stage-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 38px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }

    .play-stage-slot {
      min-height: 96px;
      padding: 8px;
      border: 1px dashed rgb(148 163 184 / 0.8);
      border-radius: 16px;
      background: rgb(248 250 252 / 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: border-color 220ms ease, background-color 220ms ease, transform 220ms ease;
    }

    .play-stage-slot.is-active {
      border-color: rgb(96 165 250);
      background: rgb(239 246 255);
      transform: translateY(-2px);
    }

    .play-stage-cards {
      min-height: 64px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .play-stage-empty {
      color: rgb(148 163 184);
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      line-height: 1.25;
    }

    .play-stage-operator {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: rgb(226 232 240);
      color: rgb(71 85 105);
      font-size: 20px;
      font-weight: 900;
      box-shadow: inset 0 0 0 1px rgb(148 163 184 / 0.4);
    }

    @media (max-width: 360px) {
      .play-stage-grid {
        grid-template-columns: minmax(0, 1fr) 30px minmax(0, 1fr);
        gap: 4px;
      }

      .play-stage-operator {
        width: 30px;
        height: 30px;
      }
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans selection:bg-blue-200">

    (function autoRegister() {
      let appPath = window.location.pathname;
      if (appPath.endsWith('index.html')) appPath = appPath.replace('index.html', '');
      if (!appPath.endsWith('/')) appPath += '/';
      if (appPath === '/') return;
      try { localStorage.setItem('myAppLauncherLastPath', appPath); } catch { }
      const launcherPath = appPath.replace(/[^/]+\/$/, '') || '/';
      const homeHref = launcherPath.includes('?') ? `${launcherPath}&home=1` : `${launcherPath}?home=1`;
      window.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('[data-home-link]').forEach(el => { el.setAttribute('href', homeHref); el.classList.remove('invisible', 'pointer-events-none'); });
      });
      const appMeta = { id: 'math-duel', name: '黑白算術對決', nameZh: '黑白算術對決', nameEn: 'Math Duel', path: appPath, icon: 'swords', color: 'slate' };
      const storageKey = 'myAppLauncherStorage';
      const launcherData = JSON.parse(localStorage.getItem(storageKey) || '[]');
      const idx = launcherData.findIndex(a => a.path === appMeta.path);
      if (idx === -1) launcherData.push(appMeta); else launcherData[idx] = { ...launcherData[idx], ...appMeta };
      localStorage.setItem(storageKey, JSON.stringify(launcherData));
    })();

   <script src="rule-modes.js"></script>
  <script src="../shared/card-motion.js?v=1"></script>
  <script>
    // ==========================================
    // ⚙️ 系統版本控制
    // 每次你修改了 index.html 或 ai-worker.js 後，
    // 請將這個數字往上加（例如 '1.0.0' 改為 '1.0.1'）
     const APP_VERSION = '1.2.5';
    // ==========================================

    // --- 1. 載入外部 Worker 檔案 (加上版號破解快取) ---
    const worker = new Worker(`ai-worker.js?v=${APP_VERSION}`);
    let aiTimeoutToken = null;

    // --- 2. 存檔 Key 也綁定版號 (徹底預防讀取到舊版卡死狀態) ---
    const SAVE_KEY = `mathDuelState_v${APP_VERSION}`;

    function createInitialState(mode = 'PVP', ruleMode = MathDuelRuleModes.RULE_MODE.CLASSIC) {
      const aiSide = (mode.startsWith('AI')) ? (Math.random() < 0.5 ? 'BLACK' : 'WHITE') : null;
      const gameState = {
        mode: mode,
        ruleMode: ruleMode,
        turn: 'BLACK',
        aiSide: aiSide,
        aiColor: aiSide ? (aiSide === 'BLACK' ? 'b' : 'w') : null,
        playerColor: aiSide ? (aiSide === 'BLACK' ? 'w' : 'b') : null,
        state: 'PLAYING', winner: null,
        blackHand: Array.from({ length: 9 }, (_, i) => ({ id: `b${i + 1}`, val: i + 1, color: 'b' })),
        whiteHand: Array.from({ length: 8 }, (_, i) => ({ id: `w${i + 1}`, val: i + 1, color: 'w' })),
        center: [{ id: 'w9', val: 9, color: 'w' }],
        selections: { hand: [], center: [], operator: null },
        discardSelections: [],
        lastMove: null,
        aiMoveInfo: null,
        movePreview: null,
        uiBusy: false
      };
      return MathDuelRuleModes.initRuleState(gameState, ruleMode);
    }

    let game = loadState() || createInitialState('PVP');
    game = MathDuelRuleModes.ensureRuleState(game);
    document.getElementById('mode-select').value = game.mode;
    document.getElementById('rule-mode-select').value = game.ruleMode;

    // ... 後續的 saveState, loadState 與遊戲邏輯保持不變 ...


    function saveState() { localStorage.setItem(SAVE_KEY, JSON.stringify(game)); }
    function loadState() {
      try {
        const saved = localStorage.getItem(SAVE_KEY);
        const parsed = saved ? JSON.parse(saved) : null;
        return parsed ? MathDuelRuleModes.ensureRuleState(parsed) : null;
      } catch (e) {
        return null;
      }
    }

    function changeMode(newMode) {
      if (confirm(t('confirm_change_mode'))) {
        game = createInitialState(newMode, game.ruleMode);
        saveState(); render(); checkAITurn();
      } else {
        document.getElementById('mode-select').value = game.mode;
      }
    }

    function changeRuleMode(newRuleMode) {
      if (confirm(t('confirm_change_mode'))) {
        game = createInitialState(game.mode, newRuleMode);
        saveState(); render(); checkAITurn();
      } else {
        document.getElementById('rule-mode-select').value = game.ruleMode;
      }
    }

    function resetGame(force = false) {
      if (force && !confirm(t('confirm_reset'))) return;
      game = createInitialState(game.mode, game.ruleMode);
      saveState(); render();
      checkAITurn();
    }

    function isRace2Mode() {
      return MathDuelRuleModes.isRace2(game);
    }

    function passTurn() {
      if (!isRace2Mode() || game.state !== 'PLAYING' || isAITurn()) return;
      const ended = MathDuelRuleModes.applyPassPoint(game);
      if (!ended) game.turn = game.turn === 'BLACK' ? 'WHITE' : 'BLACK';
      saveState(); render(); checkAITurn();
    }

    // --- 前端運算共用區 ---
    function getPermutations(arr) {
      if (arr.length <= 1) return [arr];
      let res = [];
      for (let i = 0; i < arr.length; i++) {
        let cur = arr[i], rem = arr.slice(0, i).concat(arr.slice(i + 1));
        for (let p of getPermutations(rem)) res.push([cur].concat(p));
      }
      return res;
    }
    function getValues(cards) {
      if (cards.length === 1) return (cards[0].val === 6 || cards[0].val === 9) ? [6, 9] : [cards[0].val];
      if (cards.length === 2) {
        let v1_opts = (cards[0].val === 6 || cards[0].val === 9) ? [6, 9] : [cards[0].val];
        let v2_opts = (cards[1].val === 6 || cards[1].val === 9) ? [6, 9] : [cards[1].val];
        let vals = [];
        for (let v1 of v1_opts) for (let v2 of v2_opts) vals.push(v1 * 10 + v2);
        return vals;
      }
      return [];
    }
    function checkEquation(handCards, op, targetCards) {
      let targetVals = [];
      const targetPerms = getPermutations(targetCards);
      for (let p of targetPerms) targetVals = targetVals.concat(getValues(p));

      const perms = getPermutations(handCards);
      for (let p of perms) {
        let splits = [];
        if (p.length === 2) splits.push({ A: [p[0]], B: [p[1]] });
        if (p.length === 3) { splits.push({ A: [p[0]], B: [p[1], p[2]] }); splits.push({ A: [p[0], p[1]], B: [p[2]] }); }
        if (p.length === 4) { splits.push({ A: [p[0], p[1]], B: [p[2], p[3]] }); }
        for (let split of splits) {
          let valsA = getValues(split.A), valsB = getValues(split.B);
          for (let a of valsA) {
            for (let b of valsB) {
              let res;
              if (op === '+') res = a + b;
              else if (op === '-') res = a - b;
              else if (op === '*') res = a * b;
              else if (op === '/') res = a / b;

              if (targetVals.includes(res)) {
                const opChar = op === '*' ? '×' : (op === '/' ? '÷' : op);
                return { success: true, eq: `${a} ${opChar} ${b} = ${res}`, cardsA: split.A, cardsB: split.B };
              }
            }
          }
        }
      } return { success: false };
    }

    // --- 核心邏輯工具 ---
    function getCombinations(arr, k) {
      const result = [];
      function helper(start, combo) {
        if (combo.length === k) { result.push([...combo]); return; }
        for (let i = start; i < arr.length; i++) helper(i + 1, [...combo, arr[i]]);
      }
      helper(0, []);
      return result;
    }

    function hasValidMove(hand, center) {
      if (hand.length < 2) return false;
      const ops = ['+', '-', '*', '/'];
      const handCombos = [];
      for (let i = 2; i <= Math.min(hand.length, 4); i++) {
        const combos = getCombinations(hand, i);
        for (let c of combos) handCombos.push(c);
      }
      const centerCombos = [];
      for (let i = 1; i <= Math.min(center.length, 2); i++) {
        const combos = getCombinations(center, i);
        for (let c of combos) centerCombos.push(c);
      }
      for (let h of handCombos) {
        for (let c of centerCombos) {
          for (let op of ops) {
            if (checkEquation(h, op, c).success) return true;
          }
        }
      }
      return false;
    }

     // --- UI 邏輯 ---
     function isAITurn() { return game.mode.startsWith('AI') && game.turn === game.aiSide; }

     function wait(ms) {
       return new Promise(resolve => setTimeout(resolve, ms));
     }

     async function animateSelectionChange(id, location) {
       const ids = location === 'hand' ? game.selections.hand : game.selections.center;
       const max = location === 'hand' ? 4 : 2;
       const idx = ids.indexOf(id);
       const adding = idx === -1;
       if (adding && ids.length >= max) return;

       game.uiBusy = true;
       render();
       let committed = false;
       try {
         await CardMotion.playExchange({
           moves: [{ id }],
           commit: () => {
             if (adding) ids.push(id);
             else ids.splice(idx, 1);
             committed = true;
             render();
           },
           options: { duration: 620, stagger: 0 }
         });
       } catch (error) {
         console.error('Card selection animation failed:', error);
         if (!committed) {
           if (adding) ids.push(id);
           else ids.splice(idx, 1);
         }
       } finally {
         game.uiBusy = false;
         render();
       }
     }

     function toggleSelect(id, location) {
       if (game.state === 'GAMEOVER' || game.state === 'ANIMATING' || game.uiBusy || isAITurn()) return;
       if (game.state === 'DISCARDING') {
         if (location !== 'center') return;
         const idx = game.discardSelections.indexOf(id);
         if (idx > -1) game.discardSelections.splice(idx, 1);
         else if (game.discardSelections.length < 2) game.discardSelections.push(id);
         render(); return;
       }
       if (location !== 'hand' && location !== 'center') return;
       animateSelectionChange(id, location);
     }

    document.querySelectorAll('.op-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
         if (game.state !== 'PLAYING' || game.uiBusy || isAITurn()) return;
        game.selections.operator = e.target.dataset.op;
        render();
      });
    });

     function escapeHtml(value) {
       return String(value).replace(/[&<>"']/g, (char) => ({
         '&': '&amp;',
         '<': '&lt;',
         '>': '&gt;',
         '"': '&quot;',
         "'": '&#39;'
       }[char]));
     }

     function cardValues(cards) {
       return cards.map(c => c.val).join(LANG === 'zh' ? '、' : ', ');
     }

     function getDiscardExitPoint(rect) {
       const centerArea = document.getElementById('center-area');
       const areaRect = centerArea ? centerArea.getBoundingClientRect() : null;
       return {
         left: Math.max((areaRect ? areaRect.right : rect.right) + 90, rect.left + 140),
         top: areaRect ? areaRect.top + areaRect.height / 2 : rect.top - 20
       };
     }

     function applyMoveState(hCards, cCards, op, eqResult) {
       const selectedHandIds = new Set(hCards.map(c => c.id));
       const selectedCenterIds = new Set(cCards.map(c => c.id));
       const aiInfo = game.aiMoveInfo;

       if (game.turn === 'BLACK') game.blackHand = game.blackHand.filter(c => !selectedHandIds.has(c.id)).concat(cCards);
       else game.whiteHand = game.whiteHand.filter(c => !selectedHandIds.has(c.id)).concat(cCards);
       game.center = game.center.filter(c => !selectedCenterIds.has(c.id)).concat(hCards);

       game.lastMove = {
         handCards: hCards.map(c => ({ ...c })),
         centerCards: cCards.map(c => ({ ...c })),
         op,
         turn: game.turn,
         eq: aiInfo?.eq || eqResult.eq,
         cardsA: aiInfo?.cardsA || eqResult.cardsA,
         cardsB: aiInfo?.cardsB || eqResult.cardsB
       };

       game.selections = { hand: [], center: [], operator: null };
       game.discardSelections = aiInfo?.discard?.length === 2 ? [...aiInfo.discard] : [];
       game.aiMoveInfo = null;
     }

     async function playDiscardMove() {
       if (game.state !== 'DISCARDING' || game.discardSelections.length !== 2) return;

       const keepIds = new Set(game.discardSelections);
       const keepCards = game.center.filter(c => keepIds.has(c.id));
       const discardedCards = game.center.filter(c => !keepIds.has(c.id));
       const actor = isAITurn() ? 'AI' : 'PLAYER';
       game.state = 'ANIMATING';
       game.uiBusy = true;
       game.movePreview = {
         actor,
         phase: 'discard',
         eq: actor === 'AI' ? game.lastMove?.eq : null,
         handCards: [],
         centerCards: discardedCards.map(c => ({ ...c }))
       };
       render();
       if (!CardMotion.prefersReducedMotion(document)) await wait(520);

       let committed = false;
       try {
         await CardMotion.playRemoval({
           ids: discardedCards.map(c => c.id),
           commit: () => {
             game.center = keepCards;
             game.discardSelections = [];
             committed = true;
             render();
           },
           getExitPoint: getDiscardExitPoint,
            options: { duration: 620, stagger: 100 }
         });
       } catch (error) {
         console.error('Card discard animation failed:', error);
         if (!committed) {
           game.center = keepCards;
           game.discardSelections = [];
         }
       }

        game.movePreview = null;
        game.uiBusy = false;
        endTurn();
      }

     async function playCardMove(hCards, cCards, op, eqResult) {
        const actor = isAITurn() ? 'AI' : 'PLAYER';
        const aiInfo = game.aiMoveInfo;
        game.state = 'ANIMATING';
        game.uiBusy = true;
        game.movePreview = {
         actor,
         phase: 'move',
         eq: aiInfo?.eq || eqResult.eq,
         handCards: hCards.map(c => ({ ...c })),
         centerCards: cCards.map(c => ({ ...c }))
        };
        render();
        if (!CardMotion.prefersReducedMotion(document)) await wait(520);

       let committed = false;
       try {
         await CardMotion.playExchange({
           moves: [
             ...hCards.map(c => ({ id: c.id, destination: 'center' })),
             ...cCards.map(c => ({ id: c.id, destination: 'hand' }))
           ],
           commit: () => {
             applyMoveState(hCards, cCards, op, eqResult);
             committed = true;
             render();
           },
           options: { duration: 720, stagger: 95 }
         });
       } catch (error) {
         console.error('Card exchange animation failed:', error);
          if (!committed) {
            applyMoveState(hCards, cCards, op, eqResult);
            committed = true;
            render();
          }
       }

       game.movePreview = null;
       if (game.center.length > 2) {
         game.uiBusy = false;
         game.state = 'DISCARDING';
         render();
         if (isAITurn() && game.discardSelections.length === 2) await playDiscardMove();
       } else {
         game.uiBusy = false;
         endTurn();
       }
     }

     function handleMainAction() {
       if (game.state === 'ANIMATING') return;
       if (game.state === 'DISCARDING') {
         if (game.discardSelections.length !== 2) return alert(t('discard_err'));
         playDiscardMove();
         return;
       }
       if (game.state === 'GAMEOVER') { resetGame(false); return; }

       const activeHand = game.turn === 'BLACK' ? game.blackHand : game.whiteHand;
       const hCards = activeHand.filter(c => game.selections.hand.includes(c.id));
       const cCards = game.center.filter(c => game.selections.center.includes(c.id));
       const op = game.selections.operator;

       if (hCards.length < 2 || hCards.length > 4) return alert(t('select_hand_err'));
       if (cCards.length < 1 || cCards.length > 2) return alert(t('select_target_err'));
       if (!op) return alert(t('select_op_err'));

       const eqResult = checkEquation(hCards, op, cCards);
       if (!eqResult.success) return alert(t('eq_error'));
       playCardMove(hCards, cCards, op, eqResult);
     }

    function endTurn() {
      game.uiBusy = false;
      const turnJustEnded = game.turn;
      if (isRace2Mode()) {
        const ended = MathDuelRuleModes.applyColorMatchPoint(game, turnJustEnded);
        if (!ended) {
          game.turn = game.turn === 'BLACK' ? 'WHITE' : 'BLACK';
          game.state = 'PLAYING';
        }
      } else {
        const activeHand = game.turn === 'BLACK' ? game.blackHand : game.whiteHand;
        const targetColor = game.turn === 'BLACK' ? 'w' : 'b';
        if (activeHand.length > 0 && activeHand.every(c => c.color === targetColor)) {
          game.winner = game.turn; game.state = 'GAMEOVER';
        } else {
          game.turn = game.turn === 'BLACK' ? 'WHITE' : 'BLACK';
          game.state = 'PLAYING';
        }
      }
      saveState(); render();
      checkAITurn();
    }

    function checkAITurn() {
      if (game.state !== 'PLAYING') return;

      // 檢查當前行動方是否還有路走 (死局判定)
      const currentHand = game.turn === 'BLACK' ? game.blackHand : game.whiteHand;
      if (!hasValidMove(currentHand, game.center)) {
        if (isRace2Mode()) {
          const ended = MathDuelRuleModes.applyPassPoint(game);
          if (!ended) game.turn = game.turn === 'BLACK' ? 'WHITE' : 'BLACK';
          saveState(); render();
          setTimeout(() => checkAITurn(), 200);
          return;
        }
        setTimeout(() => {
          const winner = game.turn === 'BLACK' ? 'WHITE' : 'BLACK';
          const msg = game.turn === 'BLACK' ? (LANG === 'zh' ? '你已無路可走！' : 'No moves left!') : (LANG === 'zh' ? 'AI 已無路可走！' : 'AI has no moves left!');
          alert(msg);
          game.winner = winner;
          game.state = 'GAMEOVER';
          saveState(); render();
        }, 300);
        return;
      }

      if (isAITurn()) {
        const difficulty = game.mode === 'AI_HARD' ? 'hard' : 'easy';
        document.getElementById('status-banner').innerHTML = `<span class="ai-thinking">🧠 ${difficulty === 'hard' ? t('ai_thinking_hard') : t('ai_thinking_easy')}</span>`;

        // 核心修正：明確告知 AI 誰才是它的手牌
        const aiHand = game.turn === 'BLACK' ? game.blackHand : game.whiteHand;
        const oppHand = game.turn === 'BLACK' ? game.whiteHand : game.blackHand;

        if (aiTimeoutToken) clearTimeout(aiTimeoutToken);
        aiTimeoutToken = setTimeout(() => {
          if (!isAITurn() || game.state !== 'PLAYING') return;
          if (isRace2Mode()) {
            const ended = MathDuelRuleModes.applyPassPoint(game);
            if (!ended) game.turn = game.turn === 'BLACK' ? 'WHITE' : 'BLACK';
            saveState(); render(); checkAITurn();
            return;
          }
          giveUp();
        }, 5500);

        worker.postMessage({
          difficulty,
          aiSide: game.aiSide,
          aiColor: game.aiColor,
          playerColor: game.playerColor,
          aiHand,
          opponentHand: oppHand,
          centerCards: game.center,
          ruleMode: game.ruleMode,
          scores: game.scores || { BLACK: 0, WHITE: 0 },
          winScore: game.winScore || 2
        });
      }
    }

    worker.onmessage = function (e) {
      if (aiTimeoutToken) { clearTimeout(aiTimeoutToken); aiTimeoutToken = null; }
      if (!isAITurn() || game.state !== 'PLAYING') return;
      const move = e.data;
      if (!move) {
        setTimeout(() => {
          if (isRace2Mode() && isAITurn() && game.state === 'PLAYING') {
            const ended = MathDuelRuleModes.applyPassPoint(game);
            if (!ended) game.turn = game.turn === 'BLACK' ? 'WHITE' : 'BLACK';
            saveState(); render(); checkAITurn();
            return;
          }
          giveUp();
        }, 1500);
        return;
      }
      setTimeout(() => revealAiMove(move), 350);
    };

    async function revealAiMove(move) {
      if (!isAITurn() || game.state !== 'PLAYING') return;

      const aiInfo = move.eq ? {
        eq: move.eq,
        cardsA: move.cardsA,
        cardsB: move.cardsB,
        discard: move.discard || []
      } : null;
      const moves = [
        ...move.hand.map(id => ({ id, destination: 'stage-hand' })),
        ...move.center.map(id => ({ id, destination: 'stage-center' }))
      ];

      game.uiBusy = true;
      render();
      let committed = false;
      const commitPlan = () => {
        game.selections.hand = [...move.hand];
        game.selections.center = [...move.center];
        game.selections.operator = move.op;
        game.aiMoveInfo = aiInfo;
        committed = true;
        render();
      };

      try {
        await CardMotion.playExchange({
          moves,
          commit: commitPlan,
          options: { duration: 720, stagger: 95 }
        });
      } catch (error) {
        console.error('AI card reveal animation failed:', error);
        if (!committed) commitPlan();
      }

      game.uiBusy = false;
      render();
      if (!CardMotion.prefersReducedMotion(document)) await wait(1100);
      handleMainAction();
    }

    worker.onerror = function () {
      if (aiTimeoutToken) { clearTimeout(aiTimeoutToken); aiTimeoutToken = null; }
      if (isAITurn() && game.state === 'PLAYING') {
        setTimeout(() => {
          if (isRace2Mode()) {
            const ended = MathDuelRuleModes.applyPassPoint(game);
            if (!ended) game.turn = game.turn === 'BLACK' ? 'WHITE' : 'BLACK';
            saveState(); render(); checkAITurn();
          } else {
            giveUp();
          }
        }, 600);
      }
    };

    function giveUp() {
      if (game.turn === 'BLACK' || game.mode === 'PVP') if (!confirm(t('giveup_confirm'))) return;
      game.winner = game.turn === 'BLACK' ? 'WHITE' : 'BLACK';
      game.state = 'GAMEOVER'; saveState(); render();
    }

     function generateCardHTML(card, location, isNew = false) {
       const isBlack = card.color === 'b';
       const isStage = location === 'stage-hand' || location === 'stage-center';
       const selectionLocation = location === 'stage-center' || location === 'center' ? 'center' : 'hand';
       const isStageSelectable = isStage && game.state === 'PLAYING' && !game.uiBusy && !isAITurn();
       const isSelectable = (game.state === 'PLAYING' && !game.uiBusy && (location === 'center' || (game.turn === 'BLACK' && location === 'black') || (game.turn === 'WHITE' && location === 'white'))) ||
         (game.state === 'DISCARDING' && !game.uiBusy && location === 'center') || isStageSelectable;
       const isSelected = isStage || (game.state === 'PLAYING' ? (game.selections.hand.includes(card.id) || game.selections.center.includes(card.id)) :
         (game.state === 'DISCARDING' ? game.discardSelections.includes(card.id) : false));

       const baseClasses = `w-12 h-16 flex items-center justify-center text-2xl font-bold font-mono rounded-lg border-2 shadow-sm transition-all select-none ${isNew ? 'card-pop' : ''}`;
       const colorClasses = isBlack ? "bg-slate-800 text-white border-slate-900" : "bg-white text-slate-800 border-slate-300";
       let interactiveClasses = "opacity-60";

       if (isStage) interactiveClasses = isSelectable ? "ring-2 ring-blue-400 opacity-100 cursor-pointer hover:-translate-y-1" : "ring-2 ring-blue-200 opacity-100";
       else if (isAITurn() && location !== 'center' && !isSelected) interactiveClasses = "opacity-40";
       else if (isSelectable) interactiveClasses = isSelected ? "ring-4 ring-blue-500 scale-105 opacity-100 cursor-pointer" : "cursor-pointer hover:-translate-y-1 opacity-100";
       else if (isSelected) interactiveClasses = "opacity-100 ring-2 ring-slate-400";

       return `<div data-card-id="${escapeHtml(card.id)}" class="${baseClasses} ${colorClasses} ${interactiveClasses}" onclick="${isSelectable ? `toggleSelect('${card.id}', '${selectionLocation}')` : ''}">${card.val}</div>`;
     }

     function renderStage() {
       const activeHand = game.turn === 'BLACK' ? game.blackHand : game.whiteHand;
       const selectedHand = activeHand.filter(c => game.selections.hand.includes(c.id));
       const selectedCenter = game.center.filter(c => game.selections.center.includes(c.id));
       const handArea = document.getElementById('stage-hand-cards');
       const centerArea = document.getElementById('stage-center-cards');
       const handSlot = document.getElementById('stage-hand-slot');
       const centerSlot = document.getElementById('stage-center-slot');
       const playArea = document.getElementById('play-area');
       if (!handArea || !centerArea || !handSlot || !centerSlot || !playArea) return;

       const handHTML = selectedHand.map(c => generateCardHTML(c, 'stage-hand')).join('');
       const centerHTML = selectedCenter.map(c => generateCardHTML(c, 'stage-center')).join('');
       handArea.innerHTML = handHTML || `<span class="play-stage-empty">${escapeHtml(t('play_hand_hint'))}</span>`;
       centerArea.innerHTML = centerHTML || `<span class="play-stage-empty">${escapeHtml(t('play_target_hint'))}</span>`;
       document.getElementById('play-zone-title').innerText = t('play_zone');
       document.getElementById('play-route-hint').innerText = t('move_route');
       document.getElementById('stage-hand-label').innerText = t('play_hand');
       document.getElementById('stage-center-label').innerText = t('play_target');
       document.getElementById('stage-operator-symbol').innerText = game.selections.operator ? (game.selections.operator === '*' ? '×' : game.selections.operator === '/' ? '÷' : game.selections.operator) : '?';
       document.getElementById('play-zone-status').innerText = game.state === 'ANIMATING' ? t('move_resolving') : t('play_confirm_hint');
       handSlot.classList.toggle('is-active', selectedHand.length > 0);
       centerSlot.classList.toggle('is-active', selectedCenter.length > 0);
       playArea.classList.toggle('is-working', selectedHand.length > 0 || selectedCenter.length > 0 || Boolean(game.movePreview) || Boolean(game.aiMoveInfo));
     }

     function renderMovePreview() {
       const area = document.getElementById('move-preview');
       if (!area) return;

       const preview = game.movePreview;
       const aiPlan = game.aiMoveInfo;
       let eq = preview?.eq || aiPlan?.eq || null;
       let handCards = preview?.handCards || [];
       let centerCards = preview?.centerCards || [];
       let mode = preview ? 'resolving' : (aiPlan ? 'ai-plan' : 'selection');

       if (!preview && aiPlan) {
         const activeHand = game.turn === 'BLACK' ? game.blackHand : game.whiteHand;
         handCards = activeHand.filter(c => game.selections.hand.includes(c.id));
         centerCards = game.center.filter(c => game.selections.center.includes(c.id));
       }

       if (!preview && !aiPlan && game.state === 'PLAYING') {
         const activeHand = game.turn === 'BLACK' ? game.blackHand : game.whiteHand;
         handCards = activeHand.filter(c => game.selections.hand.includes(c.id));
         centerCards = game.center.filter(c => game.selections.center.includes(c.id));
         if (game.selections.operator && handCards.length >= 2 && centerCards.length >= 1) {
           const result = checkEquation(handCards, game.selections.operator, centerCards);
           if (result.success) eq = result.eq;
         }
       }

       const hasSelection = handCards.length > 0 || centerCards.length > 0;
       if (!eq && mode !== 'resolving' && !hasSelection) {
         area.className = 'hidden';
         area.innerHTML = '';
         return;
       }

       const handText = cardValues(handCards);
       const centerText = cardValues(centerCards);
       let detail;
       if (mode === 'resolving' && preview?.phase === 'discard') {
         detail = LANG === 'zh'
           ? `移出 ${centerText || '多餘牌'}`
           : `Remove ${centerText || 'extra cards'}`;
       } else if (mode === 'selection') {
         detail = LANG === 'zh' ? '確認後，牌會依照箭頭方向交換' : 'Confirm to exchange cards along the shown route';
       } else {
         detail = LANG === 'zh'
           ? `出牌 ${handText}，回收 ${centerText}`
           : `Play ${handText}, take back ${centerText}`;
       }

       const label = mode === 'ai-plan'
         ? t('ai_plan')
         : mode === 'resolving'
           ? (preview?.phase === 'discard' ? t('discard_resolving') : t('move_resolving'))
           : (LANG === 'zh' ? '算式預覽' : 'Equation preview');
       const tone = mode === 'resolving' ? 'border-violet-200 bg-violet-50' : 'border-blue-200 bg-blue-50';
       area.className = `block ${tone} p-3 rounded-xl border shadow-sm text-center`;
       area.innerHTML = `
         <div class="text-[10px] uppercase tracking-wider font-black text-slate-500">${escapeHtml(label)}</div>
         ${eq ? `<div class="text-xl font-black text-slate-800 mt-1">${escapeHtml(eq)}</div>` : ''}
         <div class="text-xs text-slate-500 mt-1">${escapeHtml(detail)}</div>
         ${mode !== 'resolving' ? `<div class="text-[10px] text-slate-400 mt-1">${escapeHtml(t('move_route'))}</div>` : ''}
       `;
     }

     let lastRenderState = { white: '', black: '', center: '', title: '', lang: '' };

    function render() {
      // 1. 靜態 UI 更新 (僅在必要時)
      const titleStr = t('title');
      if (lastRenderState.title !== titleStr || lastRenderState.lang !== LANG) {
        document.title = titleStr; // 更新瀏覽器分頁標題
        document.getElementById('ui-title').innerText = titleStr;
        document.getElementById('ui-lang-indicator').innerText = LANG === 'zh' ? 'EN' : '中';
        document.querySelector('#mode-select option[value="PVP"]').innerText = t('mode_pvp');
        document.querySelector('#mode-select option[value="AI_EASY"]').innerText = t('mode_ai_easy');
        document.querySelector('#mode-select option[value="AI_HARD"]').innerText = t('mode_ai_hard');
        document.querySelector('#rule-mode-select option[value="CLASSIC"]').innerText = LANG === 'zh' ? '基本模式' : 'Classic';
        document.querySelector('#rule-mode-select option[value="RACE2"]').innerText = LANG === 'zh' ? '搶 2 分' : 'Race to 2';
        document.getElementById('ui-center-label').innerText = t('center_target');
         if (typeof lucide !== 'undefined') lucide.createIcons();
        lastRenderState.title = titleStr;
        lastRenderState.lang = LANG;
      }

      // 2. 卡牌區域智慧更新
      const selectedHandIds = new Set(game.selections.hand);
      const selectedCenterIds = new Set(game.selections.center);
      const whiteHTML = game.whiteHand.filter(c => !selectedHandIds.has(c.id)).map(c => generateCardHTML(c, 'white')).join('');
      const blackHTML = game.blackHand.filter(c => !selectedHandIds.has(c.id)).map(c => generateCardHTML(c, 'black')).join('');
      // 場中央也同步使用智慧更新，消除閃爍
      const centerHTML = game.center.filter(c => !selectedCenterIds.has(c.id)).map(c => generateCardHTML(c, 'center', false)).join('');

      if (lastRenderState.white !== whiteHTML) {
        document.getElementById('white-hand').innerHTML = whiteHTML;
        lastRenderState.white = whiteHTML;
      }
      if (lastRenderState.black !== blackHTML) {
        document.getElementById('black-hand').innerHTML = blackHTML;
        lastRenderState.black = blackHTML;
      }
      if (lastRenderState.center !== centerHTML) {
        document.getElementById('center-cards').innerHTML = centerHTML;
        lastRenderState.center = centerHTML;
      }
      renderStage();

      // 3. 標籤與 Banner 更新 (僅在文字改變時)
      const whiteLabel = game.mode.startsWith('AI') ? (game.aiSide === 'WHITE' ? t('white_hand_ai') : t('white_hand')) : t('white_hand');
      const blackLabel = game.mode.startsWith('AI') ? (game.aiSide === 'BLACK' ? (LANG === 'zh' ? '黑方手牌 (AI)' : 'Black Hand (AI)') : t('black_hand_you')) : t('black_hand');

      if (document.getElementById('white-label').innerText !== whiteLabel) document.getElementById('white-label').innerText = whiteLabel;
      if (document.getElementById('black-label').innerText !== blackLabel) document.getElementById('black-label').innerText = blackLabel;
      document.getElementById('rule-mode-select').value = game.ruleMode;

      document.getElementById('white-area').className = `bg-white rounded-2xl p-4 border-2 shadow-sm transition-colors ${game.turn === 'WHITE' && game.state !== 'GAMEOVER' ? 'border-blue-500 bg-blue-50' : 'border-transparent'}`;
      document.getElementById('black-area').className = `bg-white rounded-2xl p-4 border-2 shadow-sm transition-colors mb-4 ${game.turn === 'BLACK' && game.state !== 'GAMEOVER' ? 'border-blue-500 bg-blue-50' : 'border-transparent'}`;

      document.querySelectorAll('.op-btn').forEach(btn => {
        const isSel = game.selections.operator === btn.dataset.op;
        const isDisabled = game.state !== 'PLAYING' || isAITurn() || game.uiBusy;

        // 基礎樣式
        let classes = `op-btn w-12 h-12 rounded-lg border text-xl font-bold transition-all duration-200 flex items-center justify-center `;

        // 選中狀態顏色
        if (isSel) {
          classes += `bg-blue-600 text-white border-blue-700 shadow-lg scale-110 z-10 `;
        } else {
          classes += `bg-slate-100 text-slate-700 border-slate-200 `;
        }

        // 鎖定/啟用狀態與透明度處理
        if (isDisabled) {
          // 如果選中了，保持較高透明度 (0.9)；未選中才變淡 (0.3)
          classes += (isSel ? "opacity-90 " : "opacity-30 ") + "cursor-not-allowed ";
        } else {
          classes += "cursor-pointer active:scale-95 ";
          // 僅在未選中時套用 hover 效果
          if (!isSel) classes += "hover:bg-slate-200 hover:border-slate-300 ";
        }

        btn.className = classes;
      });

      const sb = document.getElementById('status-banner'), mb = document.getElementById('main-btn'), gb = document.getElementById('giveup-btn'), og = document.getElementById('operator-group');
       if (game.state === 'GAMEOVER') {
         let winnerName;
        if (game.mode.startsWith('AI')) {
          if (game.winner === game.aiSide) winnerName = '🤖 AI';
          else winnerName = (LANG === 'zh' ? '🎉 你' : '🎉 You');
        } else {
          winnerName = game.winner === 'BLACK' ? (LANG === 'zh' ? '黑方' : 'Black') : (LANG === 'zh' ? '白方' : 'White');
        }
        sb.className = "bg-amber-100 text-amber-800 p-3 rounded-xl text-center font-bold shadow-sm border border-amber-200";
        sb.innerHTML = t('game_over') + winnerName + t('win_suffix');
         mb.innerText = t('play_again'); mb.className = "w-full bg-slate-800 text-white py-3 rounded-xl font-bold shadow-md active:scale-[0.98]";
         gb.classList.add('hidden'); og.classList.add('hidden');
       } else if (game.state === 'ANIMATING') {
         const actorLabel = game.movePreview?.actor === 'AI' ? '🤖 AI' : (LANG === 'zh' ? '⌛ 你' : '⌛ You');
         sb.className = "bg-violet-100 text-violet-800 p-3 rounded-xl text-center font-bold shadow-sm border border-violet-200";
         sb.innerHTML = `${actorLabel} ${t('move_resolving')}`;
         mb.className = "hidden";
         gb.classList.add('hidden'); og.classList.add('hidden');
       } else if (game.state === 'DISCARDING') {
        sb.className = "bg-rose-100 text-rose-800 p-3 rounded-xl text-center font-bold shadow-sm border border-rose-200";
        sb.innerHTML = isAITurn() ? t('ai_discarding') : t('discard_hint');
        mb.innerText = `${t('confirm_keep')} (${game.discardSelections.length}/2)`;
        mb.className = `w-full py-3 rounded-xl font-bold shadow-md ${game.discardSelections.length === 2 ? 'bg-rose-600 text-white active:scale-[0.98]' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`;
        if (isAITurn()) mb.className += " hidden";
        gb.classList.add('hidden'); og.classList.add('hidden');
      } else {
        let pName;
        if (game.mode.startsWith('AI')) {
          pName = game.turn === game.aiSide ? (game.mode === 'AI_HARD' ? t('mode_ai_hard') : t('mode_ai_easy')) : (LANG === 'zh' ? '你' : 'You');
        } else {
          pName = game.turn === 'BLACK' ? (LANG === 'zh' ? '黑方' : 'Black') : (LANG === 'zh' ? '白方' : 'White');
        }
        sb.className = "bg-blue-100 text-blue-800 p-3 rounded-xl text-center font-bold shadow-sm border border-blue-200";
         if (isAITurn() && game.aiMoveInfo) {
           sb.innerHTML = `🤖 ${t('ai_plan')}`;
         } else if (!isAITurn() || !sb.innerHTML.includes(t('ai_thinking_easy').slice(0, 4))) {
           sb.innerHTML = `${t('turn_label')}<span class="text-xl mx-1">${pName}</span>`;
         }
        mb.innerText = isAITurn() ? t('ai_thinking_btn') : t('send_eq');
        mb.className = `w-full py-3 rounded-xl font-bold shadow-md ${(isAITurn() || game.uiBusy) ? 'bg-slate-300 text-slate-500 cursor-not-allowed hidden' : 'bg-blue-600 text-white active:scale-[0.98]'}`;
        if (isAITurn() || game.uiBusy) gb.classList.add('hidden'); else gb.classList.remove('hidden');
        if (isAITurn() || game.uiBusy) og.classList.add('opacity-60'); else og.classList.remove('opacity-60');
        og.classList.remove('hidden');
        gb.innerText = t('give_up');
      }
      // 渲染歷史紀錄
      const scoreboard = document.getElementById('race2-scoreboard');
      const passBtn = document.getElementById('pass-btn');
      if (isRace2Mode()) {
        scoreboard.classList.remove('hidden');
        scoreboard.innerText = LANG === 'zh'
          ? `搶 2 分 | 黑方 ${game.scores.BLACK} : ${game.scores.WHITE} 白方`
          : `Race to 2 | Black ${game.scores.BLACK} : ${game.scores.WHITE} White`;
        const canPass = game.state === 'PLAYING' && !isAITurn();
        const opponent = game.turn === 'BLACK' ? 'WHITE' : 'BLACK';
        const opponentScore = game.scores[opponent];
        const passWouldLose = opponentScore >= (game.winScore - 1);
        passBtn.classList.add('hidden');
        if (game.state === 'PLAYING') {
          gb.onclick = passTurn;
          gb.innerText = passWouldLose
            ? (LANG === 'zh' ? '無法湊出（對手直接獲勝）' : 'No Move (Opponent wins)')
            : (LANG === 'zh' ? '無法湊出（對手得 1 分）' : 'No Move (Opponent +1)');
          gb.className = `w-full mt-1 py-2 rounded-xl font-semibold border ${canPass
            ? (passWouldLose ? 'bg-rose-50 text-rose-700 border-rose-200' : 'bg-amber-50 text-amber-700 border-amber-200')
            : 'bg-slate-200 text-slate-500 border-slate-300 cursor-not-allowed'}`;
        } else {
          gb.classList.add('hidden');
        }
      } else {
        scoreboard.classList.add('hidden');
        passBtn.classList.add('hidden');
        gb.onclick = giveUp;
      }
       renderMovePreview();
       renderHistory();
    }

    function renderHistory() {
      const area = document.getElementById('history-area');
      if (!game.lastMove) {
        area.innerHTML = `<div class="text-[10px] text-slate-300 font-bold uppercase tracking-wider">${t('waiting_first')}</div>`;
        return;
      }

      const { cardsA, cardsB, centerCards, op, turn } = game.lastMove;

      const cardToHtml = (c) => {
        const isBlack = c.color === 'b';
        const base = "w-6 h-8 flex items-center justify-center text-xs font-bold font-mono rounded border shadow-sm";
        const colors = isBlack ? "bg-slate-800 text-white border-slate-900" : "bg-white text-slate-800 border-slate-300";
        return `<div class="${base} ${colors}">${c.val}</div>`;
      };

      const turnLabel = turn === 'BLACK' ? (LANG === 'zh' ? '黑方' : 'Black') : (LANG === 'zh' ? '白方' : 'White');
      const turnColor = turn === 'BLACK' ? 'text-slate-500' : 'text-blue-400';
      const opChar = op === '*' ? '×' : (op === '/' ? '÷' : op);

      area.innerHTML = `
        <div class="flex items-center gap-1.5 opacity-40 scale-90 transition-opacity hover:opacity-100">
          <span class="text-[9px] font-black ${turnColor} mr-0.5 whitespace-nowrap">${turnLabel}</span>
          <div class="flex gap-0.5">${cardsA.map(cardToHtml).join('')}</div>
          <span class="text-xs font-bold text-slate-400">${opChar}</span>
          <div class="flex gap-0.5">${cardsB.map(cardToHtml).join('')}</div>
          <span class="text-xs font-bold text-slate-400">=</span>
          <div class="flex gap-0.5">${centerCards.map(cardToHtml).join('')}</div>
        </div>
      `;
    }

    function toggleRules(show) {
      const modal = document.getElementById('rules-modal');
      const content = modal.querySelector('div');
      if (show) {
        document.getElementById('modal-rules-title').innerText = t('rules_title');
        document.getElementById('rule-1').innerText = t('rules_init');
        document.getElementById('rule-2').innerText = t('rules_action');
        document.getElementById('rule-3').innerText = t('rules_limit');
        document.getElementById('rule-4').innerText = t('rules_special');
        document.getElementById('rule-5').innerText = t('rules_win');
        document.getElementById('modal-close-btn').innerText = t('close');

        modal.classList.remove('hidden');
        setTimeout(() => {
          modal.classList.remove('opacity-0');
          content.classList.remove('scale-95');
        }, 10);
      } else {
        modal.classList.add('opacity-0');
        content.classList.add('scale-95');
        setTimeout(() => modal.classList.add('hidden'), 300);
      }
    }

    render(); checkAITurn();
  </script>
</body>

</html>

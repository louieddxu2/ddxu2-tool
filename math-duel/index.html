<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>黑白算術對決</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.300.0"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='8' fill='%231e293b'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#1e293b">
  <style>
    ::-webkit-scrollbar { width: 0; background: transparent; }
    body { -webkit-tap-highlight-color: transparent; }
    .card-enter { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .ai-thinking { animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans selection:bg-blue-200">

  <script>
    // 自動註冊邏輯
    (function autoRegister() {
      let appPath = window.location.pathname;
      if (appPath.endsWith('index.html')) appPath = appPath.replace('index.html', '');
      if (!appPath.endsWith('/')) appPath += '/';
      if (appPath === '/') return;
      try { localStorage.setItem('myAppLauncherLastPath', appPath); } catch {}
      const launcherPath = appPath.replace(/[^/]+\/$/, '') || '/';
      const homeHref = launcherPath.includes('?') ? `${launcherPath}&home=1` : `${launcherPath}?home=1`;
      window.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('[data-home-link]').forEach(el => { el.setAttribute('href', homeHref); el.classList.remove('invisible', 'pointer-events-none'); });
      });
      const appMeta = { id: 'math-duel', name: '黑白算術對決', nameZh: '黑白算術對決', nameEn: 'Math Duel', path: appPath, icon: 'swords', color: 'slate' };
      const storageKey = 'myAppLauncherStorage';
      const launcherData = JSON.parse(localStorage.getItem(storageKey) || '[]');
      const idx = launcherData.findIndex(a => a.path === appMeta.path);
      if (idx === -1) launcherData.push(appMeta); else launcherData[idx] = { ...launcherData[idx], ...appMeta };
      localStorage.setItem(storageKey, JSON.stringify(launcherData));
    })();
  </script>

  <header class="bg-slate-800 text-white p-4 shadow-md sticky top-0 z-20 flex flex-col gap-2">
    <div class="max-w-md mx-auto w-full flex items-center justify-between">
      <a href="/" data-home-link class="p-2 -ml-2 hover:bg-slate-700 rounded-full transition-colors invisible pointer-events-none">
        <i data-lucide="home" class="w-5 h-5"></i>
      </a>
      <h1 class="text-lg font-bold tracking-tight">黑白算術對決</h1>
      <button onclick="resetGame(true)" class="p-2 -mr-2 hover:bg-slate-700 rounded-full transition-colors"><i data-lucide="rotate-ccw" class="w-5 h-5"></i></button>
    </div>
    <div class="max-w-md mx-auto w-full flex justify-center">
      <select id="mode-select" onchange="changeMode(this.value)" class="bg-slate-700 text-sm text-white px-3 py-1.5 rounded-full border border-slate-600 outline-none focus:ring-2 focus:ring-blue-500 transition-shadow">
        <option value="PVP">🎮 雙人同機對戰</option>
        <option value="AI_EASY">🤖 單人打 AI (新手)</option>
        <option value="AI_HARD">💀 單人打 AI (大師)</option>
      </select>
    </div>
  </header>

  <main class="flex-grow w-full max-w-md mx-auto p-4 flex flex-col gap-4">
    <div id="status-banner" class="bg-blue-100 text-blue-800 p-3 rounded-xl text-center font-bold shadow-sm border border-blue-200">載入中...</div>
    <div id="history-area" class="flex flex-col items-center gap-1 py-1 overflow-hidden min-h-[3.5rem] transition-all"></div>

    <section id="white-area" class="bg-white rounded-2xl p-4 border-2 shadow-sm transition-colors">
      <div class="flex justify-between items-center mb-3"><h2 class="text-sm font-bold text-slate-500" id="white-label">白方手牌</h2></div>
      <div id="white-hand" class="flex flex-wrap gap-2 min-h-[4.5rem]"></div>
    </section>

    <section class="flex flex-col gap-3 relative">
      <div id="center-area" class="bg-slate-200 rounded-2xl p-4 border-2 border-slate-300 shadow-inner">
        <div class="text-center font-bold text-slate-600 mb-3 text-sm">場中央 (目標)</div>
        <div id="center-cards" class="flex justify-center flex-wrap gap-2 min-h-[4.5rem]"></div>
      </div>

      <div id="action-panel" class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-3">
        <div id="operator-group" class="flex justify-center gap-2">
          <button class="op-btn w-12 h-12 rounded-lg bg-slate-100 border text-xl font-bold" data-op="+">+</button>
          <button class="op-btn w-12 h-12 rounded-lg bg-slate-100 border text-xl font-bold" data-op="-">-</button>
          <button class="op-btn w-12 h-12 rounded-lg bg-slate-100 border text-xl font-bold" data-op="*">×</button>
          <button class="op-btn w-12 h-12 rounded-lg bg-slate-100 border text-xl font-bold" data-op="/">÷</button>
        </div>
        <button id="main-btn" onclick="handleMainAction()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold shadow-md">送出算式</button>
        <button id="giveup-btn" onclick="giveUp()" class="w-full mt-1 bg-rose-50 text-rose-600 py-2 rounded-xl font-semibold border">無法湊出 (對手獲勝)</button>
      </div>
    </section>

    <section id="black-area" class="bg-white rounded-2xl p-4 border-2 shadow-sm transition-colors mb-4">
      <div class="flex justify-between items-center mb-3"><h2 class="text-sm font-bold text-slate-500" id="black-label">黑方手牌 (你)</h2></div>
      <div id="black-hand" class="flex flex-wrap gap-2 min-h-[4.5rem]"></div>
    </section>
  </main>

  <script>
    // ==========================================
    // ⚙️ 系統版本控制
    // 每次你修改了 index.html 或 ai-worker.js 後，
    // 請將這個數字往上加（例如 '1.0.0' 改為 '1.0.1'）
    const APP_VERSION = '1.0.2';
    // ==========================================

    // --- 1. 載入外部 Worker 檔案 (加上版號破解快取) ---
    const worker = new Worker(`ai-worker.js?v=${APP_VERSION}`);

    // --- 2. 存檔 Key 也綁定版號 (徹底預防讀取到舊版卡死狀態) ---
    const SAVE_KEY = `mathDuelState_v${APP_VERSION}`;

    function createInitialState(mode = 'PVP') {
      return {
        mode: mode,
        turn: 'BLACK', state: 'PLAYING', winner: null,
        blackHand: Array.from({length: 9}, (_, i) => ({ id: `b${i+1}`, val: i+1, color: 'b' })),
        whiteHand: Array.from({length: 8}, (_, i) => ({ id: `w${i+1}`, val: i+1, color: 'w' })),
        center: [{ id: 'w9', val: 9, color: 'w' }],
        selections: { hand: [], center: [], operator: null },
        discardSelections: [],
        lastMove: null
      };
    }

    let game = loadState() || createInitialState('PVP');
    document.getElementById('mode-select').value = game.mode;
    
    // ... 後續的 saveState, loadState 與遊戲邏輯保持不變 ...


    function saveState() { localStorage.setItem(SAVE_KEY, JSON.stringify(game)); }
    function loadState() { try { const saved = localStorage.getItem(SAVE_KEY); return saved ? JSON.parse(saved) : null; } catch(e) { return null; } }

    function changeMode(newMode) {
      if(confirm(`確定要切換模式並重新開始嗎？`)) {
        game = createInitialState(newMode);
        saveState(); render();
      } else {
        document.getElementById('mode-select').value = game.mode;
      }
    }

    function resetGame(force = false) {
      if (force && !confirm('確定要重新開始遊戲嗎？')) return;
      game = createInitialState(game.mode);
      saveState(); render();
    }

    // --- 前端運算共用區 ---
    function getPermutations(arr) {
      if (arr.length <= 1) return [arr];
      let res = [];
      for (let i=0; i<arr.length; i++) {
        let cur = arr[i], rem = arr.slice(0,i).concat(arr.slice(i+1));
        for (let p of getPermutations(rem)) res.push([cur].concat(p));
      }
      return res;
    }
    function getValues(cards) {
      if (cards.length === 1) return (cards[0].val===6 || cards[0].val===9) ? [6,9] : [cards[0].val];
      if (cards.length === 2) {
        let v1_opts = (cards[0].val===6 || cards[0].val===9) ? [6,9] : [cards[0].val];
        let v2_opts = (cards[1].val===6 || cards[1].val===9) ? [6,9] : [cards[1].val];
        let vals = [];
        for (let v1 of v1_opts) for (let v2 of v2_opts) vals.push(v1*10+v2);
        return vals;
      }
      return [];
    }
    function checkEquation(handCards, op, targetCards) {
      let targets = [];
      const targetPerms = getPermutations(targetCards);
      for (let p of targetPerms) targets = targets.concat(getValues(p));

      const perms = getPermutations(handCards);
      for (let p of perms) {
        let splits = [];
        if (p.length === 2) splits.push({A: [p[0]], B: [p[1]]});
        if (p.length === 3) { splits.push({A: [p[0]], B: [p[1], p[2]]}); splits.push({A: [p[0], p[1]], B: [p[2]]}); }
        if (p.length === 4) { splits.push({A: [p[0], p[1]], B: [p[2], p[3]]}); }
        for (let split of splits) {
          let valsA = getValues(split.A), valsB = getValues(split.B);
          for (let a of valsA) {
            for (let b of valsB) {
              if (op==='+' && targets.includes(a+b)) return true;
              if (op==='-' && targets.includes(a-b)) return true;
              if (op==='*' && targets.includes(a*b)) return true;
              if (op==='/' && targets.includes(a/b)) return true;
            }
          }
        }
      } return false;
    }

    // --- UI 邏輯 ---
    function isAITurn() { return game.mode.startsWith('AI') && game.turn === 'WHITE'; }

    function toggleSelect(id, location) {
      if (game.state === 'GAMEOVER' || isAITurn()) return;
      if (game.state === 'DISCARDING') {
        if (location !== 'center') return;
        const idx = game.discardSelections.indexOf(id);
        if (idx > -1) game.discardSelections.splice(idx, 1);
        else if (game.discardSelections.length < 2) game.discardSelections.push(id);
        render(); return;
      }
      if (location === 'hand') {
        const idx = game.selections.hand.indexOf(id);
        if (idx > -1) game.selections.hand.splice(idx, 1);
        else if (game.selections.hand.length < 4) game.selections.hand.push(id);
      } else {
        const idx = game.selections.center.indexOf(id);
        if (idx > -1) game.selections.center.splice(idx, 1);
        else if (game.selections.center.length < 2) game.selections.center.push(id);
      } render();
    }

    document.querySelectorAll('.op-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        if (game.state !== 'PLAYING' || isAITurn()) return;
        game.selections.operator = e.target.dataset.op;
        render();
      });
    });

    function handleMainAction() {
      if (game.state === 'DISCARDING') {
        if (game.discardSelections.length !== 2) return alert('請選擇要保留的 2 張牌！');
        game.center = game.center.filter(c => game.discardSelections.includes(c.id));
        game.discardSelections = [];
        endTurn(); return;
      }
      if (game.state === 'GAMEOVER') { resetGame(false); return; }

      const activeHand = game.turn === 'BLACK' ? game.blackHand : game.whiteHand;
      const hCards = activeHand.filter(c => game.selections.hand.includes(c.id));
      const cCards = game.center.filter(c => game.selections.center.includes(c.id));
      const op = game.selections.operator;

      if (hCards.length < 2 || hCards.length > 4) return alert("請從手牌選擇 2~4 張牌");
      if (cCards.length < 1 || cCards.length > 2) return alert("請從場中選擇 1~2 張目標");
      if (!op) return alert("請選擇運算符號");

      if (checkEquation(hCards, op, cCards)) {
        if (game.turn === 'BLACK') game.blackHand = game.blackHand.filter(c => !game.selections.hand.includes(c.id)).concat(cCards);
        else game.whiteHand = game.whiteHand.filter(c => !game.selections.hand.includes(c.id)).concat(cCards);
        game.center = game.center.filter(c => !game.selections.center.includes(c.id)).concat(hCards);
        
        // 紀錄歷史紀錄
        game.lastMove = {
          handCards: hCards.map(c => ({...c})),
          centerCards: cCards.map(c => ({...c})),
          op: op,
          turn: game.turn
        };

        game.selections = { hand: [], center: [], operator: null };

        if (game.center.length > 2) {
          game.state = 'DISCARDING';
          if (isAITurn()) handleMainAction(); // AI 自動丟牌
          else render();
        } else endTurn();
      } else alert("無法湊出這個結果！確認一下數字或符號是否有誤？");
    }

    function endTurn() {
      const activeHand = game.turn === 'BLACK' ? game.blackHand : game.whiteHand;
      const targetColor = game.turn === 'BLACK' ? 'w' : 'b';
      if (activeHand.length > 0 && activeHand.every(c => c.color === targetColor)) {
        game.winner = game.turn; game.state = 'GAMEOVER';
      } else {
        game.turn = game.turn === 'BLACK' ? 'WHITE' : 'BLACK';
        game.state = 'PLAYING';
      }
      saveState(); render();

      if (isAITurn() && game.state === 'PLAYING') {
        const difficulty = game.mode === 'AI_HARD' ? 'hard' : 'easy';
        document.getElementById('status-banner').innerHTML = `<span class="ai-thinking">🧠 ${difficulty==='hard'?'大師級推演中 (深度 3)':'新手 AI 思考中...'}</span>`;
        // 把雙方手牌都傳給 AI，讓它能推演你的可能反擊
        worker.postMessage({ difficulty, whiteHand: game.whiteHand, blackHand: game.blackHand, centerCards: game.center });
      }
    }

    worker.onmessage = function(e) {
      const move = e.data;
      if (!move) { setTimeout(() => giveUp(), 1500); return; }
      setTimeout(() => {
        game.selections.hand = move.hand;
        game.selections.center = move.center;
        game.selections.operator = move.op;
        if (move.discard && move.discard.length === 2) game.discardSelections = move.discard;
        render(); setTimeout(() => handleMainAction(), 800);
      }, 500);
    };

    function giveUp() {
      if (game.turn === 'BLACK' || game.mode === 'PVP') if (!confirm(`確定無法湊出算式嗎？對手將直接獲勝！`)) return;
      game.winner = game.turn === 'BLACK' ? 'WHITE' : 'BLACK';
      game.state = 'GAMEOVER'; saveState(); render();
    }

    function generateCardHTML(card, location) {
      const isBlack = card.color === 'b';
      const isSelectable = (game.state === 'PLAYING' && (location === 'center' || (game.turn === 'BLACK' && location === 'black') || (game.turn === 'WHITE' && location === 'white'))) ||
                           (game.state === 'DISCARDING' && location === 'center');
      let isSelected = (game.state === 'PLAYING') ? (game.selections.hand.includes(card.id) || game.selections.center.includes(card.id)) :
                       (game.state === 'DISCARDING') ? game.discardSelections.includes(card.id) : false;

      const baseClasses = "w-12 h-16 flex items-center justify-center text-2xl font-bold font-mono rounded-lg border-2 shadow-sm transition-all select-none card-enter";
      const colorClasses = isBlack ? "bg-slate-800 text-white border-slate-900" : "bg-white text-slate-800 border-slate-300";
      let interactiveClasses = "opacity-60";
      
      if (isAITurn() && location !== 'center' && !isSelected) interactiveClasses = "opacity-40";
      else if (isSelectable) interactiveClasses = isSelected ? "ring-4 ring-blue-500 scale-105 opacity-100 cursor-pointer" : "cursor-pointer hover:-translate-y-1 opacity-100";
      else if (isSelected) interactiveClasses = "opacity-100 ring-2 ring-slate-400";

      return `<div class="${baseClasses} ${colorClasses} ${interactiveClasses}" onclick="${isSelectable ? `toggleSelect('${card.id}', '${location==='center'?'center':'hand'}')` : ''}">${card.val}</div>`;
    }

    function render() {
      lucide.createIcons();
      document.getElementById('white-hand').innerHTML = game.whiteHand.map(c => generateCardHTML(c, 'white')).join('');
      document.getElementById('black-hand').innerHTML = game.blackHand.map(c => generateCardHTML(c, 'black')).join('');
      document.getElementById('center-cards').innerHTML = game.center.map(c => generateCardHTML(c, 'center')).join('');

      document.getElementById('white-label').innerText = game.mode.startsWith('AI') ? '白方手牌 (AI)' : '白方手牌';
      document.getElementById('black-label').innerText = game.mode === 'PVP' ? '黑方手牌' : '黑方手牌 (你)';

      document.getElementById('white-area').className = `bg-white rounded-2xl p-4 border-2 shadow-sm transition-colors ${game.turn === 'WHITE' && game.state !== 'GAMEOVER' ? 'border-blue-500 bg-blue-50' : 'border-transparent'}`;
      document.getElementById('black-area').className = `bg-white rounded-2xl p-4 border-2 shadow-sm transition-colors mb-4 ${game.turn === 'BLACK' && game.state !== 'GAMEOVER' ? 'border-blue-500 bg-blue-50' : 'border-transparent'}`;

      document.querySelectorAll('.op-btn').forEach(btn => {
        const isSel = game.selections.operator === btn.dataset.op;
        btn.className = `op-btn w-12 h-12 rounded-lg border text-xl font-bold transition-colors ${isSel ? 'bg-blue-600 text-white border-blue-700 shadow-md scale-105' : 'bg-slate-100 text-slate-700 border-slate-300'} ${game.state !== 'PLAYING' || (isAITurn() && !isSel) ? 'opacity-50 cursor-not-allowed' : 'hover:bg-slate-200'}`;
      });

      const sb = document.getElementById('status-banner'), mb = document.getElementById('main-btn'), gb = document.getElementById('giveup-btn'), og = document.getElementById('operator-group');
      if (game.state === 'GAMEOVER') {
        const winnerName = game.winner === 'BLACK' ? (game.mode.startsWith('AI')?'🎉 你':'黑方') : (game.mode.startsWith('AI')?'🤖 AI':'白方');
        sb.className = "bg-amber-100 text-amber-800 p-3 rounded-xl text-center font-bold shadow-sm border border-amber-200";
        sb.innerHTML = `遊戲結束！ ${winnerName} 獲得勝利！`;
        mb.innerText = "再玩一局"; mb.className = "w-full bg-slate-800 text-white py-3 rounded-xl font-bold shadow-md active:scale-[0.98]";
        gb.classList.add('hidden'); og.classList.add('hidden');
      } else if (game.state === 'DISCARDING') {
        sb.className = "bg-rose-100 text-rose-800 p-3 rounded-xl text-center font-bold shadow-sm border border-rose-200";
        sb.innerHTML = isAITurn() ? `AI 正在丟棄多餘卡牌...` : `⚠️ 場中央超過兩張，請選擇 2 張保留`;
        mb.innerText = `確認保留 (${game.discardSelections.length}/2)`;
        mb.className = `w-full py-3 rounded-xl font-bold shadow-md ${game.discardSelections.length === 2 ? 'bg-rose-600 text-white active:scale-[0.98]' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`;
        if(isAITurn()) mb.className += " hidden";
        gb.classList.add('hidden'); og.classList.add('hidden');
      } else {
        const pName = game.turn === 'BLACK' ? '黑方 (你)' : (game.mode==='AI_HARD'?'大師級 AI':(game.mode==='AI_EASY'?'新手 AI':'白方'));
        sb.className = "bg-blue-100 text-blue-800 p-3 rounded-xl text-center font-bold shadow-sm border border-blue-200";
        if(!isAITurn() || !sb.innerHTML.includes('推演中')) sb.innerHTML = `現在輪到：<span class="text-xl mx-1">${pName}</span>`;
        mb.innerText = isAITurn() ? "AI 決定中..." : "送出算式";
        mb.className = `w-full py-3 rounded-xl font-bold shadow-md ${isAITurn() ? 'bg-slate-300 text-slate-500 cursor-not-allowed hidden' : 'bg-blue-600 text-white active:scale-[0.98]'}`;
        if(isAITurn()) gb.classList.add('hidden'); else gb.classList.remove('hidden');
        og.classList.remove('hidden');
      }
      // 渲染歷史紀錄
      renderHistory();
    }

    function renderHistory() {
      const area = document.getElementById('history-area');
      if (!game.lastMove) {
        area.innerHTML = '<div class="text-[10px] text-slate-300 font-bold uppercase tracking-wider">等待第一手...</div>';
        return;
      }

      const { handCards, centerCards, op, turn } = game.lastMove;
      
      // 分組手牌 (A op B)
      let cardsA, cardsB;
      if (handCards.length === 2) { cardsA = [handCards[0]]; cardsB = [handCards[1]]; }
      else if (handCards.length === 3) { cardsA = [handCards[0]]; cardsB = [handCards[1], handCards[2]]; }
      else { cardsA = [handCards[0], handCards[1]]; cardsB = [handCards[2], handCards[3]]; }

      const cardToHtml = (c) => {
        const isBlack = c.color === 'b';
        const base = "w-6 h-8 flex items-center justify-center text-xs font-bold font-mono rounded border shadow-sm";
        const colors = isBlack ? "bg-slate-800 text-white border-slate-900" : "bg-white text-slate-800 border-slate-300";
        return `<div class="${base} ${colors}">${c.val}</div>`;
      };

      const opChar = op === '*' ? '×' : (op === '/' ? '÷' : op);
      const turnLabel = turn === 'BLACK' ? '黑方上回' : '白方上回';
      const turnColor = turn === 'BLACK' ? 'text-slate-500' : 'text-blue-400';

      area.innerHTML = `
        <div class="flex items-center gap-1.5 opacity-40 scale-90 transition-opacity hover:opacity-100">
          <span class="text-[9px] font-black ${turnColor} mr-1">${turnLabel}</span>
          <div class="flex gap-0.5">${cardsA.map(cardToHtml).join('')}</div>
          <span class="text-xs font-black text-slate-400">${opChar}</span>
          <div class="flex gap-0.5">${cardsB.map(cardToHtml).join('')}</div>
          <span class="text-xs font-black text-slate-400">=</span>
          <div class="flex gap-0.5">${centerCards.map(cardToHtml).join('')}</div>
        </div>
      `;
    }
    render(); if (isAITurn() && game.state === 'PLAYING') endTurn();
  </script>
</body>
</html>

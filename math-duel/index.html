<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans selection:bg-blue-200">

  <script>
    /* 自動註冊邏輯 */
    (function autoRegister() {
      let appPath = window.location.pathname;
      if (appPath.endsWith('index.html')) appPath = appPath.replace('index.html', '');
      if (!appPath.endsWith('/')) appPath += '/';
      if (appPath === '/') return;

      try {
        localStorage.setItem('myAppLauncherLastPath', appPath);
        localStorage.setItem('myAppLauncherLastSeenAt', String(Date.now()));
      } catch {}

      const launcherPath = appPath.replace(/[^/]+\/$/, '');
      const normalizedLauncherPath = launcherPath || '/';

      function configureHomeLinkAndProbe() {
        const homeLinks = Array.from(document.querySelectorAll('[data-home-link]'));
        const homeHref = normalizedLauncherPath.includes('?') ? `${normalizedLauncherPath}&home=1` : `${normalizedLauncherPath}?home=1`;
        homeLinks.forEach(el => el.setAttribute('href', homeHref));

        if (window.location.protocol === 'file:') return;

        const probeUrl = normalizedLauncherPath.endsWith('/') ? `${normalizedLauncherPath}index.html` : `${normalizedLauncherPath}/index.html`;
        const revealHome = () => { homeLinks.forEach(el => el.classList.remove('invisible', 'pointer-events-none')); };

        fetch(probeUrl, { method: 'HEAD' }).then(res => {
            if (res.ok) { revealHome(); return; }
            if (res.status === 405) { return fetch(probeUrl, { method: 'GET' }).then(r => { if (r.ok) revealHome(); }); }
          }).catch(() => {});
      }

      if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', configureHomeLinkAndProbe, { once: true }); }
      else { configureHomeLinkAndProbe(); }

      const appMeta = { id: 'math-duel', name: '黑白算術對決', nameZh: '黑白算術對決', nameEn: 'Math Duel', path: appPath, icon: 'swords', color: 'slate' };
      const storageKey = 'myAppLauncherStorage';
      const launcherData = JSON.parse(localStorage.getItem(storageKey) || '[]');
      const existingIndex = launcherData.findIndex(app => app.path === appMeta.path);
      if (existingIndex === -1) launcherData.push(appMeta);
      else launcherData[existingIndex] = { ...launcherData[existingIndex], ...appMeta };
      localStorage.setItem(storageKey, JSON.stringify(launcherData));
    })();
  </script>

  <script id="ai-worker-code" type="javascript/worker">
    // --- 數學核心 (Worker內複製一份以供背景運算) ---
    function getPermutations(arr) {
      if (arr.length <= 1) return [arr];
      let result = [];
      for (let i = 0; i < arr.length; i++) {
        let current = arr[i];
        let remaining = arr.slice(0, i).concat(arr.slice(i + 1));
        let remainingPerms = getPermutations(remaining);
        for (let perm of remainingPerms) result.push([current].concat(perm));
      }
      return result;
    }

    function getValues(cards) {
      if (cards.length === 1) {
        let v = cards[0].val;
        return (v === 6 || v === 9) ? [6, 9] : [v];
      } else if (cards.length === 2) {
        let v1_opts = (cards[0].val === 6 || cards[0].val === 9) ? [6, 9] : [cards[0].val];
        let v2_opts = (cards[1].val === 6 || cards[1].val === 9) ? [6, 9] : [cards[1].val];
        let vals = [];
        for (let v1 of v1_opts) for (let v2 of v2_opts) vals.push(v1 * 10 + v2);
        return vals;
      }
      return [];
    }

    function checkEquation(handCards, op, targetCards) {
      // 修正：必須將場中目標卡牌也進行全排列，才能支援如 9, 5 顛倒變成 59, 56 的情況
      let targets = [];
      const targetPerms = getPermutations(targetCards);
      for (let p of targetPerms) {
        targets = targets.concat(getValues(p));
      }

      const perms = getPermutations(handCards);
      for (let p of perms) {
        let splits = [];
        if (p.length === 2) splits.push({A: [p[0]], B: [p[1]]});
        if (p.length === 3) { 
          splits.push({A: [p[0]], B: [p[1], p[2]]}); 
          splits.push({A: [p[0], p[1]], B: [p[2]]}); 
        }
        if (p.length === 4) { 
          splits.push({A: [p[0], p[1]], B: [p[2], p[3]]}); 
        }
        for (let split of splits) {
          let valsA = getValues(split.A);
          let valsB = getValues(split.B);
          for (let a of valsA) {
            for (let b of valsB) {
              let res;
              if (op === '+') res = a + b;
              if (op === '-') res = a - b;
              if (op === '*') res = a * b;
              if (op === '/') res = a / b;
              if (targets.includes(res)) return true;
            }
          }
        }
      }
      return false;
    }


    function getCombinations(arr, size) {
      if (size === 0) return [[]];
      if (arr.length === 0) return [];
      const first = arr[0];
      const rest = arr.slice(1);
      const combosWithFirst = getCombinations(rest, size - 1).map(c => [first, ...c]);
      const combosWithoutFirst = getCombinations(rest, size);
      return combosWithFirst.concat(combosWithoutFirst);
    }

    // 質數判斷
    function isPrime(num) {
      if (num <= 1) return false;
      if (num <= 3) return true;
      if (num % 2 === 0 || num % 3 === 0) return false;
      for (let i = 5; i * i <= num; i += 6) {
        if (num % i === 0 || num % (i + 2) === 0) return false;
      }
      return true;
    }

    // 評估場中央數字難度
    function evaluateCenterDifficulty(cards) {
      const possibleVals = getValues(cards);
      let score = 0;
      for (let v of possibleVals) {
        if (isPrime(v)) {
          score += (v > 20) ? 50 : 30; // 大型質數極難
        } else {
          // 高度合成數好算
          let divisors = 0;
          for(let i=1; i<=Math.min(v, 20); i++) if(v % i === 0) divisors++;
          if (divisors > 4) score -= 20;
        }
      }
      return score / possibleVals.length; // 平均難度
    }

    self.onmessage = function(e) {
      const { aiHand, centerCards } = e.data;
      let bestMove = null;
      let bestScore = -Infinity;

      const ops = ['+', '-', '*', '/'];
      let handCombos = [];
      for(let i=2; i<=4; i++) handCombos = handCombos.concat(getCombinations(aiHand, i));
      
      let centerCombos = [];
      for(let i=1; i<=2; i++) centerCombos = centerCombos.concat(getCombinations(centerCards, i));

      // 暴力窮舉所有可能步數
      for (let hCombo of handCombos) {
        for (let cCombo of centerCombos) {
          for (let op of ops) {
            if (checkEquation(hCombo, op, cCombo)) {
              
              // 若合法，模擬盤面
              let newAiHand = aiHand.filter(c => !hCombo.includes(c)).concat(cCombo);
              let tempCenter = centerCards.filter(c => !cCombo.includes(c)).concat(hCombo);

              // 如果場中大於兩張，還要窮舉所有保留兩張的選項
              let keepCombos = tempCenter.length > 2 ? getCombinations(tempCenter, 2) : [tempCenter];

              for (let keep of keepCombos) {
                // --- 核心評估函數 (AI 是白方，想要滿手黑牌) ---
                let score = 0;
                
                // 1. 顏色純度 (手中黑牌越多越好，白牌越少越好)
                const blackCount = newAiHand.filter(c => c.color === 'b').length;
                const whiteCount = newAiHand.filter(c => c.color === 'w').length;
                score += (blackCount * 30) - (whiteCount * 40);

                // 勝利條件判斷
                if (whiteCount === 0 && blackCount > 0) score += 99999;
                
                // 2. 場中刁難度 (留難算的牌給對手)
                score += evaluateCenterDifficulty(keep);

                if (score > bestScore) {
                  bestScore = score;
                  bestMove = {
                    hand: hCombo.map(c => c.id),
                    center: cCombo.map(c => c.id),
                    op: op,
                    discard: tempCenter.length > 2 ? keep.map(c => c.id) : []
                  };
                }
              }
            }
          }
        }
      }

      // 回傳最佳解 (若 null 代表無解認輸)
      self.postMessage(bestMove);
    };
  </script>

  <script>
    lucide.createIcons();
    const SAVE_KEY = 'mathDuelState';

    // 初始化 Worker
    const blob = new Blob([document.getElementById('ai-worker-code').textContent], { type: 'text/javascript' });
    const worker = new Worker(URL.createObjectURL(blob));

    function createInitialState(isAI = true) {
      return {
        mode: isAI ? 'AI' : 'PVP',
        turn: 'BLACK',
        state: 'PLAYING',
        winner: null,
        blackHand: Array.from({length: 9}, (_, i) => ({ id: `b${i+1}`, val: i+1, color: 'b' })),
        whiteHand: Array.from({length: 8}, (_, i) => ({ id: `w${i+1}`, val: i+1, color: 'w' })),
        center: [{ id: 'w9', val: 9, color: 'w' }],
        selections: { hand: [], center: [], operator: null },
        discardSelections: []
      };
    }

    let game = loadState() || createInitialState(true);

    function saveState() { localStorage.setItem(SAVE_KEY, JSON.stringify(game)); }
    function loadState() {
      try { const saved = localStorage.getItem(SAVE_KEY); return saved ? JSON.parse(saved) : null; } 
      catch (e) { return null; }
    }

    function toggleMode() {
      if(confirm(`確定要切換到 ${game.mode === 'AI' ? '雙人對戰' : '單人打 AI'} 模式並重新開始嗎？`)) {
        game = createInitialState(game.mode !== 'AI');
        saveState(); render();
      }
    }

    function resetGame(force = false) {
      if (force && !confirm('確定要重新開始遊戲嗎？')) return;
      game = createInitialState(game.mode === 'AI');
      saveState(); render();
    }

    // --- 共用數學驗證 ---
    function getPermutations(arr) {
      if (arr.length <= 1) return [arr];
      let result = [];
      for (let i = 0; i < arr.length; i++) {
        let current = arr[i];
        let remaining = arr.slice(0, i).concat(arr.slice(i + 1));
        for (let perm of getPermutations(remaining)) result.push([current].concat(perm));
      }
      return result;
    }

    function getValues(cards) {
      if (cards.length === 1) { return (cards[0].val === 6 || cards[0].val === 9) ? [6, 9] : [cards[0].val]; }
      if (cards.length === 2) {
        let v1_opts = (cards[0].val === 6 || cards[0].val === 9) ? [6, 9] : [cards[0].val];
        let v2_opts = (cards[1].val === 6 || cards[1].val === 9) ? [6, 9] : [cards[1].val];
        let vals = [];
        for (let v1 of v1_opts) for (let v2 of v2_opts) vals.push(v1 * 10 + v2);
        return vals;
      }
      return [];
    }

     function checkEquation(handCards, op, targetCards) {
      // 修正：必須將場中目標卡牌也進行全排列，才能支援如 9, 5 顛倒變成 59, 56 的情況
      let targets = [];
      const targetPerms = getPermutations(targetCards);
      for (let p of targetPerms) {
        targets = targets.concat(getValues(p));
      }

      const perms = getPermutations(handCards);
      for (let p of perms) {
        let splits = [];
        if (p.length === 2) splits.push({A: [p[0]], B: [p[1]]});
        if (p.length === 3) { 
          splits.push({A: [p[0]], B: [p[1], p[2]]}); 
          splits.push({A: [p[0], p[1]], B: [p[2]]}); 
        }
        if (p.length === 4) { 
          splits.push({A: [p[0], p[1]], B: [p[2], p[3]]}); 
        }
        for (let split of splits) {
          let valsA = getValues(split.A);
          let valsB = getValues(split.B);
          for (let a of valsA) {
            for (let b of valsB) {
              let res;
              if (op === '+') res = a + b;
              if (op === '-') res = a - b;
              if (op === '*') res = a * b;
              if (op === '/') res = a / b;
              if (targets.includes(res)) return true;
            }
          }
        }
      }
      return false;
    }


    // --- UI 互動 ---
    function toggleSelect(id, location) {
      if (game.state === 'GAMEOVER') return;
      if (game.mode === 'AI' && game.turn === 'WHITE') return; // AI 回合鎖定玩家操作

      if (game.state === 'DISCARDING') {
        if (location !== 'center') return;
        const idx = game.discardSelections.indexOf(id);
        if (idx > -1) game.discardSelections.splice(idx, 1);
        else if (game.discardSelections.length < 2) game.discardSelections.push(id);
        render(); return;
      }
      if (location === 'hand') {
        const idx = game.selections.hand.indexOf(id);
        if (idx > -1) game.selections.hand.splice(idx, 1);
        else if (game.selections.hand.length < 4) game.selections.hand.push(id);
      } else {
        const idx = game.selections.center.indexOf(id);
        if (idx > -1) game.selections.center.splice(idx, 1);
        else if (game.selections.center.length < 2) game.selections.center.push(id);
      }
      render();
    }

    document.querySelectorAll('.op-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        if (game.state !== 'PLAYING' || (game.mode === 'AI' && game.turn === 'WHITE')) return;
        game.selections.operator = e.target.dataset.op;
        render();
      });
    });

    function handleMainAction() {
      if (game.state === 'DISCARDING') {
        if (game.discardSelections.length !== 2) return alert('請選擇要保留的 2 張牌！');
        game.center = game.center.filter(c => game.discardSelections.includes(c.id));
        game.discardSelections = [];
        endTurn(); return;
      }
      if (game.state === 'GAMEOVER') { resetGame(false); return; }

      const activeHand = game.turn === 'BLACK' ? game.blackHand : game.whiteHand;
      const hCards = activeHand.filter(c => game.selections.hand.includes(c.id));
      const cCards = game.center.filter(c => game.selections.center.includes(c.id));
      const op = game.selections.operator;

      if (hCards.length < 2 || hCards.length > 4) return alert("請從手牌選擇 2~4 張牌");
      if (cCards.length < 1 || cCards.length > 2) return alert("請從場中選擇 1~2 張目標");
      if (!op) return alert("請選擇運算符號");

      if (checkEquation(hCards, op, cCards)) {
        if (game.turn === 'BLACK') game.blackHand = game.blackHand.filter(c => !game.selections.hand.includes(c.id)).concat(cCards);
        else game.whiteHand = game.whiteHand.filter(c => !game.selections.hand.includes(c.id)).concat(cCards);
        
        game.center = game.center.filter(c => !game.selections.center.includes(c.id)).concat(hCards);
        game.selections = { hand: [], center: [], operator: null };

        if (game.center.length > 2) {
          game.state = 'DISCARDING';
          if (game.mode === 'AI' && game.turn === 'WHITE') {
             // 讓 AI 自動執行剛剛在 worker 算好的 discard 選擇
             handleMainAction(); 
          } else {
             render();
          }
        } else { endTurn(); }
      } else { alert("無法湊出這個結果！確認一下數字或符號是否有誤？"); }
    }

    function endTurn() {
      const activeHand = game.turn === 'BLACK' ? game.blackHand : game.whiteHand;
      const targetColor = game.turn === 'BLACK' ? 'w' : 'b';
      if (activeHand.length > 0 && activeHand.every(c => c.color === targetColor)) {
        game.winner = game.turn;
        game.state = 'GAMEOVER';
      } else {
        game.turn = game.turn === 'BLACK' ? 'WHITE' : 'BLACK';
        game.state = 'PLAYING';
      }
      saveState(); render();

      // 觸發 AI 回合
      if (game.mode === 'AI' && game.turn === 'WHITE' && game.state === 'PLAYING') {
        document.getElementById('status-banner').innerHTML = `<span class="ai-thinking">🧠 大師級 AI 推演中...</span>`;
        worker.postMessage({ aiHand: game.whiteHand, centerCards: game.center });
      }
    }

    // 接收 AI 運算結果
    worker.onmessage = function(e) {
      const move = e.data;
      if (!move) {
         // AI 算不出結果，直接宣告投降
         setTimeout(() => { giveUp(); }, 1500);
         return;
      }
         // 延遲展示 AI 動作，讓玩家看得清楚
      setTimeout(() => {
        game.selections.hand = move.hand;
        game.selections.center = move.center;
        game.selections.operator = move.op;
        if (move.discard && move.discard.length === 2) {
           game.discardSelections = move.discard; // 預先塞入丟棄選擇
        }
        render();
        setTimeout(() => handleMainAction(), 800);
      }, 1000);
    };

    function giveUp() {
      const player = game.turn === 'BLACK' ? (game.mode==='AI'?'你':'黑方') : (game.mode==='AI'?'AI':'白方');
      if (game.turn === 'BLACK' || game.mode === 'PVP') {
         if (!confirm(`確定無法湊出算式嗎？對手將直接獲勝！`)) return;
      }
      game.winner = game.turn === 'BLACK' ? 'WHITE' : 'BLACK';
      game.state = 'GAMEOVER';
      saveState(); render();
    }

    function generateCardHTML(card, location) {
      const isBlack = card.color === 'b';
      const isSelectable = (game.state === 'PLAYING' && (location === 'center' || (game.turn === 'BLACK' && location === 'black') || (game.turn === 'WHITE' && location === 'white'))) ||
                           (game.state === 'DISCARDING' && location === 'center');
      
      let isSelected = (game.state === 'PLAYING') ? (game.selections.hand.includes(card.id) || game.selections.center.includes(card.id)) :
                       (game.state === 'DISCARDING') ? game.discardSelections.includes(card.id) : false;

      const baseClasses = "w-12 h-16 flex items-center justify-center text-2xl font-bold font-mono rounded-lg border-2 shadow-sm transition-all select-none card-enter";
      const colorClasses = isBlack ? "bg-slate-800 text-white border-slate-900" : "bg-white text-slate-800 border-slate-300";
      
      let interactiveClasses = "opacity-60";
      if (game.mode === 'AI' && game.turn === 'WHITE' && location !== 'center' && !isSelected) {
         // AI回合，鎖定卡牌樣式
         interactiveClasses = "opacity-40";
      } else if (isSelectable) {
        interactiveClasses = isSelected ? "ring-4 ring-blue-500 scale-105 opacity-100 cursor-pointer" : "cursor-pointer hover:-translate-y-1 opacity-100";
      } else if (isSelected) {
         interactiveClasses = "opacity-100 ring-2 ring-slate-400";
      }

      const targetLoc = location === 'center' ? 'center' : 'hand';
      return `<div class="${baseClasses} ${colorClasses} ${interactiveClasses}" onclick="${isSelectable ? `toggleSelect('${card.id}', '${targetLoc}')` : ''}">${card.val}</div>`;
    }

    function render() {
      document.getElementById('white-hand').innerHTML = game.whiteHand.map(c => generateCardHTML(c, 'white')).join('');
      document.getElementById('black-hand').innerHTML = game.blackHand.map(c => generateCardHTML(c, 'black')).join('');
      document.getElementById('center-cards').innerHTML = game.center.map(c => generateCardHTML(c, 'center')).join('');

      document.getElementById('white-label').innerText = game.mode === 'AI' ? '白方手牌 (AI)' : '白方手牌';
      document.getElementById('mode-btn').innerHTML = game.mode === 'AI' ? `<i data-lucide="bot" class="w-4 h-4"></i> 單人 AI` : `<i data-lucide="users" class="w-4 h-4"></i> 雙人對戰`;
      lucide.createIcons();

      const whiteArea = document.getElementById('white-area');
      const blackArea = document.getElementById('black-area');
      whiteArea.className = `bg-white rounded-2xl p-4 border-2 shadow-sm transition-colors ${game.turn === 'WHITE' && game.state !== 'GAMEOVER' ? 'border-blue-500 bg-blue-50' : 'border-transparent'}`;
      blackArea.className = `bg-white rounded-2xl p-4 border-2 shadow-sm transition-colors mb-4 ${game.turn === 'BLACK' && game.state !== 'GAMEOVER' ? 'border-blue-500 bg-blue-50' : 'border-transparent'}`;

      document.querySelectorAll('.op-btn').forEach(btn => {
        const isSelected = game.selections.operator === btn.dataset.op;
        btn.className = `op-btn w-12 h-12 rounded-lg border text-xl font-bold transition-colors ${
          isSelected ? 'bg-blue-600 text-white border-blue-700 shadow-md scale-105' : 'bg-slate-100 text-slate-700 border-slate-300'
        } ${game.state !== 'PLAYING' || (game.mode === 'AI' && game.turn === 'WHITE' && !isSelected) ? 'opacity-50 cursor-not-allowed' : 'hover:bg-slate-200'}`;
      });

      const statusBanner = document.getElementById('status-banner');
      const mainBtn = document.getElementById('main-btn');
      const giveupBtn = document.getElementById('giveup-btn');
      const opGroup = document.getElementById('operator-group');

      if (game.state === 'GAMEOVER') {
        const winnerName = game.winner === 'BLACK' ? (game.mode==='AI'?'🎉 你':'黑方') : (game.mode==='AI'?'🤖 AI':'白方');
        statusBanner.className = "bg-amber-100 text-amber-800 p-3 rounded-xl text-center font-bold shadow-sm border border-amber-200";
        statusBanner.innerHTML = `遊戲結束！ ${winnerName} 獲得勝利！`;
        mainBtn.innerText = "再玩一局"; mainBtn.className = "w-full bg-slate-800 text-white py-3 rounded-xl font-bold shadow-md active:scale-[0.98] transition-transform";
        giveupBtn.classList.add('hidden'); opGroup.classList.add('hidden');

      } else if (game.state === 'DISCARDING') {
        const isAI = game.mode === 'AI' && game.turn === 'WHITE';
        statusBanner.className = "bg-rose-100 text-rose-800 p-3 rounded-xl text-center font-bold shadow-sm border border-rose-200";
        statusBanner.innerHTML = isAI ? `AI 正在丟棄多餘卡牌...` : `⚠️ 場中央超過兩張，請選擇 2 張保留`;
        mainBtn.innerText = `確認保留 (${game.discardSelections.length}/2)`;
        mainBtn.className = `w-full py-3 rounded-xl font-bold shadow-md transition-transform ${game.discardSelections.length === 2 ? 'bg-rose-600 text-white active:scale-[0.98]' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`;
        if(isAI) mainBtn.className += " hidden";
        giveupBtn.classList.add('hidden'); opGroup.classList.add('hidden');

      } else {
        const isAI = game.mode === 'AI' && game.turn === 'WHITE';
        const player = game.turn === 'BLACK' ? '黑方 (你)' : (game.mode==='AI'?'大師級 AI':'白方');
        statusBanner.className = "bg-blue-100 text-blue-800 p-3 rounded-xl text-center font-bold shadow-sm border border-blue-200";
        
        // 避免覆蓋正在閃爍的 AI 思考狀態
        if(!isAI || !statusBanner.innerHTML.includes('推演中')) {
           statusBanner.innerHTML = `現在輪到：<span class="text-xl mx-1">${player}</span> 行動`;
        }
        
        mainBtn.innerText = isAI ? "AI 決定中..." : "送出算式";
        mainBtn.className = `w-full py-3 rounded-xl font-bold shadow-md transition-transform ${isAI ? 'bg-slate-300 text-slate-500 cursor-not-allowed hidden' : 'bg-blue-600 text-white active:scale-[0.98]'}`;
        
        if(isAI) { giveupBtn.classList.add('hidden'); } else { giveupBtn.classList.remove('hidden'); }
        opGroup.classList.remove('hidden');
      }
    }

    render();
    if (game.mode === 'AI' && game.turn === 'WHITE' && game.state === 'PLAYING') endTurn(); // 處理重整時剛好是AI回合
  </script>
</body>
</html>

    const rightRail = document.createElement('div');
    rightRail.className = 'utility-rail utility-rail-right';
    rightRail.innerHTML = '<button class="table-icon utility-cycle" data-role="utility-mode" onclick="toggleUtilityMenu(\'mode\', this)" aria-haspopup="menu" aria-expanded="false" aria-label="選擇模式" title="選擇模式"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m14.5 6.5 3-3 3 3-3 3"/><path d="M17.5 6.5a7 7 0 0 0-12 5"/><path d="m9.5 17.5-3 3-3-3 3-3"/><path d="M6.5 17.5a7 7 0 0 0 12-5"/></svg><span data-role="utility-label">雙人</span></button><button class="table-icon utility-cycle" data-role="utility-rule" onclick="toggleUtilityMenu(\'rule\', this)" aria-haspopup="menu" aria-expanded="false" aria-label="選擇規則" title="選擇規則"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2M12 4v1M12 19v1M4.9 7.1l1.1 1.1M18 15.8l1.1 1.1"/></svg><span data-role="utility-label">基本</span></button><button class="table-icon utility-rules" data-role="utility-rules" onclick="toggleRules(true)" aria-label="遊戲規則" title="遊戲規則"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 1 1 4 2c-1.1.8-1.6 1.2-1.6 2.5M12 17h.01"/></svg></button><button class="table-icon utility-reset" onclick="resetGame(true)" aria-label="重新開始" title="重新開始"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.5"/><path d="M4 4v4.5h4.5"/></svg></button>';
    const helpButton = rightRail.querySelector('.utility-rules');
    helpButton.setAttribute('aria-controls', 'rules-modal');
    helpButton.setAttribute('aria-haspopup', 'dialog');

    document.querySelectorAll('.equation-zone').forEach(zone => {
      zone.querySelector('.play-hint').setAttribute('aria-live', 'polite');
    });

    const modeMenu = document.createElement('div');
    modeMenu.id = 'utility-mode-menu';
    modeMenu.className = 'utility-menu hidden';
    modeMenu.setAttribute('role', 'menu');
    modeMenu.innerHTML = '<button type="button" role="menuitemradio" data-mode="PVP" onclick="selectUtilityMode(\'PVP\')"></button><button type="button" role="menuitemradio" data-mode="AI_EASY" onclick="selectUtilityMode(\'AI_EASY\')"></button><button type="button" role="menuitemradio" data-mode="AI_HARD" onclick="selectUtilityMode(\'AI_HARD\')"></button>';

    const ruleMenu = document.createElement('div');
    ruleMenu.id = 'utility-rule-menu';
    ruleMenu.className = 'utility-menu hidden';
    ruleMenu.setAttribute('role', 'menu');
    ruleMenu.innerHTML = '<button type="button" role="menuitemradio" data-rule-mode="CLASSIC" onclick="selectUtilityRule(\'CLASSIC\')"></button><button type="button" role="menuitemradio" data-rule-mode="RACE2" onclick="selectUtilityRule(\'RACE2\')"></button>';

    function syncUtilityRailPosition() {
      const tableRect = tabletop.getBoundingClientRect();
      const tableCenter = tableRect.top + (tableRect.height / 2);
      document.documentElement.style.setProperty('--utility-center-y', `${tableCenter}px`);
    }

    document.body.append(leftRail, rightRail, modeMenu, ruleMenu);
    tutorialSpotlight = GuideSpotlight.create();
    document.addEventListener('click', event => {
      if (!event.target.closest('.utility-menu, [aria-haspopup="menu"]')) closeUtilityMenus();
    });
    document.addEventListener('keydown', event => {
      if (event.repeat && event.target.closest('[data-role="plan-continue-btn"], [data-role="guide-back-btn"]')) { event.preventDefault(); return; }
      if (event.key === 'Escape') {
        if (currentDialog) closeGameDialog();
        closeUtilityMenus();
      }
      if (event.key === 'Tab' && currentDialog) {
        const controls = [...document.getElementById(currentDialog).querySelectorAll('button, input')].filter(element => !element.hidden && !element.disabled);
        const first = controls[0];
        const last = controls[controls.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }
    });
    window.addEventListener('resize', () => {
      syncUtilityRailPosition();
      closeUtilityMenus();
    });
    window.addEventListener('pagehide', () => { cancelGameWork(); game = { ...game }; });
    window.addEventListener('pageshow', event => { if (event.persisted) window.location.reload(); });
    document.querySelectorAll('.game-dialog').forEach(modal => {
      modal.addEventListener('click', event => { if (event.target === modal) closeGameDialog(); });
    });
    syncUtilityRailPosition();
    resetAiWorker();
    render();
    if (MathDuelTutorial.shouldOffer(tutorialPreferences)) openGameDialog('welcome-modal');
    else checkAITurn();
  </script>
</body>

</html>

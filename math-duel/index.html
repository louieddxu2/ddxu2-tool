    // 自動註冊邏輯
    (function autoRegister() {
      let appPath = window.location.pathname;
      if (appPath.endsWith('index.html')) appPath = appPath.replace('index.html', '');
      if (!appPath.endsWith('/')) appPath += '/';
      if (appPath === '/') return;
      try { localStorage.setItem('myAppLauncherLastPath', appPath); } catch { }
      const launcherPath = appPath.replace(/[^/]+\/$/, '') || '/';
      const homeHref = launcherPath.includes('?') ? `${launcherPath}&home=1` : `${launcherPath}?home=1`;
      window.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('[data-home-link]').forEach(el => { el.setAttribute('href', homeHref); el.classList.remove('invisible', 'pointer-events-none'); });
      });
      const appMeta = { id: 'math-duel', name: '黑白算術對決', nameZh: '黑白算術對決', nameEn: 'Math Duel', path: appPath, icon: 'swords', color: 'slate' };
      const storageKey = 'myAppLauncherStorage';
      const launcherData = JSON.parse(localStorage.getItem(storageKey) || '[]');
      const idx = launcherData.findIndex(a => a.path === appMeta.path);
      if (idx === -1) launcherData.push(appMeta); else launcherData[idx] = { ...launcherData[idx], ...appMeta };
      localStorage.setItem(storageKey, JSON.stringify(launcherData));
    })();

  <script>
    // ==========================================
    // ⚙️ 系統版本控制
    // 遊戲存檔與 AI Worker 的相容版號。
    // 介面與教學資源使用各自的版本，避免清除既有對局。
    const APP_VERSION = '1.6.0';
    // ==========================================

    // --- 1. 載入外部 Worker 檔案 (加上版號破解快取) ---
    let worker = null;
    let aiTimeoutToken = null;
    let aiPlanTimer = null;
    let aiPlanResolver = null;
    let aiRequestPending = false;
    let workerAwaitingReply = false;
    const gameTaskTimers = new Set();
    let sessionSerial = 1;
    let gameSession = { id: sessionSerial, action: 0, activeAction: null };
    let guideEventSerial = 0;
    let tutorialSpotlight = null;
    let tutorialGate = null;
    let completedLesson = false;
    let currentDialog = null;
    let dialogOpener = null;
    const dialogWaiters = new Set();

    // --- 2. 存檔 Key 也綁定版號 (徹底預防讀取到舊版卡死狀態) ---
    const SAVE_KEY = `mathDuelState_v${APP_VERSION}`;
    let tutorialSession = null;
    function tutorialStorage() {
      try { return window.localStorage; } catch { return null; }
    }
    let tutorialPreferences = MathDuelTutorial.readPreferences(tutorialStorage());

    function createInitialState(mode = 'PVP', ruleMode = MathDuelRuleModes.RULE_MODE.CLASSIC, preferredAiSide = null) {
      const aiSide = (mode.startsWith('AI')) ? (preferredAiSide || (Math.random() < 0.5 ? 'BLACK' : 'WHITE')) : null;
      const gameState = {
        mode: mode,
        ruleMode: ruleMode,
        turn: 'BLACK',
        aiSide: aiSide,
        aiColor: aiSide ? (aiSide === 'BLACK' ? 'b' : 'w') : null,
        playerColor: aiSide ? (aiSide === 'BLACK' ? 'w' : 'b') : null,
        state: 'PLAYING', winner: null,
        blackHand: Array.from({ length: 9 }, (_, i) => ({ id: `b${i + 1}`, val: i + 1, color: 'b' })),
        whiteHand: Array.from({ length: 8 }, (_, i) => ({ id: `w${i + 1}`, val: i + 1, color: 'w' })),
        center: [{ id: 'w9', val: 9, color: 'w' }],
        selections: { hand: [], center: [], operator: null },
        discardSelections: [],
        lastMove: null,
        aiMoveInfo: null,
        movePreview: null,
        uiBusy: false
      };
      return MathDuelRuleModes.initRuleState(gameState, ruleMode);
    }

    let game = loadState() || createInitialState('PVP');
    game = MathDuelRuleModes.ensureRuleState(game);
    document.getElementById('mode-select').value = game.mode;
    document.getElementById('rule-mode-select').value = game.ruleMode;

    function saveState() {
      if (game.uiBusy || game.state === 'ANIMATING') return;
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(game)); } catch { /* Play remains available without storage. */ }
    }
    function loadState() {
      try {
        const saved = localStorage.getItem(SAVE_KEY);
        const parsed = saved ? JSON.parse(saved) : null;
        return parsed ? MathDuelRuleModes.ensureRuleState(parsed) : null;
      } catch (e) {
        return null;
      }
    }

    function setWelcomePreference(dontShow) {
      tutorialPreferences = { ...tutorialPreferences, dontShow };
      MathDuelTutorial.writePreferences(tutorialStorage(), tutorialPreferences);
    }

    function clearGameMotion() {
      document.getElementById('card-motion-layer')?.remove();
      if (viewTurnTimer) clearTimeout(viewTurnTimer);
      viewTurnTimer = null;
      lastViewTurnKey = null;
      document.body.classList.remove('is-turning');
      document.body.removeAttribute('aria-busy');
      lastRenderState = { ...lastRenderState, white: '', black: '', center: '' };
    }

    function finishTutorialGate(proceed) {
      const gate = tutorialGate;
      tutorialGate = null;
      gate?.resolve(proceed && game === gate.game);
    }

    function emitGuideEvent(event) {
      if (!tutorialSession) return;
      const session = tutorialSession;
      if (event.type === 'selection.changed') { session.rejected = false; session.notice = null; }
      if (event.type === 'limit.reached') session.notice = event.area;
      if (event.type === 'turn.completed') { session.help = false; session.rejected = false; session.notice = null; }
      const result = FlowGuide.advanceGuide(session.state, MathDuelTutorial.definition,
        { id: `${gameSession.id}:event:${++guideEventSerial}`, ...event },
        { game, help: session.help, rejected: session.rejected, notice: session.notice });
      session.state = result.state;
      session.view = result.view;
      result.effects.forEach(effect => {
        if (effect.type === 'release') finishTutorialGate(effect.proceed);
      });
      if (session.state.status === 'completed') {
        completedLesson = game.state === 'GAMEOVER' && game.winner === 'BLACK' && gameSession.action === 5;
        if (completedLesson) {
          tutorialPreferences = { ...tutorialPreferences, completed: true };
          MathDuelTutorial.writePreferences(tutorialStorage(), tutorialPreferences);
        }
        tutorialSession = null;
      }
    }

    function stopTutorial(type = 'skip', resume = true) {
      if (!tutorialSession) return;
      emitGuideEvent({ type });
      tutorialSession = null;
      finishTutorialGate(type === 'skip');
      if (resume) { saveState(); render(); checkAITurn(); }
    }

    function endTutorial() { stopTutorial('skip'); }

    function cancelGameWork() {
      stopTutorial('cancel', false);
      tutorialSpotlight?.clear();
      finishTutorialGate(false);
      cancelAiPlanWait();
      if (aiTimeoutToken) clearTimeout(aiTimeoutToken);
      aiTimeoutToken = null;
      gameTaskTimers.forEach(clearTimeout);
      gameTaskTimers.clear();
      dialogWaiters.forEach(resolve => resolve(false));
      dialogWaiters.clear();
      worker?.terminate();
      worker = null;
      aiRequestPending = false;
      workerAwaitingReply = false;
    }

    function replaceGame(nextGame) {
      cancelGameWork();
      game = nextGame;
      gameSession = { id: ++sessionSerial, action: 0, activeAction: null };
      completedLesson = false;
      clearGameMotion();
      closeUtilityMenus();
      resetAiWorker();
    }

    function startTutorial(alreadyConfirmed = false) {
      const hasProgress = Boolean(game.lastMove || game.state !== 'PLAYING' || game.selections.hand.length ||
        game.selections.center.length || game.selections.operator || (tutorialSession && tutorialSession.state.stepIndex > 0));
      if (hasProgress && !alreadyConfirmed && !confirm(t('tutorial_restart_confirm'))) return;
      replaceGame(createInitialState('AI_EASY', MathDuelRuleModes.RULE_MODE.CLASSIC, 'WHITE'));
      tutorialSession = { state: FlowGuide.createGuideState(MathDuelTutorial.definition), view: null, help: false, rejected: false };
      emitGuideEvent({ type: 'start' });
      saveState();
      closeGameDialog();
      render();
      // Establish the goal on the real opening board before teaching any taps.
      // This checkpoint does not perform or count a game action.
      void waitForTutorial('opening');
    }

    function requestTutorialHelp() {
      if (tutorialSession) {
        tutorialSession.help = true;
        tutorialSession.notice = null;
        emitGuideEvent({ type: 'view.changed' });
      }
      if (currentDialog) closeGameDialog();
      render();
    }

    function backTutorial() {
      if (!tutorialSession?.state.checkpoint || currentDialog) return;
      emitGuideEvent({ type: 'back' });
      render();
      document.querySelector('#black-actions [data-role="plan-continue-btn"]').focus({ preventScroll: true });
    }

    function waitForTutorial(key) {
      if (!tutorialSession || !MathDuelTutorial.definition.steps[tutorialSession.state.stepIndex].checkpoints[key]?.length) return Promise.resolve(true);
      return new Promise(resolve => {
        tutorialGate = { key, game, resolve };
        emitGuideEvent({ type: 'checkpoint', key });
        saveState();
        render();
        if (!currentDialog) document.querySelector('#black-actions [data-role="plan-continue-btn"]').focus({ preventScroll: true });
      });
    }

    function refreshDialogText() {
      document.getElementById('welcome-title').textContent = t('welcome_title');
      document.getElementById('welcome-detail').textContent = t('welcome_detail');
      document.getElementById('welcome-start').textContent = t('tutorial_start');
      document.getElementById('welcome-rules').textContent = t('welcome_rules');
      document.getElementById('welcome-play').textContent = t('tutorial_skip');
      document.getElementById('welcome-hide-label').textContent = t('welcome_hide');
      document.getElementById('welcome-dont-show').checked = tutorialPreferences.dontShow;
      document.getElementById('modal-rules-title').textContent = t('rules_title');
      ['init', 'action', 'limit', 'special', 'win'].forEach((key, index) => {
        document.getElementById(`rule-${index + 1}`).textContent = t(`rules_${key}`);
      });
      document.getElementById('modal-close-btn').textContent = t('close');
      document.getElementById('rules-start-tutorial').textContent = t('tutorial_replay');
      document.getElementById('rules-step-help').textContent = t('tutorial_help');
      document.getElementById('rules-skip-tutorial').textContent = t('tutorial_exit');
      document.getElementById('rules-step-help').hidden = !tutorialSession;
      document.getElementById('rules-skip-tutorial').hidden = !tutorialSession;
      document.querySelectorAll('[data-dialog-close]').forEach(button => button.setAttribute('aria-label', t('close')));
    }

    function openGameDialog(id) {
      if (!currentDialog) dialogOpener = document.activeElement;
      currentDialog = id;
      tutorialSpotlight?.clear();
      closeUtilityMenus();
      refreshDialogText();
      document.querySelectorAll('.game-dialog').forEach(modal => modal.classList.toggle('hidden', modal.id !== id));
      document.querySelectorAll('#game-board, .utility-rail, .utility-menu').forEach(element => { element.inert = true; });
      const modal = document.getElementById(id);
      (modal.querySelector('#welcome-start') || modal.querySelector('[data-dialog-close]')).focus();
    }

    function closeGameDialog() {
      currentDialog = null;
      document.querySelectorAll('.game-dialog').forEach(modal => modal.classList.add('hidden'));
      document.querySelectorAll('#game-board, .utility-rail, .utility-menu').forEach(element => { element.inert = false; });
      const opener = dialogOpener;
      dialogOpener = null;
      if (opener?.isConnected && !opener.closest('.hidden') && opener !== document.body) opener.focus();
      else document.querySelector('.utility-rules')?.focus();
      dialogWaiters.forEach(resolve => resolve(true));
      dialogWaiters.clear();
      renderTutorial();
      checkAITurn();
    }

    function waitForGameDialog(capturedGame) {
      if (!currentDialog) return Promise.resolve(game === capturedGame);
      return new Promise(resolve => dialogWaiters.add(proceed => resolve(proceed && game === capturedGame)));
    }

    function scheduleGameTask(callback, delay) {
      const scheduledGame = game;
      const token = setTimeout(() => {
        gameTaskTimers.delete(token);
        if (game === scheduledGame) callback();
      }, delay);
      gameTaskTimers.add(token);
      return token;
    }

    function finishAiPlanWait(shouldContinue) {
      if (!aiPlanResolver) return;
      if (aiPlanTimer) clearTimeout(aiPlanTimer);
      const resolve = aiPlanResolver;
      aiPlanTimer = null;
      aiPlanResolver = null;
      resolve(shouldContinue);
    }

    function waitForAiPlan(ms) {
      return new Promise(resolve => {
        aiPlanResolver = resolve;
        aiPlanTimer = setTimeout(() => finishAiPlanWait(true), ms);
      });
    }

    function continueAiPlan(event) {
      // A double-click should not skip the next explanation. Ordinary taps stay immediate.
      if (tutorialGate && (currentDialog || event?.detail > 1 || event?.repeat)) return;
      if (tutorialGate) { emitGuideEvent({ type: 'continue' }); render(); return; }
      finishAiPlanWait(true);
    }

    function cancelAiPlanWait() {
      finishAiPlanWait(false);
    }

    function changeMode(newMode) {
      if (confirm(t('confirm_change_mode'))) {
        replaceGame(createInitialState(newMode, game.ruleMode));
        saveState(); render(); checkAITurn();
      } else {
        document.getElementById('mode-select').value = game.mode;
      }
    }

    function changeRuleMode(newRuleMode) {
      if (confirm(t('confirm_change_mode'))) {
        replaceGame(createInitialState(game.mode, newRuleMode));
        saveState(); render(); checkAITurn();
      } else {
        document.getElementById('rule-mode-select').value = game.ruleMode;
      }
    }

    function closeUtilityMenus() {
      document.querySelectorAll('.utility-menu').forEach(menu => {
        menu.classList.add('hidden');
        menu.removeAttribute('data-open');
      });
      document.querySelectorAll('[aria-haspopup="menu"]').forEach(button => button.setAttribute('aria-expanded', 'false'));
    }

    function toggleUtilityMenu(type, anchor) {
      const menu = document.getElementById(`utility-${type}-menu`);
      if (!menu) return;
      const wasOpen = menu.dataset.open === 'true';
      closeUtilityMenus();
      if (wasOpen) return;

      menu.classList.remove('hidden');
      menu.dataset.open = 'true';
      anchor.setAttribute('aria-expanded', 'true');
      const rect = anchor.getBoundingClientRect();
      const gap = 8;
      const menuWidth = menu.offsetWidth;
      const menuHeight = menu.offsetHeight;
      let left = rect.left - menuWidth - gap;
      if (left < 8) left = rect.right + gap;
      const top = Math.min(Math.max(8, rect.top), Math.max(8, innerHeight - menuHeight - 8));
      menu.style.left = `${left}px`;
      menu.style.top = `${top}px`;
    }

    function selectUtilityMode(mode) {
      closeUtilityMenus();
      if (mode !== game.mode) changeMode(mode);
    }

    function selectUtilityRule(ruleMode) {
      closeUtilityMenus();
      if (ruleMode !== game.ruleMode) changeRuleMode(ruleMode);
    }

    function resetGame(force = false) {
      if (force && !confirm(t('confirm_reset'))) return;
      if (tutorialSession) { startTutorial(true); return; }
      // Keep the learner's seat for the first ordinary game after the lesson.
      replaceGame(createInitialState(game.mode, game.ruleMode, completedLesson ? game.aiSide : null));
      saveState(); render();
      checkAITurn();
    }

    function isRace2Mode() {
      return MathDuelRuleModes.isRace2(game);
    }

    function passTurn() {
      if (!isRace2Mode() || game.state !== 'PLAYING' || isAITurn()) return;
      const ended = MathDuelRuleModes.applyPassPoint(game);
      if (!ended) game.turn = game.turn === 'BLACK' ? 'WHITE' : 'BLACK';
      saveState(); render(); checkAITurn();
    }

    // --- 前端運算共用區 ---
    const checkEquation = MathDuelEquation.checkEquation;

    // --- 核心邏輯工具 ---
    function getCombinations(arr, k) {
      const result = [];
      function helper(start, combo) {
        if (combo.length === k) { result.push([...combo]); return; }
        for (let i = start; i < arr.length; i++) helper(i + 1, [...combo, arr[i]]);
      }
      helper(0, []);
      return result;
    }

    function hasValidMove(hand, center) {
      if (hand.length < 2) return false;
      const ops = ['+', '-', '*', '/'];
      const handCombos = [];
      for (let i = 2; i <= Math.min(hand.length, 4); i++) {
        const combos = getCombinations(hand, i);
        for (let c of combos) handCombos.push(c);
      }
      const centerCombos = [];
      for (let i = 1; i <= Math.min(center.length, 2); i++) {
        const combos = getCombinations(center, i);
        for (let c of combos) centerCombos.push(c);
      }
      for (let h of handCombos) {
        for (let c of centerCombos) {
          for (let op of ops) {
            if (checkEquation(h, op, c).success) return true;
          }
        }
      }
      return false;
    }

     // --- UI 邏輯 ---
     function isAITurn() { return game.mode.startsWith('AI') && game.turn === game.aiSide; }

     function wait(ms) {
       return new Promise(resolve => setTimeout(resolve, ms));
     }

      function findCardIn(rootSelector, id) {
        const root = document.querySelector(rootSelector);
        if (!root) return null;
        return [...root.querySelectorAll('[data-card-id]')].find(card => card.dataset.cardId === String(id)) || null;
      }

      function findSelectionCard(id, location) {
        const side = game.turn.toLowerCase();
        const roots = location === 'hand'
          ? [`#${side}-equation [data-role="stage-hand-cards"]`, `#${side}-hand`]
          : [`#${side}-equation [data-role="stage-center-cards"]`, '#center-cards'];
        return roots.map(root => findCardIn(root, id)).find(Boolean) || null;
      }

      function findActiveGameCard(id) {
        const side = game.turn.toLowerCase();
        const roots = [
          `#${side}-equation [data-role="stage-hand-cards"]`,
          `#${side}-equation [data-role="stage-center-cards"]`,
          `#${side}-hand`,
          '#center-cards'
        ];
        return roots.map(root => findCardIn(root, id)).find(Boolean) || null;
      }

      function animateSelectionChange(id, location) {
       const selectingGame = game;
       const ids = location === 'hand' ? game.selections.hand : game.selections.center;
       const max = location === 'hand' ? 4 : 2;
       const idx = ids.indexOf(id);
       const adding = idx === -1;
       if (adding && ids.length >= max) {
         emitGuideEvent({ type: 'limit.reached', area: location === 'hand' ? 'hand' : 'target' });
         if (tutorialSession) render();
         return;
       }

       let committed = false;
        CardMotion.playExchange({
           moves: [{ id }],
           find: cardId => game === selectingGame ? findSelectionCard(cardId, location) : null,
           commit: () => {
             if (game !== selectingGame) return;
             if (adding) ids.push(id);
             else ids.splice(idx, 1);
             committed = true;
             emitGuideEvent({ type: 'selection.changed' });
             render();
           },
           options: { duration: 420, stagger: 0 }
         }).catch((error) => {
         if (game !== selectingGame) return;
         console.error('Card selection animation failed:', error);
         if (!committed) {
           if (adding) ids.push(id);
           else ids.splice(idx, 1);
           emitGuideEvent({ type: 'selection.changed' });
           render();
         }
       });
     }

     function toggleSelect(id, location) {
       if (currentDialog || tutorialGate) return;
       if (game.state === 'GAMEOVER' || game.state === 'ANIMATING' || game.uiBusy || isAITurn()) return;
       if (game.state === 'DISCARDING') {
         if (location !== 'center') return;
         const idx = game.discardSelections.indexOf(id);
         if (idx > -1) game.discardSelections.splice(idx, 1);
         else if (game.discardSelections.length < 2) game.discardSelections.push(id);
         else {
           emitGuideEvent({ type: 'limit.reached', area: 'keep' });
           if (tutorialSession) render();
           return;
         }
         emitGuideEvent({ type: 'selection.changed' });
         render(); return;
       }
       if (location !== 'hand' && location !== 'center') return;
       animateSelectionChange(id, location);
     }

    document.addEventListener('click', (event) => {
      const btn = event.target.closest('.op-btn');
      if (!btn || btn.disabled || game.state !== 'PLAYING' || game.uiBusy || isAITurn()) return;
      if (btn.closest('.action-zone')?.dataset.side !== game.turn) return;
      if (currentDialog || tutorialGate) return;
      game.selections.operator = btn.dataset.op;
      emitGuideEvent({ type: 'selection.changed' });
      render();
    });

     function escapeHtml(value) {
       return String(value).replace(/[&<>"']/g, (char) => ({
         '&': '&amp;',
         '<': '&lt;',
         '>': '&gt;',
         '"': '&quot;',
         "'": '&#39;'
       }[char]));
     }

     function getDiscardExitPoint(rect) {
       const centerArea = document.getElementById('center-area');
       const areaRect = centerArea ? centerArea.getBoundingClientRect() : null;
       return {
         left: Math.max((areaRect ? areaRect.right : rect.right) + 90, rect.left + 140),
         top: areaRect ? areaRect.top + areaRect.height / 2 : rect.top - 20
       };
     }

     function applyMoveState(hCards, cCards, op, eqResult) {
       const selectedHandIds = new Set(hCards.map(c => c.id));
       const selectedCenterIds = new Set(cCards.map(c => c.id));
       const aiInfo = game.aiMoveInfo;

       if (game.turn === 'BLACK') game.blackHand = game.blackHand.filter(c => !selectedHandIds.has(c.id)).concat(cCards);
       else game.whiteHand = game.whiteHand.filter(c => !selectedHandIds.has(c.id)).concat(cCards);
       game.center = game.center.filter(c => !selectedCenterIds.has(c.id)).concat(hCards);

       game.lastMove = {
         handCards: hCards.map(c => ({ ...c })),
         centerCards: cCards.map(c => ({ ...c })),
         op,
         turn: game.turn,
         witness: aiInfo?.witness || eqResult,
         eq: aiInfo?.eq || eqResult.eq,
         cardsA: aiInfo?.cardsA || eqResult.cardsA,
         cardsB: aiInfo?.cardsB || eqResult.cardsB
       };

       game.selections = { hand: [], center: [], operator: null };
       game.discardSelections = aiInfo?.discard?.length === 2 ? [...aiInfo.discard] : [];
       game.aiMoveInfo = null;
       gameSession.activeAction = { id: `${gameSession.id}:action:${gameSession.action + 1}`, number: gameSession.action + 1, actor: game.turn };
       emitGuideEvent({ type: 'exchange.completed', actor: game.turn });
     }

     async function playDiscardMove() {
       if (game.state !== 'DISCARDING' || game.discardSelections.length !== 2) return;
       const movingGame = game;

       const keepIds = new Set(game.discardSelections);
       const keepCards = game.center.filter(c => keepIds.has(c.id));
       const discardedCards = game.center.filter(c => !keepIds.has(c.id));
       const actor = isAITurn() ? 'AI' : 'PLAYER';
       game.state = 'ANIMATING';
       game.uiBusy = true;
        game.movePreview = {
         actor,
         phase: 'discard',
         eq: actor === 'AI' ? game.lastMove?.eq : null,
         handCards: [],
         centerCards: discardedCards.map(c => ({ ...c }))
        };
       render();
       let committed = false;
        try {
          await CardMotion.playRemoval({
            ids: discardedCards.map(c => c.id),
            find: cardId => game === movingGame ? findCardIn('#center-cards', cardId) : null,
            commit: () => {
             if (game !== movingGame) return;
             game.center = keepCards;
             game.discardSelections = [];
             committed = true;
             render();
           },
           getExitPoint: getDiscardExitPoint,
            options: { duration: 520, stagger: 70 }
         });
       } catch (error) {
         if (game !== movingGame) return;
         console.error('Card discard animation failed:', error);
         if (!committed) {
           game.center = keepCards;
           game.discardSelections = [];
         }
       }

        if (game !== movingGame) return;
        game.movePreview = null;
        game.uiBusy = false;
        emitGuideEvent({ type: 'keep.completed', actor: game.turn });
        endTurn();
      }

     async function playCardMove(hCards, cCards, op, eqResult) {
        const movingGame = game;
        const movingSide = game.turn.toLowerCase();
        const playedIds = new Set(hCards.map(card => card.id));
        const collectedIds = new Set(cCards.map(card => card.id));
        const actor = isAITurn() ? 'AI' : 'PLAYER';
        const aiInfo = game.aiMoveInfo;
        game.state = 'ANIMATING';
        game.uiBusy = true;
        game.movePreview = {
          actor,
          phase: 'move',
          eq: aiInfo?.eq || eqResult.eq,
          witness: aiInfo?.witness || eqResult,
          handCards: hCards.map(c => ({ ...c })),
          centerCards: cCards.map(c => ({ ...c }))
        };
        render();
       let committed = false;
         try {
           await CardMotion.playExchange({
           moves: [
             ...hCards.map(c => ({ id: c.id, destination: 'center' })),
              ...cCards.map(c => ({ id: c.id, destination: 'hand' }))
            ],
            find: cardId => {
              if (game !== movingGame) return null;
              if (committed && playedIds.has(cardId)) return findCardIn('#center-cards', cardId);
              if (committed && collectedIds.has(cardId)) return findCardIn(`#${movingSide}-hand`, cardId);
              return findActiveGameCard(cardId);
            },
            commit: () => {
             if (game !== movingGame) return;
             applyMoveState(hCards, cCards, op, eqResult);
             committed = true;
             render();
           },
           options: { duration: 560, stagger: 70 }
         });
       } catch (error) {
         if (game !== movingGame) return;
         console.error('Card exchange animation failed:', error);
          if (!committed) {
            applyMoveState(hCards, cCards, op, eqResult);
            committed = true;
            render();
          }
       }

       if (game !== movingGame) return;
       game.movePreview = null;
       if (game.center.length > 2) {
         game.uiBusy = false;
         game.state = 'DISCARDING';
         saveState();
         render();
         if (tutorialSession && !isAITurn()) {
           if (!(await waitForTutorial('before-keep')) || game !== movingGame) return;
         }
         if (isAITurn() && game.discardSelections.length === 2) {
           if (!(await waitForTutorial('before-keep')) || game !== movingGame) return;
           if (!(await waitForGameDialog(movingGame)) || game !== movingGame) return;
           await playDiscardMove();
         }
       } else {
         game.uiBusy = false;
         endTurn();
       }
     }

     function handleMainAction() {
       if (currentDialog || tutorialGate) return;
       if (game.state === 'ANIMATING' || game.uiBusy) return;
       if (game.state === 'DISCARDING') {
         if (game.discardSelections.length !== 2) return alert(t('discard_err'));
         if (tutorialSession && !MathDuelTutorial.matchesTask(tutorialSession.state.stepIndex, game, 'keep')) {
           tutorialSession.rejected = true;
           emitGuideEvent({ type: 'task.rejected' });
           render(); return;
         }
         playDiscardMove();
         return;
       }
       if (game.state === 'GAMEOVER') { resetGame(false); return; }

       const activeHand = game.turn === 'BLACK' ? game.blackHand : game.whiteHand;
       const hCards = activeHand.filter(c => game.selections.hand.includes(c.id));
       const cCards = game.center.filter(c => game.selections.center.includes(c.id));
       const op = game.selections.operator;

       if (hCards.length < 2 || hCards.length > 4) return alert(t('select_hand_err'));
       if (cCards.length < 1 || cCards.length > 2) return alert(t('select_target_err'));
       if (!op) return alert(t('select_op_err'));

       const eqResult = checkEquation(hCards, op, cCards);
       if (!eqResult.success) return alert(t('eq_error'));
       if (tutorialSession && !MathDuelTutorial.matchesTask(tutorialSession.state.stepIndex, game)) {
         tutorialSession.rejected = true;
         emitGuideEvent({ type: 'task.rejected' });
         render(); return;
       }
       playCardMove(hCards, cCards, op, eqResult);
     }

    function endTurn() {
      game.uiBusy = false;
      const turnJustEnded = game.turn;
      const completedAction = gameSession.activeAction;
      gameSession.activeAction = null;
      aiRequestPending = false;
      workerAwaitingReply = false;
      if (isRace2Mode()) {
        const ended = MathDuelRuleModes.applyColorMatchPoint(game, turnJustEnded);
        if (!ended) {
          game.turn = game.turn === 'BLACK' ? 'WHITE' : 'BLACK';
          game.state = 'PLAYING';
        }
      } else {
        const activeHand = game.turn === 'BLACK' ? game.blackHand : game.whiteHand;
        const targetColor = game.turn === 'BLACK' ? 'w' : 'b';
        if (activeHand.length > 0 && activeHand.every(c => c.color === targetColor)) {
          game.winner = game.turn; game.state = 'GAMEOVER';
        } else {
          game.turn = game.turn === 'BLACK' ? 'WHITE' : 'BLACK';
          game.state = 'PLAYING';
        }
      }
      if (completedAction) {
        gameSession.action = completedAction.number;
        emitGuideEvent({ type: 'turn.completed', id: `${completedAction.id}:turn`, actor: turnJustEnded, action: completedAction.number });
      }
      if (game.state === 'GAMEOVER') { emitGuideEvent({ type: 'game.over', actor: turnJustEnded }); stopTutorial('cancel', false); }
      saveState(); render();
      if (tutorialSession && completedAction?.number === 1) {
        const reviewedGame = game;
        void waitForTutorial('after-player-exchange').then(proceed => {
          if (proceed && game === reviewedGame) checkAITurn();
        });
      } else checkAITurn();
    }

    function checkAITurn() {
      if (currentDialog || aiRequestPending || tutorialGate) return;
      if (game.state === 'DISCARDING' && isAITurn() && game.discardSelections.length === 2) {
        aiRequestPending = true;
        scheduleGameTask(() => playDiscardMove(), 100);
        return;
      }
      if (game.state !== 'PLAYING') return;
      if (tutorialSession && !MathDuelTutorial.isExpectedBoard(tutorialSession.state.stepIndex, game)) stopTutorial('skip', false);

      // 檢查當前行動方是否還有路走 (死局判定)
      const currentHand = game.turn === 'BLACK' ? game.blackHand : game.whiteHand;
      if (!hasValidMove(currentHand, game.center)) {
        if (isRace2Mode()) {
          const ended = MathDuelRuleModes.applyPassPoint(game);
          if (!ended) game.turn = game.turn === 'BLACK' ? 'WHITE' : 'BLACK';
          saveState(); render();
          scheduleGameTask(() => checkAITurn(), 200);
          return;
        }
        scheduleGameTask(() => {
          const winner = game.turn === 'BLACK' ? 'WHITE' : 'BLACK';
          const msg = game.turn === 'BLACK' ? (LANG === 'zh' ? '你已無路可走！' : 'No moves left!') : (LANG === 'zh' ? 'AI 已無路可走！' : 'AI has no moves left!');
          alert(msg);
          game.winner = winner;
          game.state = 'GAMEOVER';
          stopTutorial('cancel', false);
          saveState(); render();
        }, 300);
        return;
      }

      if (isAITurn()) {
        aiRequestPending = true;
        if (tutorialSession) {
          const lesson = tutorialSession;
          const move = MathDuelTutorial.createAiMove(lesson.state.stepIndex, game, checkEquation);
          if (move) {
            scheduleGameTask(() => {
              if (tutorialSession === lesson) revealAiMove(move);
              else { aiRequestPending = false; checkAITurn(); }
            }, 350);
            return;
          }
          stopTutorial('skip', false);
        }
        if (game.aiMoveInfo) { resumeAiPlan(game); return; }
        const difficulty = game.mode === 'AI_HARD' ? 'hard' : 'easy';
        document.getElementById('status-banner').innerHTML = `<span class="ai-thinking">🧠 ${difficulty === 'hard' ? t('ai_thinking_hard') : t('ai_thinking_easy')}</span>`;

        // 核心修正：明確告知 AI 誰才是它的手牌
        const aiHand = game.turn === 'BLACK' ? game.blackHand : game.whiteHand;
        const oppHand = game.turn === 'BLACK' ? game.whiteHand : game.blackHand;

        if (aiTimeoutToken) clearTimeout(aiTimeoutToken);
        aiTimeoutToken = scheduleGameTask(() => {
          if (!isAITurn() || game.state !== 'PLAYING') return;
          if (isRace2Mode()) {
            const ended = MathDuelRuleModes.applyPassPoint(game);
            if (!ended) game.turn = game.turn === 'BLACK' ? 'WHITE' : 'BLACK';
            aiRequestPending = false;
            saveState(); render(); checkAITurn();
            return;
          }
          giveUp();
        }, 5500);

        if (!worker) resetAiWorker();
        workerAwaitingReply = true;
        worker.postMessage({
          difficulty,
          aiSide: game.aiSide,
          aiColor: game.aiColor,
          playerColor: game.playerColor,
          aiHand,
          opponentHand: oppHand,
          centerCards: game.center,
          ruleMode: game.ruleMode,
          scores: game.scores || { BLACK: 0, WHITE: 0 },
          winScore: game.winScore || 2
        });
      }
    }

    function handleAiWorkerMessage(e, sourceWorker) {
      if (sourceWorker !== worker || !workerAwaitingReply) return;
      workerAwaitingReply = false;
      if (aiTimeoutToken) { clearTimeout(aiTimeoutToken); aiTimeoutToken = null; }
      if (!isAITurn() || game.state !== 'PLAYING') return;
      const move = e.data;
      if (!move) {
        scheduleGameTask(() => {
          if (isRace2Mode() && isAITurn() && game.state === 'PLAYING') {
            const ended = MathDuelRuleModes.applyPassPoint(game);
            if (!ended) game.turn = game.turn === 'BLACK' ? 'WHITE' : 'BLACK';
            aiRequestPending = false;
            saveState(); render(); checkAITurn();
            return;
          }
          giveUp();
        }, 1500);
        return;
      }
      scheduleGameTask(() => revealAiMove(move), 350);
    }

    function resetAiWorker() {
      worker?.terminate();
      const nextWorker = new Worker(`ai-worker.js?v=${APP_VERSION}`);
      worker = nextWorker;
      workerAwaitingReply = false;
      nextWorker.onmessage = event => handleAiWorkerMessage(event, nextWorker);
      nextWorker.onerror = () => handleAiWorkerError(nextWorker);
    }

    async function resumeAiPlan(plannedGame) {
      if (tutorialSession) {
        if (!(await waitForTutorial('before-exchange'))) return;
      } else if (!CardMotion.prefersReducedMotion(document) && !(await waitForAiPlan(1100))) return;
      if (game !== plannedGame || !(await waitForGameDialog(plannedGame)) || game !== plannedGame) return;
      handleMainAction();
    }

    async function revealAiMove(move) {
      if (!isAITurn() || game.state !== 'PLAYING') return;
      const plannedGame = game;
      if (!(await waitForGameDialog(plannedGame)) || game !== plannedGame) return;

      const aiInfo = move.eq ? {
        eq: move.eq,
        cardsA: move.cardsA,
        cardsB: move.cardsB,
        witness: move.witness || null,
        discard: move.discard || []
      } : null;
      const moves = [
        ...move.hand.map(id => ({ id, destination: 'stage-hand' })),
        ...move.center.map(id => ({ id, destination: 'stage-center' }))
      ];

      game.uiBusy = true;
      render();
      let committed = false;
      const commitPlan = () => {
        if (game !== plannedGame) return;
        game.selections.hand = [...move.hand];
        game.selections.center = [...move.center];
        game.selections.operator = move.op;
        game.aiMoveInfo = aiInfo;
        committed = true;
        emitGuideEvent({ type: 'selection.changed', actor: game.turn });
        render();
      };

      try {
        await CardMotion.playExchange({
          moves,
          find: cardId => game === plannedGame ? findActiveGameCard(cardId) : null,
          commit: commitPlan,
          options: { duration: 560, stagger: 70 }
        });
      } catch (error) {
        if (game !== plannedGame) return;
        console.error('AI card reveal animation failed:', error);
        if (!committed) commitPlan();
      }

      if (game !== plannedGame) return;
      game.uiBusy = false;
      saveState();
      render();
      await resumeAiPlan(plannedGame);
    }

    function handleAiWorkerError(sourceWorker) {
      if (sourceWorker !== worker) return;
      workerAwaitingReply = false;
      if (aiTimeoutToken) { clearTimeout(aiTimeoutToken); aiTimeoutToken = null; }
      if (isAITurn() && game.state === 'PLAYING') {
        scheduleGameTask(() => {
          if (isRace2Mode()) {
            const ended = MathDuelRuleModes.applyPassPoint(game);
            if (!ended) game.turn = game.turn === 'BLACK' ? 'WHITE' : 'BLACK';
            aiRequestPending = false;
            saveState(); render(); checkAITurn();
          } else {
            giveUp();
          }
        }, 600);
      }
    }

    function giveUp() {
      if (game.turn === 'BLACK' || game.mode === 'PVP') if (!confirm(t('giveup_confirm'))) return;
      game.winner = game.turn === 'BLACK' ? 'WHITE' : 'BLACK';
      game.state = 'GAMEOVER';
      stopTutorial('cancel', false);
      aiRequestPending = false;
      saveState(); render();
    }

     function generateCardHTML(card, location, isNew = false, displayValue = card.val) {
       const isBlack = card.color === 'b';
       const isStage = location === 'stage-hand' || location === 'stage-center';
       const isHistory = location === 'history-hand' || location === 'history-center';
       const isTransformed = Number(displayValue) !== Number(card.val);
       const selectionLocation = location === 'stage-center' || location === 'center' ? 'center' : 'hand';
       const isStageSelectable = isStage && game.state === 'PLAYING' && !game.uiBusy && !isAITurn();
       const isSelectable = !tutorialGate && ((game.state === 'PLAYING' && !game.uiBusy && (location === 'center' || (game.turn === 'BLACK' && location === 'black') || (game.turn === 'WHITE' && location === 'white'))) ||
         (game.state === 'DISCARDING' && !game.uiBusy && location === 'center') || isStageSelectable);
       const isSelected = isStage || (!isHistory && (game.state === 'PLAYING' ? (game.selections.hand.includes(card.id) || game.selections.center.includes(card.id)) :
         (game.state === 'DISCARDING' ? game.discardSelections.includes(card.id) : false)));

       const baseClasses = `w-12 h-16 flex items-center justify-center text-2xl font-bold font-mono rounded-lg border-2 shadow-sm transition-all select-none ${isNew ? 'card-pop' : ''}`;
       const colorClasses = isBlack ? "bg-slate-800 text-white border-slate-900" : "bg-white text-slate-800 border-slate-300";
       let interactiveClasses = "opacity-60";

       if (isHistory) interactiveClasses = "opacity-100";
       else if (isStage) interactiveClasses = isSelectable ? "ring-2 ring-blue-400 opacity-100 cursor-pointer hover:-translate-y-1" : "ring-2 ring-blue-200 opacity-100";
       else if (isAITurn() && location !== 'center' && !isSelected) interactiveClasses = "opacity-40";
       else if (isSelectable) interactiveClasses = isSelected ? "ring-4 ring-blue-500 scale-105 opacity-100 cursor-pointer" : "cursor-pointer hover:-translate-y-1 opacity-100";
       else if (isSelected) interactiveClasses = "opacity-100 ring-2 ring-slate-400";

       const valueMarkup = `<span class="card-face-number${isTransformed ? ' is-transformed' : ''}" data-original-value="${escapeHtml(card.val)}" data-effective-value="${escapeHtml(displayValue)}">${escapeHtml(displayValue)}</span>`;
       return `<div data-card-id="${escapeHtml(card.id)}" class="${baseClasses} ${colorClasses} ${interactiveClasses}" data-effective-value="${escapeHtml(displayValue)}" onclick="${isSelectable ? `toggleSelect('${card.id}', '${selectionLocation}')` : ''}">${valueMarkup}</div>`;
     }

     function generateHandHTML(hand, location) {
       const selectedIds = new Set(game.selections.hand);
       return hand.map((card) => selectedIds.has(card.id)
         ? `<span class="hand-card-slot is-empty" aria-hidden="true"></span>`
         : generateCardHTML(card, location)).join('');
     }

     function getCurrentSelection() {
       const activeHand = game.turn === 'BLACK' ? game.blackHand : game.whiteHand;
       const selectedHand = activeHand.filter(c => game.selections.hand.includes(c.id));
       const selectedCenter = game.center.filter(c => game.selections.center.includes(c.id));
       const operator = game.selections.operator;
       const equation = operator && selectedHand.length >= 2 && selectedHand.length <= 4 && selectedCenter.length >= 1 && selectedCenter.length <= 2
         ? checkEquation(selectedHand, operator, selectedCenter)
         : null;
       return { selectedHand, selectedCenter, operator, equation };
     }

     function renderStageOperand(operand, location) {
       if (!operand?.cards?.length) return '';
       const digits = operand.digits || operand.cards.map(card => card.val);
       const cards = operand.cards.map((card, index) => generateCardHTML(card, location, false, digits[index])).join('');
       return `<div class="operand-group is-revealed" data-value="${escapeHtml(operand.display || operand.value)}">${cards}</div>`;
     }

      function getEquationZone(side) {
        return document.querySelector(`#${side.toLowerCase()}-equation`);
      }

      function clearEquationZone(zone) {
        if (!zone) return;
        const handArea = zone.querySelector('[data-role="stage-hand-cards"]');
        const centerArea = zone.querySelector('[data-role="stage-center-cards"]');
        const handSlot = zone.querySelector('[data-role="stage-hand-slot"]');
        const centerSlot = zone.querySelector('[data-role="stage-center-slot"]');
        const operator = zone.querySelector('[data-role="stage-operator-symbol"]');
        const preview = zone.querySelector('[data-role="move-preview"]');
        if (handArea) { handArea.className = 'play-stage-cards'; handArea.innerHTML = ''; }
        if (centerArea) { centerArea.className = 'play-stage-cards'; centerArea.innerHTML = ''; }
        if (handSlot) handSlot.classList.remove('is-active');
        if (centerSlot) centerSlot.classList.remove('is-active');
        if (operator) operator.innerText = '=';
        if (preview) { preview.className = 'hidden operation-result'; preview.innerHTML = ''; }
        zone.classList.remove('is-working');
      }

      function renderEquationWitness(zone, witness, interactive = true) {
        if (!zone || !witness?.left?.cards?.length || !witness?.right?.cards?.length || !witness?.target?.cards?.length) return;
        const handArea = zone.querySelector('[data-role="stage-hand-cards"]');
        const centerArea = zone.querySelector('[data-role="stage-center-cards"]');
        const handSlot = zone.querySelector('[data-role="stage-hand-slot"]');
        const centerSlot = zone.querySelector('[data-role="stage-center-slot"]');
        const operator = zone.querySelector('[data-role="stage-operator-symbol"]');
        if (!handArea || !centerArea || !handSlot || !centerSlot || !operator) return;
        const handLocation = interactive ? 'stage-hand' : 'history-hand';
        const centerLocation = interactive ? 'stage-center' : 'history-center';
        handArea.className = 'play-stage-cards is-expression';
        centerArea.className = 'play-stage-cards is-expression';
        handArea.innerHTML = `${renderStageOperand(witness.left, handLocation)}<span class="operand-divider">${escapeHtml(witness.operator)}</span>${renderStageOperand(witness.right, handLocation)}`;
        centerArea.innerHTML = renderStageOperand(witness.target, centerLocation);
        operator.innerText = '=';
        handSlot.classList.add('is-active');
        centerSlot.classList.add('is-active');
        zone.classList.add('is-working');
      }

      function renderStage() {
        const activeZone = getEquationZone(game.turn);
        document.querySelectorAll('.equation-zone').forEach(clearEquationZone);
        if (!activeZone) return;

        const { selectedHand, selectedCenter, equation } = getCurrentSelection();
        const witness = game.movePreview?.witness || (equation?.success ? equation : null) || game.aiMoveInfo?.witness;
        if (witness?.success) {
          renderEquationWitness(activeZone, witness, true);
          return;
        }

        const handArea = activeZone.querySelector('[data-role="stage-hand-cards"]');
        const centerArea = activeZone.querySelector('[data-role="stage-center-cards"]');
        const handSlot = activeZone.querySelector('[data-role="stage-hand-slot"]');
        const centerSlot = activeZone.querySelector('[data-role="stage-center-slot"]');
        const operator = activeZone.querySelector('[data-role="stage-operator-symbol"]');
        if (!handArea || !centerArea || !handSlot || !centerSlot || !operator) return;
        handArea.className = 'play-stage-cards';
        centerArea.className = 'play-stage-cards';
        handArea.innerHTML = selectedHand.map(c => generateCardHTML(c, 'stage-hand')).join('');
        centerArea.innerHTML = selectedCenter.map(c => generateCardHTML(c, 'stage-center')).join('');
        operator.innerText = game.selections.operator ? game.selections.operator : '?';
        handSlot.classList.toggle('is-active', selectedHand.length > 0);
        centerSlot.classList.toggle('is-active', selectedCenter.length > 0);
        activeZone.classList.toggle('is-working', selectedHand.length > 0 || selectedCenter.length > 0);
      }

     function renderMovePreview() {
        const area = getEquationZone(game.turn)?.querySelector('[data-role="move-preview"]');
       if (!area) return;

       const preview = game.movePreview;
       const aiPlan = game.aiMoveInfo;
       let eq = preview?.eq || aiPlan?.eq || null;
       let witness = preview?.witness || aiPlan?.witness || null;
       const mode = preview ? 'resolving' : (aiPlan ? 'ai-plan' : 'selection');

       if (!preview && !aiPlan && game.state === 'PLAYING') {
         const result = getCurrentSelection().equation;
         if (result?.success) {
           witness = result;
           eq = result.eq;
         }
       }

       if (!witness && !eq) {
         area.className = 'hidden';
         area.innerHTML = '';
         return;
       }

       const formula = witness?.eq || eq;
       const tone = mode === 'resolving' ? 'is-resolving' : '';
       area.className = `block operation-result ${tone} text-center mt-1`;
       area.innerHTML = `<div class="equation-line" data-equation="${escapeHtml(formula)}" aria-label="${escapeHtml(formula)}">${escapeHtml(formula)}</div>`;
     }

     function canSendCurrentSelection() {
       const { equation } = getCurrentSelection();
       return game.state === 'PLAYING' && !game.uiBusy && !isAITurn() && Boolean(equation?.success);
     }

     let lastRenderState = { white: '', black: '', center: '', title: '', lang: '' };
     let lastViewTurnKey = null;
     let viewTurnTimer = null;

     function syncViewOrientation() {
       const isPvp = game.mode === 'PVP';
       const nextKey = isPvp ? game.turn : 'SOLO';
       const shouldAnimate = lastViewTurnKey !== null && lastViewTurnKey !== nextKey;

       document.body.classList.toggle('is-pvp', isPvp);
       document.body.classList.toggle('is-white-turn', isPvp && game.turn === 'WHITE');

       if (shouldAnimate) {
         if (viewTurnTimer) clearTimeout(viewTurnTimer);
         document.body.classList.add('is-turning');
         document.body.setAttribute('aria-busy', 'true');
         const duration = CardMotion.prefersReducedMotion(document) ? 0 : 520;
         viewTurnTimer = setTimeout(() => {
           document.body.classList.remove('is-turning');
           document.body.removeAttribute('aria-busy');
           viewTurnTimer = null;
         }, duration);
       }

       lastViewTurnKey = nextKey;
     }

    function getPlayerTurnStatus(side) {
      const isAiMode = game.mode.startsWith('AI');
      const isAiSide = isAiMode && game.aiSide === side;
      const isHumanSide = isAiMode && game.playerColor === (side === 'BLACK' ? 'b' : 'w');

      if (game.state === 'GAMEOVER') {
        return game.winner === side
          ? (LANG === 'zh' ? '勝利' : 'Won')
          : (LANG === 'zh' ? '對局結束' : 'Game over');
      }
      if (game.state === 'ANIMATING') {
        return game.movePreview?.actor === 'AI'
          ? (isAiSide ? (LANG === 'zh' ? 'AI 行動中' : 'AI resolving') : t('turn_wait'))
          : (isHumanSide || (!isAiMode && game.turn === side) ? (LANG === 'zh' ? '行動結算中' : 'Resolving') : t('turn_wait'));
      }
      if (game.state === 'DISCARDING') {
        return game.turn === side
          ? (isAiSide ? (LANG === 'zh' ? 'AI 整理中' : 'AI arranging') : (LANG === 'zh' ? '請選擇棄牌' : 'Choose discards'))
          : t('turn_wait');
      }
      if (isAiMode) {
        if (game.turn === side) return isAiSide ? (game.aiMoveInfo ? t('ai_plan') : t('turn_ai')) : t('turn_you');
        return isAiSide ? t('turn_wait') : (LANG === 'zh' ? '等待 AI' : 'Waiting for AI');
      }
      return game.turn === side ? t('turn_you') : t('turn_opponent');
    }

    function updatePlayerTurnStatuses() {
      [['WHITE', 'white-turn-status'], ['BLACK', 'black-turn-status']].forEach(([side, id]) => {
        if (side === 'BLACK' && (tutorialSession || completedLesson)) return;
        const status = document.getElementById(id);
        if (!status) return;
        const isCurrent = game.state !== 'GAMEOVER' && game.turn === side;
        status.innerText = getPlayerTurnStatus(side);
        status.className = `player-turn-status ${isCurrent ? 'is-current' : ''}`;
        const hint = document.getElementById(`${side.toLowerCase()}-play-hint`);
        const showHint = game.state === 'PLAYING' && game.turn === side && !isAITurn();
        hint.classList.toggle('is-visible', showHint);
        hint.setAttribute('aria-hidden', String(!showHint));
        for (const part of ['select', 'arrange']) {
          const line = hint.querySelector(`[data-hint="${part}"]`);
          const text = t(`play_hint_${part}`);
          if (line.textContent !== text) line.textContent = text;
        }
      });
    }

    function render() {
      syncViewOrientation();
      document.body.dataset.gameState = game.state;
      // 1. 靜態 UI 更新 (僅在必要時)
      const titleStr = t('title');
      if (lastRenderState.title !== titleStr || lastRenderState.lang !== LANG) {
        document.title = titleStr; // 更新瀏覽器分頁標題
        document.getElementById('ui-title').innerText = titleStr;
        document.getElementById('ui-lang-indicator').innerText = LANG === 'zh' ? 'EN' : '中';
        const utilityLangLabel = document.getElementById('utility-lang-label');
        if (utilityLangLabel) utilityLangLabel.innerText = LANG === 'zh' ? 'EN' : '中';
        document.querySelector('#mode-select option[value="PVP"]').innerText = t('mode_pvp');
        document.querySelector('#mode-select option[value="AI_EASY"]').innerText = t('mode_ai_easy');
        document.querySelector('#mode-select option[value="AI_HARD"]').innerText = t('mode_ai_hard');
        document.querySelector('#rule-mode-select option[value="CLASSIC"]').innerText = LANG === 'zh' ? '基本模式' : 'Classic';
        document.querySelector('#rule-mode-select option[value="RACE2"]').innerText = LANG === 'zh' ? '搶 2 分' : 'Race to 2';
         document.getElementById('ui-center-label').innerText = LANG === 'zh' ? '場牌' : 'TABLE';
         if (typeof lucide !== 'undefined') lucide.createIcons();
        lastRenderState.title = titleStr;
        lastRenderState.lang = LANG;
      }

      // 2. 卡牌區域智慧更新
      const selectedCenterIds = new Set(game.selections.center);
      const whiteHTML = generateHandHTML(game.whiteHand, 'white');
      const blackHTML = generateHandHTML(game.blackHand, 'black');
      // 場中央也同步使用智慧更新，消除閃爍
      const centerHTML = game.center.filter(c => !selectedCenterIds.has(c.id)).map(c => generateCardHTML(c, 'center', false)).join('');

      if (lastRenderState.white !== whiteHTML) {
        document.getElementById('white-hand').innerHTML = whiteHTML;
        lastRenderState.white = whiteHTML;
      }
      if (lastRenderState.black !== blackHTML) {
        document.getElementById('black-hand').innerHTML = blackHTML;
        lastRenderState.black = blackHTML;
      }
      if (lastRenderState.center !== centerHTML) {
        document.getElementById('center-cards').innerHTML = centerHTML;
        lastRenderState.center = centerHTML;
      }
      renderStage();

      // 3. 標籤與 Banner 更新 (僅在文字改變時)
      const whiteLabel = game.mode.startsWith('AI') ? (game.aiSide === 'WHITE' ? t('white_hand_ai') : t('white_hand')) : t('white_hand');
      const blackLabel = game.mode.startsWith('AI') ? (game.aiSide === 'BLACK' ? (LANG === 'zh' ? '黑方手牌 (AI)' : 'Black Hand (AI)') : t('black_hand_you')) : t('black_hand');

      if (document.getElementById('white-label').innerText !== whiteLabel) document.getElementById('white-label').innerText = whiteLabel;
      if (document.getElementById('black-label').innerText !== blackLabel) document.getElementById('black-label').innerText = blackLabel;
      updatePlayerTurnStatuses();
      const whiteScore = document.getElementById('white-score');
      const blackScore = document.getElementById('black-score');
      const showRaceScores = isRace2Mode();
      [whiteScore, blackScore].forEach(score => score?.classList.toggle('hidden', !showRaceScores));
      if (showRaceScores) {
        whiteScore.innerText = LANG === 'zh' ? `白 ${game.scores.WHITE}` : `W ${game.scores.WHITE}`;
        blackScore.innerText = LANG === 'zh' ? `黑 ${game.scores.BLACK}` : `B ${game.scores.BLACK}`;
      }
      document.getElementById('rule-mode-select').value = game.ruleMode;

      const utilityMode = document.querySelector('[data-role="utility-mode"]');
      const utilityRule = document.querySelector('[data-role="utility-rule"]');
      if (utilityMode) {
        const modeLabel = LANG === 'zh'
          ? (game.mode === 'PVP' ? '雙人' : game.mode === 'AI_HARD' ? '大師' : '新手')
          : (game.mode === 'PVP' ? 'PVP' : game.mode === 'AI_HARD' ? 'Hard' : 'Easy');
        utilityMode.querySelector('[data-role="utility-label"]').innerText = modeLabel;
        utilityMode.title = `${LANG === 'zh' ? '模式' : 'Mode'}: ${modeLabel}`;
        utilityMode.setAttribute('aria-label', utilityMode.title);
      }
      if (utilityRule) {
        const ruleLabel = LANG === 'zh' ? (game.ruleMode === 'RACE2' ? '搶 2' : '基本') : (game.ruleMode === 'RACE2' ? 'Race 2' : 'Basic');
        utilityRule.querySelector('[data-role="utility-label"]').innerText = ruleLabel;
        utilityRule.title = `${LANG === 'zh' ? '規則' : 'Rules'}: ${ruleLabel}`;
        utilityRule.setAttribute('aria-label', utilityRule.title);
      }
      const utilityModeMenu = document.getElementById('utility-mode-menu');
      if (utilityModeMenu) {
        utilityModeMenu.querySelector('[data-mode="PVP"]').innerText = t('mode_pvp');
        utilityModeMenu.querySelector('[data-mode="AI_EASY"]').innerText = t('mode_ai_easy');
        utilityModeMenu.querySelector('[data-mode="AI_HARD"]').innerText = t('mode_ai_hard');
        utilityModeMenu.querySelectorAll('[data-mode]').forEach(option => {
          const isSelected = option.dataset.mode === game.mode;
          option.classList.toggle('is-selected', isSelected);
          option.setAttribute('aria-checked', String(isSelected));
        });
      }
      const utilityRuleMenu = document.getElementById('utility-rule-menu');
      if (utilityRuleMenu) {
        utilityRuleMenu.querySelector('[data-rule-mode="CLASSIC"]').innerText = LANG === 'zh' ? '基本模式' : 'Classic';
        utilityRuleMenu.querySelector('[data-rule-mode="RACE2"]').innerText = LANG === 'zh' ? '搶 2 分' : 'Race to 2';
        utilityRuleMenu.querySelectorAll('[data-rule-mode]').forEach(option => {
          const isSelected = option.dataset.ruleMode === game.ruleMode;
          option.classList.toggle('is-selected', isSelected);
          option.setAttribute('aria-checked', String(isSelected));
        });
      }

      document.getElementById('white-area').className = `bg-white rounded-2xl p-4 border-2 shadow-sm transition-colors ${game.turn === 'WHITE' && game.state !== 'GAMEOVER' ? 'border-blue-500 bg-blue-50' : 'border-transparent'}`;
      document.getElementById('black-area').className = `bg-white rounded-2xl p-4 border-2 shadow-sm transition-colors mb-4 ${game.turn === 'BLACK' && game.state !== 'GAMEOVER' ? 'border-blue-500 bg-blue-50' : 'border-transparent'}`;

      document.querySelectorAll('.op-btn').forEach(btn => {
        const isActiveZone = btn.closest('.action-zone')?.dataset.side === game.turn;
        const isSel = isActiveZone && game.selections.operator === btn.dataset.op;
        const isDisabled = game.state !== 'PLAYING' || isAITurn() || game.uiBusy || btn.closest('.action-zone')?.dataset.side !== game.turn;

        // 基礎樣式
        let classes = `op-btn w-12 h-12 rounded-lg border text-xl font-bold transition-all duration-200 flex items-center justify-center `;

        // 選中狀態顏色
        if (isSel) {
          classes += `bg-blue-600 text-white border-blue-700 shadow-lg scale-110 z-10 `;
        } else {
          classes += `bg-slate-100 text-slate-700 border-slate-200 `;
        }

        // 鎖定/啟用狀態與透明度處理
        if (isDisabled) {
          // 如果選中了，保持較高透明度 (0.9)；未選中才變淡 (0.3)
          classes += (isSel ? "opacity-90 " : "opacity-30 ") + "cursor-not-allowed ";
        } else {
          classes += "cursor-pointer active:scale-95 ";
          // 僅在未選中時套用 hover 效果
          if (!isSel) classes += "hover:bg-slate-200 hover:border-slate-300 ";
        }

        btn.className = classes;
        btn.disabled = isDisabled;
      });

      const sb = document.getElementById('status-banner');
      const actionZones = [...document.querySelectorAll('.action-zone')];
      const activeActions = document.querySelector(`#${game.turn.toLowerCase()}-actions`);
      const mb = activeActions?.querySelector('[data-role="main-btn"]');
      const pc = activeActions?.querySelector('[data-role="plan-continue-btn"]');
      const gb = activeActions?.querySelector('[data-role="giveup-btn"]');
      const passBtn = activeActions?.querySelector('[data-role="pass-btn"]');
      const og = activeActions?.querySelector('[data-role="operator-group"]');
      if (!mb || !pc || !gb || !passBtn || !og) return;
      actionZones.forEach(zone => {
        zone.classList.toggle('is-active', zone === activeActions);
        zone.querySelectorAll('[data-role="main-btn"], [data-role="plan-continue-btn"], [data-role="giveup-btn"], [data-role="pass-btn"]').forEach(button => {
          button.disabled = zone !== activeActions;
        });
      });
      mb.disabled = false;
      pc.classList.add('hidden');
       if (game.state === 'GAMEOVER') {
         let winnerName;
        if (game.mode.startsWith('AI')) {
          if (game.winner === game.aiSide) winnerName = '🤖 AI';
          else winnerName = (LANG === 'zh' ? '🎉 你' : '🎉 You');
        } else {
          winnerName = game.winner === 'BLACK' ? (LANG === 'zh' ? '黑方' : 'Black') : (LANG === 'zh' ? '白方' : 'White');
        }
        sb.className = "bg-amber-100 text-amber-800 p-3 rounded-xl text-center font-bold shadow-sm border border-amber-200";
        sb.innerHTML = t('game_over') + winnerName + t('win_suffix');
         mb.innerText = t('play_again'); mb.className = "w-full bg-slate-800 text-white py-3 rounded-xl font-bold shadow-md active:scale-[0.98]";
         mb.disabled = false;
         gb.classList.add('hidden'); og.classList.add('hidden');
       } else if (game.state === 'ANIMATING') {
         const actorLabel = game.movePreview?.actor === 'AI' ? '🤖 AI' : (LANG === 'zh' ? '⌛ 你' : '⌛ You');
         sb.className = "bg-violet-100 text-violet-800 p-3 rounded-xl text-center font-bold shadow-sm border border-violet-200";
         sb.innerHTML = `${actorLabel} ${t('move_resolving')}`;
         mb.disabled = true;
         mb.className = "hidden";
         gb.classList.add('hidden'); og.classList.add('hidden');
       } else if (game.state === 'DISCARDING') {
        sb.className = "bg-rose-100 text-rose-800 p-3 rounded-xl text-center font-bold shadow-sm border border-rose-200";
        sb.innerHTML = isAITurn() ? t('ai_discarding') : t('discard_hint');
        mb.innerText = `${t('confirm_keep')} (${game.discardSelections.length}/2)`;
        mb.className = `w-full py-3 rounded-xl font-bold shadow-md ${game.discardSelections.length === 2 ? 'bg-rose-600 text-white active:scale-[0.98]' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`;
        mb.disabled = game.discardSelections.length !== 2 || isAITurn();
        if (isAITurn()) mb.className += " hidden";
        gb.classList.add('hidden'); og.classList.add('hidden');
      } else {
        let pName;
        if (game.mode.startsWith('AI')) {
          pName = game.turn === game.aiSide ? (game.mode === 'AI_HARD' ? t('mode_ai_hard') : t('mode_ai_easy')) : (LANG === 'zh' ? '你' : 'You');
        } else {
          pName = game.turn === 'BLACK' ? (LANG === 'zh' ? '黑方' : 'Black') : (LANG === 'zh' ? '白方' : 'White');
        }
        sb.className = "bg-blue-100 text-blue-800 p-3 rounded-xl text-center font-bold shadow-sm border border-blue-200";
         if (isAITurn() && game.aiMoveInfo) {
           sb.innerHTML = `🤖 ${t('ai_plan')}`;
         } else if (!isAITurn() || !sb.innerHTML.includes(t('ai_thinking_easy').slice(0, 4))) {
           sb.innerHTML = `${t('turn_label')}<span class="text-xl mx-1">${pName}</span>`;
         }
        const canSend = canSendCurrentSelection();
        mb.innerText = isAITurn() ? t('ai_thinking_btn') : t('send_eq');
        mb.disabled = !canSend;
        mb.className = `w-full py-3 rounded-xl font-bold shadow-md ${(isAITurn() || game.uiBusy) ? 'bg-slate-300 text-slate-500 cursor-not-allowed hidden' : canSend ? 'bg-blue-600 text-white active:scale-[0.98]' : 'bg-slate-200 text-slate-500 cursor-not-allowed'}`;
        if (isAITurn() || game.uiBusy) gb.classList.add('hidden'); else gb.classList.remove('hidden');
        if (isAITurn() || game.uiBusy) og.classList.add('opacity-60'); else og.classList.remove('opacity-60');
        og.classList.remove('hidden');
        gb.innerText = t('give_up');
        if (isAITurn() && game.aiMoveInfo && !game.uiBusy) {
          pc.innerText = '▶';
          pc.title = t('continue_ai');
          pc.setAttribute('aria-label', t('continue_ai'));
          pc.classList.remove('hidden');
        }
      }
      actionZones.filter(zone => zone !== activeActions).forEach(zone => {
        ['main-btn', 'plan-continue-btn', 'giveup-btn', 'pass-btn'].forEach(role => {
          const source = activeActions.querySelector(`[data-role="${role}"]`);
          const target = zone.querySelector(`[data-role="${role}"]`);
          if (!source || !target) return;
          target.innerText = source.innerText;
          const isHidden = source.classList.contains('hidden');
          target.className = isHidden
            ? 'hidden'
            : role === 'giveup-btn'
              ? 'w-full py-3 rounded-xl font-semibold border bg-slate-100 text-slate-400 border-slate-200 cursor-not-allowed'
              : 'w-full py-3 rounded-xl font-bold shadow-md bg-slate-200 text-slate-500 cursor-not-allowed';
          target.title = source.title;
          target.setAttribute('aria-label', source.getAttribute('aria-label') || '');
          target.disabled = true;
        });
      });
      // 渲染歷史紀錄
      const scoreboard = document.getElementById('race2-scoreboard');
      if (isRace2Mode()) {
        scoreboard.classList.remove('hidden');
        scoreboard.innerText = LANG === 'zh'
          ? `搶 2 分 | 黑方 ${game.scores.BLACK} : ${game.scores.WHITE} 白方`
          : `Race to 2 | Black ${game.scores.BLACK} : ${game.scores.WHITE} White`;
        const canPass = game.state === 'PLAYING' && !isAITurn();
        const opponent = game.turn === 'BLACK' ? 'WHITE' : 'BLACK';
        const opponentScore = game.scores[opponent];
        const passWouldLose = opponentScore >= (game.winScore - 1);
        passBtn.classList.add('hidden');
        if (game.state === 'PLAYING') {
          gb.onclick = passTurn;
          gb.innerText = passWouldLose
            ? (LANG === 'zh' ? '無法湊出（對手直接獲勝）' : 'No Move (Opponent wins)')
            : (LANG === 'zh' ? '無法湊出（對手得 1 分）' : 'No Move (Opponent +1)');
          gb.className = `w-full mt-1 py-2 rounded-xl font-semibold border ${canPass
            ? (passWouldLose ? 'bg-rose-50 text-rose-700 border-rose-200' : 'bg-amber-50 text-amber-700 border-amber-200')
            : 'bg-slate-200 text-slate-500 border-slate-300 cursor-not-allowed'}`;
        } else {
          gb.classList.add('hidden');
        }
      } else {
        scoreboard.classList.add('hidden');
        passBtn.classList.add('hidden');
        gb.onclick = giveUp;
      }
       renderMovePreview();
       renderHistory();
       renderTutorial();
    }

    function renderTutorial() {
      const active = Boolean(tutorialSession);
      document.body.classList.toggle('is-tutorial', active);
      document.body.classList.toggle('is-lesson-complete', completedLesson);
      document.querySelectorAll('[data-tutorial-focus]').forEach(element => element.removeAttribute('data-tutorial-focus'));
      document.querySelectorAll('.action-zone').forEach(zone => zone.classList.remove('is-guide-control'));
      document.querySelectorAll('[data-role="guide-back-btn"]').forEach(button => { button.hidden = true; });
      document.querySelectorAll('.is-guide-help').forEach(button => { button.classList.remove('is-guide-help'); button.removeAttribute('aria-label'); button.title = ''; });
      document.querySelectorAll('[data-guide-action]').forEach(button => { button.removeAttribute('data-guide-action'); button.removeAttribute('aria-label'); button.title = ''; });
      const hint = document.getElementById('black-play-hint');
      hint.classList.toggle('is-guidance', active || completedLesson);
      const opening = active && tutorialSession.state.checkpoint?.key === 'opening';
      hint.classList.toggle('is-guide-intro', opening);
      document.getElementById('mode-select').value = game.mode;
      document.getElementById('rule-mode-select').value = game.ruleMode;
      refreshDialogText();
      const helpButton = document.querySelector('.utility-rules');
      helpButton.setAttribute('aria-label', t(active ? 'tutorial_menu' : 'rules_title'));
      helpButton.title = t(active ? 'tutorial_menu' : 'rules_title');
      const resetButton = document.querySelector('.utility-reset');
      const resetLabel = active ? t('tutorial_retry') : (LANG === 'zh' ? '重新開始' : 'Restart');
      resetButton.setAttribute('aria-label', resetLabel);
      resetButton.title = resetLabel;
      if (!active) {
        tutorialSpotlight?.clear();
        document.body.removeAttribute('data-tutorial-step');
        document.body.removeAttribute('data-tutorial-checkpoint');
        if (!completedLesson) { document.body.removeAttribute('data-tutorial-phase'); return; }
      } else {
        document.querySelector('[data-role="utility-mode"] [data-role="utility-label"]').textContent = t('tutorial_practice');
        document.body.dataset.tutorialStep = `move-${tutorialSession.state.stepIndex + 1}`;
        const checkpoint = tutorialSession.state.checkpoint;
        if (checkpoint) document.body.dataset.tutorialCheckpoint = `${checkpoint.key}:${checkpoint.index}`;
        else document.body.removeAttribute('data-tutorial-checkpoint');
      }
      const guidance = completedLesson ? { hint: 'complete', detail: 'completeDetail', hintKind: 'result', detailKind: 'description', focus: [{ area: 'hand-area', side: 'BLACK' }], mode: 'observe' }
        : tutorialSession.state.checkpoint ? tutorialSession.view
        : MathDuelTutorial.getGuidance(tutorialSession.state.stepIndex, { game, help: tutorialSession.help, rejected: tutorialSession.rejected, notice: tutorialSession.notice });
      const phase = completedLesson ? 'complete' : opening ? 'intro' : tutorialGate?.key === 'after-player-exchange' ? 'review' :
        game.state === 'ANIMATING' || (game.state === 'DISCARDING' && game.uiBusy) ? 'resolving' :
        isAITurn() ? 'watch' : game.state === 'DISCARDING' ? 'keep' : 'play';
      document.body.dataset.tutorialPhase = phase;
      const status = document.getElementById('black-turn-status');
      if (status.textContent !== t(`tutorial_status_${phase}`)) status.textContent = t(`tutorial_status_${phase}`);
      status.className = 'player-turn-status is-current';
      const progress = document.getElementById('black-score');
      const progressText = `${completedLesson ? 5 : guidance.actionNumber || tutorialSession.state.stepIndex + 1}/5`;
      if (progress.textContent !== progressText) progress.textContent = progressText;
      progress.classList.remove('hidden');
      hint.classList.add('is-visible');
      hint.setAttribute('aria-hidden', 'false');
      for (const [part, key] of [['select', 'hint'], ['arrange', 'detail']]) {
        const line = hint.querySelector(`[data-hint="${part}"]`);
        const text = MathDuelTutorial.text(guidance[key], LANG, guidance.values);
        if (line.textContent !== text) line.textContent = text;
        const category = hint.querySelector(`[data-hint-label="${part}"]`);
        const label = MathDuelTutorial.label(guidance[`${key}Kind`], LANG);
        if (category.textContent !== label) category.textContent = label;
        category.dataset.kind = guidance[`${key}Kind`] || '';
      }
      const targets = [];
      const context = game.aiMoveInfo || game.movePreview || game.selections.hand.length || game.selections.center.length
        ? [getEquationZone(game.turn)?.querySelector('.play-stage-grid')] : [];
      context.push(document.querySelector('#black-area .player-area-header'));
      function resolveTarget(target) {
        const elements = [];
        const side = target.side.toLowerCase();
        const mark = element => { if (element) elements.push(element); };
        if (target.area === 'hand') target.cardIds.forEach(id => mark(findCardIn(`#${side}-hand`, id)));
        if (target.area === 'hand-area') mark(document.getElementById(`${side}-hand`));
        if (target.area === 'center') target.cardIds.forEach(id => mark(findCardIn('#center-cards', id)));
        if (target.area === 'center-area') mark(document.getElementById('center-cards'));
        if (target.area === 'operator') mark(document.querySelector(`#${side}-actions [data-op="${target.operator}"]`));
        if (target.area === 'send') mark(document.querySelector(`#${side}-actions [data-role="main-btn"]`));
        if (target.area === 'equation' && game.turn === target.side) mark(getEquationZone(target.side).querySelector('.play-stage-grid'));
        if (target.area.startsWith('equation-') && game.turn === target.side) {
          const role = target.area === 'equation-hand' ? 'stage-hand-cards' : 'stage-center-cards';
          target.cardIds.forEach(id => mark(findCardIn(`#${side}-equation [data-role="${role}"]`, id)));
        }
        return elements;
      }
      guidance.focus.forEach(target => {
        resolveTarget(target).forEach(element => {
          element.setAttribute('data-tutorial-focus', target.area);
          targets.push(element);
        });
      });
      (guidance.context || []).forEach(target => context.push(...resolveTarget(target)));
      let nextAction = null;
      if (active) {
        document.querySelectorAll('[data-role="plan-continue-btn"]').forEach(button => { button.classList.add('hidden'); });
        if (tutorialGate) {
          const actions = document.getElementById('black-actions');
          actions.classList.add('is-guide-control');
          const button = actions.querySelector('[data-role="plan-continue-btn"]');
          actions.querySelectorAll('[data-role="operator-group"], [data-role="main-btn"], [data-role="giveup-btn"], [data-role="pass-btn"]').forEach(control => control.classList.add('hidden'));
          button.className = 'guide-next';
          const label = t('tutorial_continue');
          button.textContent = label;
          button.title = label;
          button.setAttribute('aria-label', label);
          button.setAttribute('aria-describedby', 'black-play-hint');
          button.setAttribute('data-tutorial-focus', 'continue');
          button.disabled = false;
          nextAction = button;
          const back = actions.querySelector('[data-role="guide-back-btn"]');
          back.hidden = tutorialSession.state.checkpoint.index === 0;
          back.disabled = back.hidden;
          back.setAttribute('aria-label', t('tutorial_back'));
          back.title = t('tutorial_back');
          if (!back.hidden) context.push(back);
        } else if (tutorialSession.state.stepIndex === 4 && game.state === 'PLAYING') {
          const help = document.querySelector('#black-actions [data-role="giveup-btn"]');
          help.classList.add('is-guide-help');
          help.textContent = t('tutorial_help');
          help.setAttribute('aria-label', t('tutorial_help'));
          help.title = t('tutorial_help');
          help.onclick = requestTutorialHelp;
          context.push(help);
        }
      }
      if (completedLesson) {
        const actions = document.getElementById('black-actions');
        actions.classList.add('is-guide-control');
        const button = actions.querySelector('[data-role="main-btn"]');
        button.className = 'guide-next';
        button.textContent = t('tutorial_play');
        button.dataset.guideAction = 'finish';
        button.setAttribute('aria-label', t('tutorial_play'));
        button.setAttribute('aria-describedby', 'black-play-hint');
        button.setAttribute('data-tutorial-focus', 'finish');
        nextAction = button;
      }
      if ((active || completedLesson) && !currentDialog) {
        tutorialSpotlight?.update({ hint, targets, context, action: nextAction, mode: guidance.mode, avoid: [...document.querySelectorAll('.utility-rail .table-icon')] });
      }
    }

    function renderHistory() {
      const area = document.getElementById('history-area');
      area.className = 'hidden';
      area.innerHTML = '';
      if (!game.lastMove) return;

      const { turn, witness, handCards = [], cardsA = [], cardsB = [], centerCards = [], op } = game.lastMove;
      const zone = getEquationZone(turn);
      if (!zone) return;

      if (witness?.success) {
        renderEquationWitness(zone, witness, false);
        return;
      }

      const handArea = zone.querySelector('[data-role="stage-hand-cards"]');
      const centerArea = zone.querySelector('[data-role="stage-center-cards"]');
      const handSlot = zone.querySelector('[data-role="stage-hand-slot"]');
      const centerSlot = zone.querySelector('[data-role="stage-center-slot"]');
      const operator = zone.querySelector('[data-role="stage-operator-symbol"]');
      const playedCards = handCards.length ? handCards : [...cardsA, ...cardsB];
      const targetCards = centerCards;
      if (!handArea || !centerArea || !handSlot || !centerSlot || !operator || !playedCards.length || !targetCards.length) return;
      handArea.className = 'play-stage-cards is-expression';
      centerArea.className = 'play-stage-cards is-expression';
      handArea.innerHTML = playedCards.map(card => generateCardHTML(card, 'history-hand')).join('');
      centerArea.innerHTML = targetCards.map(card => generateCardHTML(card, 'history-center')).join('');
      operator.innerText = op === '*' ? '×' : (op === '/' ? '÷' : (op || '?'));
      handSlot.classList.add('is-active');
      centerSlot.classList.add('is-active');
      zone.classList.add('is-working');
    }

    legacyHeader.setAttribute('aria-hidden', 'true');
    legacyHeader.querySelector('[data-home-link]')?.remove();

    const leftRail = document.createElement('div');
    leftRail.className = 'utility-rail utility-rail-left';
